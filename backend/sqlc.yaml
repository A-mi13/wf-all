# sqlc разбирает грамматику PostgreSQL 17: синтаксис PG18 в миграциях и запросах не используем.
# Новый модуль = новый элемент списка sql со своими queries/ и out.
#
# Риск из ревью Task 5 (sqlc может споткнуться на SQL River из 0011-0016 —
# `DO $body$ ... $body$ LANGUAGE plpgsql`, `ALTER TYPE ... ADD VALUE`) проверен
# и не подтвердился: sqlc 1.31.1 разбирает весь каталог migrations/ без ошибок.
# Явный список файлов 0001-0010 не потребовался.
version: '2'
sql:
  - engine: postgresql
    schema: migrations/
    queries: internal/platform/flags/queries/
    gen:
      go:
        package: flagsdb
        out: internal/platform/flags/flagsdb
        sql_package: pgx/v5
        emit_interface: true
        emit_pointers_for_null_types: true
        # только структуры таблиц/enum, реально используемые запросами пакета —
        # иначе models.go тянет всю схему (~2400 строк на один запрос).
        omit_unused_structs: true
        overrides:
          - db_type: geography
            go_type: string
          - db_type: geography
            nullable: true
            go_type: { type: string, pointer: true }
  - engine: postgresql
    schema: migrations/
    queries: internal/platform/events/queries/
    gen:
      go:
        package: eventsdb
        out: internal/platform/events/eventsdb
        sql_package: pgx/v5
        emit_interface: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: { import: github.com/google/uuid, type: UUID, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { type: time.Time, pointer: true }
          - db_type: geography
            go_type: string
          - db_type: geography
            nullable: true
            go_type: { type: string, pointer: true }
  - engine: postgresql
    schema: migrations/
    queries: internal/platform/audit/queries/
    gen:
      go:
        package: auditdb
        out: internal/platform/audit/auditdb
        sql_package: pgx/v5
        emit_interface: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: { import: github.com/google/uuid, type: UUID, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { type: time.Time, pointer: true }
          - db_type: geography
            go_type: string
          - db_type: geography
            nullable: true
            go_type: { type: string, pointer: true }
