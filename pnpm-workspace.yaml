packages:
  - apps/*
  - packages/*
  - contracts

# Общие версии. Две версии TypeScript: приложения на 6.0.3,
# генератор клиентов (openapi-typescript, peer ^5.x) — на 5.9.3.
catalog:
  typescript: 6.0.3
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/node': 26.6.5
  vitest: 5.0.5
  vite: 8.3.5
  eslint: 9.39.5
  prettier: 3.9.10
  typescript-eslint: 8.72.0
catalogs:
  contracts:
    typescript: 5.9.3

# pnpm run/exec не доустанавливают зависимости молча (по умолчанию — install):
# несколько агентов и хук pre-commit запускают pnpm параллельно, и неявные установки
# гонялись бы в node_modules. Устаревший node_modules — громкая ошибка, чинится явным pnpm install.
verifyDepsBeforeRun: error

# pnpm 12: пакет со скриптом установки, которого нет в списке, роняет install.
allowBuilds:
  lefthook: true
  msw: false
  '@parcel/watcher': false
  '@swc/core': false
  unrs-resolver: false
