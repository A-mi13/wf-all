components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-wf_admin_session
      description: >-
        Cookie сессии сотрудника (HttpOnly; Secure; SameSite=Strict; Path=/). Ставят и меняют ответы
        входа, второго фактора, разблокировки, принятия приглашения и завершения настройки 2FA;
        стирает выход. Скрипту страницы недоступна — браузер шлёт её сам
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ одного действия пользователя; повтор с тем же ключом не исполняется дважды
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: 7f3c9a52-2d4e-4b8a-9c11-5e0d6f8b2a47
    AdminHeader:
      name: X-WF-Admin
      in: header
      required: true
      description: >-
        Всегда 1 — запрос отправлен страницей админки. Вместе с Origin админки защищает изменяющие
        запросы от подделки с чужого сайта; без заголовка — 403 auth.csrf_failed
      schema:
        type: string
        pattern: '^1$'
      example: '1'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >-
        Языки по RFC 9110 с q-весами; названия — на первом поддерживаемом (ru, en; регион
        отбрасывается). Без заголовка или без поддерживаемого языка — на языке страны каждой записи.
        Админка шлёт язык своего интерфейса
      schema:
        type: string
      example: 'ru-RU,ru;q=0.9,en;q=0.8'
    StaffId:
      name: staffId
      in: path
      required: true
      description: Id учётки сотрудника
      schema:
        type: string
        format: uuid
      example: 0192f1c4-7a3e-7b21-9c5d-3e8f1a2b4c6d
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Id сессии сотрудника — из списка «Мой доступ»
      schema:
        type: string
        format: uuid
      example: 0192f1d0-1b2c-7d3e-8f4a-5b6c7d8e9f01
    ApprovalId:
      name: approvalId
      in: path
      required: true
      description: Id запроса на подтверждение
      schema:
        type: string
        format: uuid
      example: 0192f1e2-4c5d-7e6f-a081-92b3c4d5e6f7
    Cursor:
      name: cursor
      in: query
      required: false
      description: Курсор следующей страницы — next_cursor из предыдущего ответа; без него — первая страница
      schema:
        type: string
        maxLength: 1024
      example: eyJ2IjoxLCJrIjpbIjIwMjYtMTAtMDFUMTc6MDA6MDBaIiwiMDE5MmYxYzQiXX0
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы, от 1 до 100; без параметра — 20
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  headers:
    SetSessionCookie:
      description: >-
        Новый токен сессии: прежний больше не действует. Имя — __Host-wf_admin_session, cookie
        сессионная (без Max-Age и Expires) — сроки держит сервер
      required: true
      schema:
        type: string
      example: '__Host-wf_admin_session=k3Jd9Qx2Lm7Vb4Np8Rt1Zw6Yc0Hs5Ae; Path=/; HttpOnly; Secure; SameSite=Strict'
    ClearSessionCookie:
      description: Стирание cookie сессии — браузер удаляет её сразу (Max-Age=0)
      required: true
      schema:
        type: string
      example: '__Host-wf_admin_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict'
    CacheNoStore:
      description: Ответ с секретом — не кэшируется нигде, в том числе браузером
      required: true
      schema:
        type: string
      example: no-store
    CachePrivate:
      description: Ответ зависит от сотрудника и его прав — общим кэшам и браузеру его не хранить
      required: true
      schema:
        type: string
      example: 'private, no-store'
    Vary:
      description: Всегда Accept-Language — ответ зависит от языка
      required: true
      schema:
        type: string
      example: Accept-Language
    ContentLanguage:
      description: >-
        Язык названий в ответе (ru или en). Заголовка нет — поддерживаемый язык не выбран, названия
        на языке страны каждой записи
      required: false
      schema:
        type: string
      example: ru
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      headers:
        Retry-After:
          description: Через сколько секунд повторить — только у 429 ratelimit.exceeded
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Ошибка по RFC 9457. Решение принимается по code, тексты — для разработчика
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: Тип проблемы по RFC 9457; сейчас всегда about:blank — смысл несёт code
          example: about:blank
        title:
          type: string
          description: Техническая сводка — текст HTTP-статуса; пользователю не показывать
          example: Bad Request
        status:
          type: integer
          description: HTTP-статус ответа, продублированный в теле
          example: 400
        code:
          type: string
          description: Стабильный машинный код ошибки; клиенты переводят текст по нему
          example: validation.failed
        detail:
          type: string
          description: Уточнение для разработчика; приходит не всегда, пользователю не показывать
          example: Тело запроса не разбирается как JSON
        request_id:
          type: string
          description: Id запроса — по нему запрос находится в логах сервера
          example: wf-api-7d9f/Yx3kQp1bZt-000042
        errors:
          type: array
          description: Ошибки по полям — только у validation.failed
          items:
            type: object
            required: [field, code]
            additionalProperties: false
            properties:
              field:
                type: string
                description: 'body.<путь через точку>, query.<имя>, path.<имя> или header.<имя>'
                example: body.name
              code:
                type: string
                description: 'Нарушенное правило схемы: required, minLength, maximum, enum, format…'
                example: minLength
        attempts_left:
          type: integer
          minimum: 0
          description: >-
            Сколько попыток осталось до блокировки — только у ошибок неверного кода или пароля, после
            которых число попыток ограничено; 0 — попыток больше нет, доступ закрыт на время
          example: 3
        retry_after:
          type: integer
          minimum: 1
          description: >-
            Через сколько секунд повторить — у ошибок с ожиданием; то же значение, что в заголовке
            Retry-After, для клиента, которому заголовок недоступен
          example: 60
        challenge:
          type: object
          description: >-
            Задача антибота — только у humancheck.required. Формат протокола ALTCHA, поля в
            camelCase, как их ждёт виджет ALTCHA: найдите число от 0 до maxNumber, при котором
            SHA-256(salt + число) в hex равен challenge, и повторите запрос с решением в заголовке
            X-WF-Humancheck (base64 от JSON с полями algorithm, challenge, number, salt, signature)
          required: [algorithm, challenge, maxNumber, salt, signature]
          additionalProperties: false
          properties:
            algorithm:
              type: string
              description: Хеш-функция задачи; сейчас всегда SHA-256
              example: SHA-256
            challenge:
              type: string
              description: SHA-256 от salt и искомого числа, hex
              example: 4d5b2c0e7f9a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8c
            maxNumber:
              type: integer
              format: int64
              description: Верхняя граница перебора
              example: 100000
            salt:
              type: string
              description: Соль с параметрами срока задачи (expires, Unix-время) и ключа подписи (kid)
              example: 'b1946ac92492d2347c62?expires=1790000000&kid=Hx3k9QpLm2s&'
            signature:
              type: string
              description: HMAC-SHA-256 задачи на ключе сервера, hex
              example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
