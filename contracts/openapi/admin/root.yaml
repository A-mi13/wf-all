# API админки (admin-api) — исходник контракта (спека бэкенда §8.1). Потребитель — только
# apps/admin. Бандл ../admin.yaml собирает `pnpm --filter @wf/contracts bundle` (redocly);
# он коммитится и руками не правится. Операции модуля — <модуль>/paths.yaml, тег = имя
# модуля-реализатора (internal/<модуль>/admin); схемы — <модуль>/schemas.yaml, каждая
# регистрируется ниже в components.schemas.
# Схема Problem продублирована в public/root.yaml намеренно (контракты версионируются
# независимо); тест бандлов в contracts/ падает после сборки, если копии разошлись.
openapi: 3.0.3
info:
  title: WF admin API
  version: 0.1.0
  description: |
    API админки (admin-api); потребитель — только apps/admin. Аутентификация — cookie сессии
    `wf_admin_session`, которую ставит вход в админку.

    Общие правила для всех операций:

    - **Ошибки** — `application/problem+json` (RFC 9457, схема `Problem`). Клиент решает
      по полю `code` и переводит текст по нему; `title` и `detail` — для разработчика, не
      для показа. Коды, общие для всех операций: `internal`, `request.invalid`,
      `request.too_large`, `validation.failed` (со списком полей в `errors`),
      `http.not_found`, `http.method_not_allowed`. Свои коды операции — в её описании.
      Механизмы платформы: `auth.unauthenticated` (401 — нет действующего входа, войдите
      заново), `ratelimit.exceeded` (429 — повторите через `Retry-After` секунд),
      `humancheck.required` (403 — решите задачу из поля `challenge` и повторите запрос с
      решением в заголовке `X-WF-Humancheck`), `idempotency.key_reused` (422 — ключ уже
      использован с другим запросом), `idempotency.in_progress` (409 — запрос с этим ключом ещё
      выполняется), `idempotency.replay_unavailable` (409 — действие выполнено, перечитайте
      состояние), `feature.disabled` (403 — функция выключена флагом).
    - **Idempotency-Key** — обязательный заголовок мутирующих операций: новый ключ (UUID) на
      каждое действие пользователя, тот же ключ при повторе после обрыва сети — действие не
      выполнится дважды.
    - **Время** — ISO 8601 в UTC (`2026-10-01T17:00:00Z`); местное время матча считается по
      таймзоне города или поля.
    - **Деньги** — целое число в минорных единицах (копейки) плюс код валюты ISO 4217.
    - **Тело запроса** — не больше 1 МиБ.
    - Поле `request_id` в ошибке — назовите его, сообщая о проблеме: по нему находится запрос в логах.
tags:
  - name: platform
    description: Служебные операции платформы — живость сервиса и подобное, не сценарии админки
# Аутентификация по умолчанию; анонимная операция объявляет `security: []`.
security:
  - session: []
# Коды ошибок платформы — их может вернуть любая операция; у операций — свои x-error-codes.
x-error-codes-common:
  - internal
  - request.invalid
  - request.too_large
  - validation.failed
  - http.not_found
  - http.method_not_allowed
  - auth.unauthenticated
  - ratelimit.exceeded
  - humancheck.required
  - idempotency.key_reused
  - idempotency.in_progress
  - idempotency.replay_unavailable
  - feature.disabled
# Анонимные мутирующие операции — закрытый список operationId. В админке он пуст:
# Idempotency-Key обязателен у всех мутирующих операций (спека бэкенда §6.4).
x-anonymous-mutations: []
paths:
  /v1/health:
    $ref: './platform/paths.yaml#/health'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: wf_admin_session
      description: Cookie сессии админки; ставится при входе
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ одного действия пользователя; повтор с тем же ключом не исполняется дважды
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: 7f3c9a52-2d4e-4b8a-9c11-5e0d6f8b2a47
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      headers:
        Retry-After:
          description: Через сколько секунд повторить — только у 429 ratelimit.exceeded
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Ошибка по RFC 9457. Решение принимается по code, тексты — для разработчика
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: Тип проблемы по RFC 9457; сейчас всегда about:blank — смысл несёт code
          example: about:blank
        title:
          type: string
          description: Техническая сводка — текст HTTP-статуса; пользователю не показывать
          example: Bad Request
        status:
          type: integer
          description: HTTP-статус ответа, продублированный в теле
          example: 400
        code:
          type: string
          description: Стабильный машинный код ошибки; клиенты переводят текст по нему
          example: validation.failed
        detail:
          type: string
          description: Уточнение для разработчика; приходит не всегда, пользователю не показывать
          example: Тело запроса не разбирается как JSON
        request_id:
          type: string
          description: Id запроса — по нему запрос находится в логах сервера
          example: wf-api-7d9f/Yx3kQp1bZt-000042
        errors:
          type: array
          description: Ошибки по полям — только у validation.failed
          items:
            type: object
            required: [field, code]
            additionalProperties: false
            properties:
              field:
                type: string
                description: 'body.<путь через точку>, query.<имя>, path.<имя> или header.<имя>'
                example: body.name
              code:
                type: string
                description: 'Нарушенное правило схемы: required, minLength, maximum, enum, format…'
                example: minLength
        challenge:
          type: object
          description: >-
            Задача антибота — только у humancheck.required. Формат протокола ALTCHA, поля в
            camelCase, как их ждёт виджет ALTCHA: найдите число от 0 до maxNumber, при котором
            SHA-256(salt + число) в hex равен challenge, и повторите запрос с решением в заголовке
            X-WF-Humancheck (base64 от JSON с полями algorithm, challenge, number, salt, signature)
          required: [algorithm, challenge, maxNumber, salt, signature]
          additionalProperties: false
          properties:
            algorithm:
              type: string
              description: Хеш-функция задачи; сейчас всегда SHA-256
              example: SHA-256
            challenge:
              type: string
              description: SHA-256 от salt и искомого числа, hex
              example: 4d5b2c0e7f9a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8c
            maxNumber:
              type: integer
              format: int64
              description: Верхняя граница перебора
              example: 100000
            salt:
              type: string
              description: Соль с параметрами срока задачи (expires, Unix-время) и ключа подписи (kid)
              example: 'b1946ac92492d2347c62?expires=1790000000&kid=Hx3k9QpLm2s&'
            signature:
              type: string
              description: HMAC-SHA-256 задачи на ключе сервера, hex
              example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    Health:
      $ref: './platform/schemas.yaml#/Health'
