# Схемы платформы админки: подтверждения вдвоём (спека сотрудников §4.8), журнал действий (§5.3),
# версии приложения и флаги функций (§6.1, план B Task 7).
# Каждая регистрируется в ../root.yaml components.schemas.
ApprovalAction:
  type: string
  description: >-
    Действие запроса на подтверждение — подпись берётся из локалей админки
    (approvals.actions.<действие>). staff.invite — приглашение; staff.role_change — смена роли или
    городов; staff.access_reset — сброс доступа; staff.revoke_owner — выключение владельца;
    geo.country_rules — правила страны (валюта, возрастные пороги, выключение); geo.country_create —
    новая страна
  enum:
    - staff.invite
    - staff.role_change
    - staff.access_reset
    - staff.revoke_owner
    - geo.country_rules
    - geo.country_create
  x-extensible-enum: true
ApprovalStatus:
  type: string
  description: >-
    Состояние запроса. pending — ждёт решения (24 часа); executed — подтверждён и исполнен;
    rejected — отклонён; cancelled — отозван инициатором или погашен системой; expired — истёк
    срок; failed — подтверждён, но не исполнился (причина в error)
  enum: [pending, executed, rejected, cancelled, expired, failed]
  x-extensible-enum: true
ApprovalActor:
  type: object
  description: Сотрудник в запросе — id и снимок имени на момент действия
  required: [id, label]
  properties:
    id:
      type: string
      format: uuid
      description: Id учётки сотрудника
      example: 0192f1c4-7a3e-7b21-9c5d-3e8f1a2b4c6d
    label:
      type: string
      description: Имя сотрудника на момент действия
      example: Ольга В.
Approval:
  type: object
  description: Запрос на подтверждение действия «вдвоём»
  required:
    - id
    - action
    - permission
    - status
    - payload
    - target_id
    - scope_city_id
    - requested_by
    - requested_at
    - expires_at
    - decided_by
    - decided_at
    - comment
    - error
  properties:
    id:
      type: string
      format: uuid
      description: Id запроса
      example: 0192f1e2-4c5d-7e6f-a081-92b3c4d5e6f7
    action:
      $ref: '../root.yaml#/components/schemas/ApprovalAction'
    permission:
      type: string
      description: Право, которое нужно подтверждающему (ключ матрицы)
      example: staff.roles.grant
    status:
      $ref: '../root.yaml#/components/schemas/ApprovalStatus'
    payload:
      type: object
      additionalProperties: true
      description: >-
        Что именно будет сделано — поля зависят от действия (почта, имя, роль, города, причина);
        v — версия формата
      example:
        v: 1
        email: ivan.p@wf.example
        display_name: Иван П.
        role: moderator
        city_ids: [3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47]
    target_id:
      type: string
      format: uuid
      nullable: true
      description: Сотрудник-цель; null — цели ещё нет (приглашение новой учётки)
      example: null
    scope_city_id:
      type: string
      format: uuid
      nullable: true
      description: Город запроса — подтверждают сотрудники с этим городом; null — без города
      example: null
    requested_by:
      $ref: '../root.yaml#/components/schemas/ApprovalActor'
    requested_at:
      type: string
      format: date-time
      description: Когда запрос создан
      example: '2026-10-13T09:15:00Z'
    expires_at:
      type: string
      format: date-time
      description: До какого времени запрос можно решить (24 часа)
      example: '2026-10-14T09:15:00Z'
    decided_by:
      type: object
      nullable: true
      description: Кто решил (подтвердил, отклонил или отменил); null — ещё не решён или решила система
      allOf:
        - $ref: '../root.yaml#/components/schemas/ApprovalActor'
    decided_at:
      type: string
      format: date-time
      nullable: true
      description: Когда решён; null — ещё ждёт решения
      example: null
    comment:
      type: string
      nullable: true
      description: Комментарий к решению; null — без комментария
      example: null
    error:
      type: string
      nullable: true
      description: Почему не исполнился (status failed) или почему погашен системой; null — без ошибки
      example: null
ApprovalAccepted:
  type: object
  description: Действие не исполнено сразу — создан запрос на подтверждение вторым сотрудником
  required: [approval]
  properties:
    approval:
      $ref: '../root.yaml#/components/schemas/Approval'
ApprovalPage:
  type: object
  description: Страница запросов на подтверждение
  required: [items, next_cursor]
  properties:
    items:
      type: array
      description: Запросы страницы
      items:
        $ref: '../root.yaml#/components/schemas/Approval'
    next_cursor:
      type: string
      nullable: true
      description: Курсор следующей страницы; null — страниц больше нет
      example: eyJ2IjoxLCJrIjpbIjIwMjYtMTAtMTNUMDk6MTU6MDBaIiwiMDE5MmYxZTIiXX0
ApprovalApprove:
  type: object
  description: Решение «подтвердить»
  additionalProperties: false
  properties:
    comment:
      type: string
      maxLength: 500
      description: Комментарий к подтверждению — попадает в журнал
      example: Проверила с Иваном лично
ApprovalReject:
  type: object
  description: Решение «отклонить»
  required: [comment]
  additionalProperties: false
  properties:
    comment:
      type: string
      minLength: 1
      maxLength: 500
      description: Почему отклонено — увидит инициатор, попадает в журнал
      example: Город модератору выдаём после испытательного срока
AuditRecord:
  type: object
  description: Запись журнала действий
  required:
    - id
    - created_at
    - action
    - object_type
    - object_id
    - actor_user_id
    - actor_staff_id
    - actor_role
    - actor_label
    - scope_city_id
    - reason
    - ip
    - user_agent
    - before
    - after
  properties:
    id:
      type: string
      format: uuid
      description: Id записи
      example: 0192f1f0-8a9b-7c0d-9e1f-2a3b4c5d6e7f
    created_at:
      type: string
      format: date-time
      description: Когда сделано
      example: '2026-10-13T09:20:00Z'
    action:
      type: string
      description: Код действия <модуль>.<действие> — подпись в локалях админки
      example: staff.role_granted
    object_type:
      type: string
      description: Вид объекта действия
      example: staff_account
    object_id:
      type: string
      format: uuid
      nullable: true
      description: Id объекта; null — действие без объекта (например, неудачный вход)
      example: 0192f1c4-7a3e-7b21-9c5d-3e8f1a2b4c6d
    actor_user_id:
      type: string
      format: uuid
      nullable: true
      description: Игрок-автор действия; null — автор не игрок
      example: null
    actor_staff_id:
      type: string
      format: uuid
      nullable: true
      description: Сотрудник-автор действия; null — автор не сотрудник
      example: 0192f1c4-7a3e-7b21-9c5d-3e8f1a2b4c6d
    actor_role:
      type: string
      nullable: true
      description: >-
        Роль автора на момент действия (роль сотрудника или игрока) либо system, operator,
        anonymous — без автора-человека
      example: owner
    actor_label:
      type: string
      nullable: true
      description: «Кто» — имя на момент действия; operator — оператор сервера, system — платформа
      example: Ольга В.
    scope_city_id:
      type: string
      format: uuid
      nullable: true
      description: Город записи — по нему модератор видит журнал своих городов; null — без города
      example: null
    reason:
      type: string
      nullable: true
      description: Причина действия (код причины и комментарий); null — без причины
      example: 'left_team: перешёл в другой проект'
    ip:
      type: string
      nullable: true
      description: Сеть автора — подсеть /24 (IPv4) или /48 (IPv6); null — неизвестна
      example: 203.0.113.0/24
    user_agent:
      type: string
      nullable: true
      description: Браузер автора (User-Agent); null — неизвестен
      example: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Safari/605.1.15'
    before:
      type: object
      nullable: true
      additionalProperties: true
      description: Было — значимые поля до действия, персональные данные замаскированы; null — объекта не было
      example:
        role: support
        city_ids: []
    after:
      type: object
      nullable: true
      additionalProperties: true
      description: Стало — значимые поля после действия, персональные данные замаскированы; null — объект удалён
      example:
        role: moderator
        city_ids: [3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47]
AuditPage:
  type: object
  description: Страница журнала действий
  required: [items, next_cursor]
  properties:
    items:
      type: array
      description: Записи страницы, новые сверху
      items:
        $ref: '../root.yaml#/components/schemas/AuditRecord'
    next_cursor:
      type: string
      nullable: true
      description: Курсор следующей страницы; null — страниц больше нет
      example: eyJ2IjoxLCJrIjpbIjIwMjYtMTAtMTNUMDk6MjA6MDBaIiwiMDE5MmYxZjAiXX0
AppPlatform:
  type: string
  description: >-
    Платформа мобильного приложения. Список открытый в ответах; в пути незнакомое значение — 400
    validation.failed (валидатор запросов его отвергает)
  enum: [ios, android]
  x-extensible-enum: true
AppVersions:
  type: object
  description: >-
    Версии приложения платформы. Версии, ссылка, version и updated_at — null, если версии для
    платформы ещё не заводили (приложение работает без проверки)
  required: [platform, min_version, recommended_version, store_url, version, updated_at]
  properties:
    platform:
      $ref: '../root.yaml#/components/schemas/AppPlatform'
    min_version:
      type: string
      nullable: true
      pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
      description: Минимальная версия MAJOR.MINOR.PATCH — ниже неё приложение требует обновиться
      example: 1.4.0
    recommended_version:
      type: string
      nullable: true
      pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
      description: Рекомендуемая версия — ниже неё приложение предлагает обновиться; не ниже min_version
      example: 1.6.2
    store_url:
      type: string
      nullable: true
      description: Страница приложения в магазине платформы (App Store, Google Play)
      example: https://apps.apple.com/app/id6740000000
    version:
      type: integer
      format: int64
      minimum: 1
      nullable: true
      description: Версия записи — растёт на каждую правку (справочно); null — версии не заводили
      example: 3
    updated_at:
      type: string
      format: date-time
      nullable: true
      description: Когда версии меняли последний раз; null — не заводили
      example: '2026-10-27T15:40:00Z'
AppVersionsList:
  type: object
  description: Версии обеих платформ — всегда два элемента, ios и android
  required: [items]
  properties:
    items:
      type: array
      description: Версии по платформам
      items:
        $ref: '../root.yaml#/components/schemas/AppVersions'
AppVersionsPut:
  type: object
  description: Версии платформы целиком — все три поля обязательны
  required: [min_version, recommended_version, store_url]
  additionalProperties: false
  properties:
    min_version:
      type: string
      pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
      description: Минимальная версия MAJOR.MINOR.PATCH (без ведущих нулей и сборки)
      example: 1.4.0
    recommended_version:
      type: string
      pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
      description: Рекомендуемая версия MAJOR.MINOR.PATCH, не ниже min_version
      example: 1.6.2
    store_url:
      type: string
      maxLength: 2048
      pattern: '^https://'
      description: >-
        Страница приложения в магазине: https:// в нижнем регистре, без пробелов и управляющих
        символов, хост стора платформы — apps.apple.com (ios) или play.google.com (android)
      example: https://apps.apple.com/app/id6740000000
FeatureFlagKey:
  type: string
  description: >-
    Ключ флага функции — подпись в локалях админки (flags.<ключ>.title и .note). Список открытый:
    флаг из новой миграции, которого нет в этом списке, приходит своим ключом — экран показывает
    сам ключ. Только в ответах: путь updateFeatureFlag принимает любой ключ по шаблону
  enum:
    - subscriptions
    - economy
    - lootboxes
    - predictions
    - competitions
    - city_tables
    - challenges
    - match_comments
    - payment_flags
    - ads
    - gk_rotation
  x-extensible-enum: true
FeatureFlag:
  type: object
  description: >-
    Флаг функции. Функция включена в городе, если флаг включён везде или город в enabled_city_ids
  required: [key, description, enabled_globally, enabled_city_ids, version, updated_at]
  properties:
    key:
      $ref: '../root.yaml#/components/schemas/FeatureFlagKey'
    description:
      type: string
      description: Описание флага для разработчика (из миграции); экрану — подпись из локалей
      example: Очки, кредиты, косметика
    enabled_globally:
      type: boolean
      description: Включён во всех городах
      example: false
    enabled_city_ids:
      type: array
      description: Города, где флаг включён, когда он не включён везде; по возрастанию id
      items:
        type: string
        format: uuid
      example: [3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47]
    version:
      type: integer
      format: int64
      minimum: 1
      description: Версия флага — передайте её в updateFeatureFlag; растёт на каждую правку
      example: 2
    updated_at:
      type: string
      format: date-time
      description: Когда флаг меняли последний раз
      example: '2026-10-27T15:40:00Z'
FeatureFlagList:
  type: object
  description: Все флаги функций по ключу
  required: [items]
  properties:
    items:
      type: array
      description: Флаги
      items:
        $ref: '../root.yaml#/components/schemas/FeatureFlag'
FeatureFlagPatch:
  type: object
  description: >-
    Правка флага: версия, которую видел экран, и новые значения (присланные поля); без
    enabled_globally и enabled_city_ids — ничего не меняется
  required: [version]
  additionalProperties: false
  properties:
    version:
      type: integer
      format: int64
      minimum: 1
      description: >-
        Версия флага из listFeatureFlags; флаг с тех пор изменили — 409 platform.flag_stale
      example: 2
    enabled_globally:
      type: boolean
      description: Включить во всех городах (true) или только в enabled_city_ids (false)
      example: false
    enabled_city_ids:
      type: array
      maxItems: 1000
      description: >-
        Города, где флаг включён, — список целиком, заменяет прежний; повторы схлопываются; пусто —
        ни одного города. Несуществующий город — 422 platform.flag_city_not_found
      items:
        type: string
        format: uuid
      example: [3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47, 7a1d5e9c-2b4f-4c8a-b3e6-1f0d9c8b7a65]
