  /v1/identity/captain-applications/{applicationId}/approve:
    post:
      operationId: approveCaptainApplication
      tags:
        - identity
      x-permission: identity.captain_applications.decide
      x-error-codes:
        - identity.application_not_found
        - identity.application_closed
        - identity.captain_ineligible
        - identity.self_action
      summary: Одобрить заявку
      description: |
        Одобрение — одной транзакцией: условия капитанства перепроверяются в момент решения, игрок
        получает допуск капитана в городе заявки (с испытательным сроком), заявка — `approved`; запись в
        журнал, письмо игроку. Подтверждения вдвоём нет: решение обратимо (допуск отзывает модерация).
        Модератор решает только заявки своих городов. Ответ — решённая заявка.

        Коды ошибок:
        - 404 `identity.application_not_found` — заявки нет; модератору — и заявка чужого города.
        - 409 `identity.application_closed` — заявка уже решена или отозвана.
        - 409 `identity.captain_ineligible` — условия перестали выполняться (`reasons`); в том числе
          `checks_unavailable` — проверка ещё не запущена.
        - 409 `identity.self_action` — заявитель — ваша собственная учётка игрока
          (связь «сотрудник → игрок»): решение о себе принимает другой сотрудник.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Комментарий к решению — необязателен
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityCaptainApprove'
      responses:
        '200':
          description: Заявка одобрена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityCaptainApplication'
        default:
          $ref: '#/components/responses/Problem'
  /v1/identity/captain-applications/{applicationId}/reject:
    post:
      operationId: rejectCaptainApplication
      tags:
        - identity
      x-permission: identity.captain_applications.decide
      x-error-codes:
        - identity.application_not_found
        - identity.application_closed
        - identity.self_action
      summary: Отклонить заявку
      description: |
        Отказ с кодом причины из списка и комментарием; заявка — `rejected`, запись в журнал, письмо
        игроку. Повторную заявку игрок подаст не раньше чем через 7 дней. Модератор решает только
        заявки своих городов. Ответ — решённая заявка.

        Комментарий обязателен при `rejection_code = other`: без него — 422 `validation.failed` по
        полю `body.comment` (правило `required`).

        Коды ошибок:
        - 404 `identity.application_not_found` — заявки нет; модератору — и заявка чужого города.
        - 409 `identity.application_closed` — заявка уже решена или отозвана.
        - 409 `identity.self_action` — заявитель — ваша собственная учётка игрока
          (связь «сотрудник → игрок»).
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Код причины и комментарий
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityCaptainReject'
      responses:
        '200':
          description: Заявка отклонена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityCaptainApplication'
        default:
          $ref: '#/components/responses/Problem'
  /v1/identity/auth-methods/usage:
    get:
      operationId: getAuthMethodsUsage
      tags:
        - identity
      x-permission: platform.flags.read
      x-error-codes: []
      summary: Сколько игроков входят каждым способом
      description: |
        Экран «Флаги функций»: по способам `apple`, `google`, `passkeys` — сколько игроков входят только
        им (`only_method`) и у скольких он есть всего (`linked`). Перед выключением аварийного флага
        (`auth_*_login`) экран показывает `only_method`: этим игрокам останется только «Забыли пароль?».
      responses:
        '200':
          description: Статистика способов входа
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuthMethodsUsage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/identity/users/lookup:
    get:
      operationId: findPlayerByEmail
      tags:
        - identity
      x-permission: identity.pii.read
      x-error-codes:
        - identity.user_not_found
      summary: Найти игрока по почте
      description: |
        Поддержка: точный поиск игрока по почте — ник, город, статус, есть ли 2FA и назначенный сброс.
        Почта (`X-WF-Lookup-Email`) и причина (`X-WF-Access-Reason`) обязательны всем и идут
        заголовками, не в query (URL и журналы прокси не несут ПД, CWE-598); значения — UTF-8 в
        percent-encoding (`encodeURIComponent`). Каждое чтение пишется в журнал с причиной. Модератору —
        только игроки его городов.

        Коды ошибок:
        - 404 `identity.user_not_found` — игрока с такой почтой нет; модератору — и игрок чужого города.
        - 400 `validation.failed` по полю `header.X-WF-Lookup-Email` или `header.X-WF-Access-Reason` —
          нет заголовка, значение не закодировано или кодировка битая; 422 `validation.failed` по тому
          же полю — после декодирования почта длиннее 254 байт, причина короче 3 или длиннее 200
          символов.
      parameters:
        - $ref: '#/components/parameters/LookupEmail'
        - $ref: '#/components/parameters/AccessReason'
      responses:
        '200':
          description: Игрок
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityPlayerLookup'
        default:
          $ref: '#/components/responses/Problem'
  /v1/identity/users/{userId}/mfa-reset:
    post:
      operationId: requestMfaReset
      tags:
        - identity
      x-permission: identity.mfa.reset
      x-error-codes:
        - identity.user_not_found
        - identity.self_action
        - identity.mfa_not_enabled
        - identity.mfa_reset_pending
      summary: Запросить сброс 2FA игрока
      description: |
        Поддержка, когда игрок потерял все вторые факторы (TOTP, резервные коды, ключи доступа) и
        личность проверена по регламенту. Всегда вдвоём: ответ 202 с запросом на подтверждение
        (действие `identity.mfa_reset`), второй сотрудник решает его во «Входящих» подтверждений.
        После подтверждения — 7 дней ожидания с письмом владельцу: любой вход владельца со вторым
        фактором или «Отменить» в его настройках отменяет сброс; по истечении 2FA снимается, сессии
        игрока отзываются.

        Коды ошибок:
        - 404 `identity.user_not_found` — игрока нет.
        - 409 `identity.self_action` — цель — ваша собственная учётка игрока
          (связь «сотрудник → игрок»).
        - 409 `identity.mfa_not_enabled` — у игрока нет 2FA — сбрасывать нечего.
        - 409 `identity.mfa_reset_pending` — сброс уже назначен (дата — в `findPlayerByEmail`).
        Если к моменту подтверждения у игрока уже нет 2FA или сброс уже назначен, подтверждение
        ответит 409 `platform.approval_stale`.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Причина и номер обращения
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityMfaResetRequest'
      responses:
        '202':
          description: Создан запрос на подтверждение сброса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /v1/identity/mfa-resets/{resetId}/cancel:
    post:
      operationId: cancelMfaReset
      tags:
        - identity
      x-permission: identity.mfa.reset
      x-error-codes:
        - identity.mfa_reset_not_found
        - identity.self_action
      summary: Отменить назначенный сброс 2FA
      description: |
        Отмена назначенного (подтверждённого, ждущего 7 дней) сброса 2FA игрока — сразу, без второго
        сотрудника: отмена привилегий не даёт. Владельцу уходит письмо, запись в журнал. Ответ — id
        сброса и время отмены.

        Коды ошибок:
        - 404 `identity.mfa_reset_not_found` — сброса нет, он уже выполнен или отменён.
        - 409 `identity.self_action` — сброс вашей собственной учётки игрока
          (связь «сотрудник → игрок»).
      parameters:
        - $ref: '#/components/parameters/ResetId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      responses:
        '200':
          description: Сброс отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityMfaResetCancelled'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-wf_admin_session
      description: Cookie сессии сотрудника (HttpOnly; Secure; SameSite=Strict; Path=/). Ставят и меняют ответы входа, второго фактора, разблокировки, принятия приглашения и завершения настройки 2FA; стирает выход. Скрипту страницы недоступна — браузер шлёт её сам
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ одного действия пользователя; повтор с тем же ключом не исполняется дважды
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: 7f3c9a52-2d4e-4b8a-9c11-5e0d6f8b2a47
    AdminHeader:
      name: X-WF-Admin
      in: header
      required: true
      description: Всегда 1 — запрос отправлен страницей админки. Вместе с Origin админки защищает изменяющие запросы от подделки с чужого сайта; без заголовка — 403 auth.csrf_failed
      schema:
        type: string
        pattern: ^1$
      example: '1'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Языки по RFC 9110 с q-весами; названия — на первом поддерживаемом (ru, en; регион отбрасывается). Без заголовка или без поддерживаемого языка — на языке страны каждой записи. Админка шлёт язык своего интерфейса
      schema:
        type: string
      example: ru-RU,ru;q=0.9,en;q=0.8
    StaffId:
      name: staffId
      in: path
      required: true
      description: Id учётки сотрудника
      schema:
        type: string
        format: uuid
      example: 0192f1c4-7a3e-7b21-9c5d-3e8f1a2b4c6d
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Id сессии сотрудника — из списка «Мой доступ»
      schema:
        type: string
        format: uuid
      example: 0192f1d0-1b2c-7d3e-8f4a-5b6c7d8e9f01
    ApprovalId:
      name: approvalId
      in: path
      required: true
      description: Id запроса на подтверждение
      schema:
        type: string
        format: uuid
      example: 0192f1e2-4c5d-7e6f-a081-92b3c4d5e6f7
    CityId:
      name: cityId
      in: path
      required: true
      description: Id города платформы
      schema:
        type: string
        format: uuid
      example: 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
    DistrictId:
      name: districtId
      in: path
      required: true
      description: Id района города пути
      schema:
        type: string
        format: uuid
      example: c1d9e3a7-5b2f-4a8c-8e6d-0f4b7a2c9e15
    CountryCode:
      name: code
      in: path
      required: true
      description: Код страны ISO 3166-1 alpha-2 заглавными
      schema:
        type: string
        pattern: ^[A-Z]{2}$
      example: RU
    ImportId:
      name: importId
      in: path
      required: true
      description: Id строки журнала импорта GeoNames
      schema:
        type: string
        format: uuid
      example: 0192f2a0-3c4d-7e5f-8a9b-0c1d2e3f4a5b
    JobId:
      name: jobId
      in: path
      required: true
      description: Id задачи импорта в очереди — job_id из startGeoImport
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1842
    AppPlatformPath:
      name: platform
      in: path
      required: true
      description: Платформа приложения — ios или android
      schema:
        $ref: '#/components/schemas/AppPlatform'
      example: ios
    FlagKey:
      name: key
      in: path
      required: true
      description: 'Ключ флага функции — строка, а не список (флаг из новой миграции переключается без правки контракта): латиница в нижнем регистре, цифры и «_», с буквы, до 64 символов'
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]*$
        maxLength: 64
      example: economy
    Cursor:
      name: cursor
      in: query
      required: false
      description: Курсор следующей страницы — next_cursor из предыдущего ответа; без него — первая страница
      schema:
        type: string
        maxLength: 1024
      example: eyJ2IjoxLCJrIjpbIjIwMjYtMTAtMDFUMTc6MDA6MDBaIiwiMDE5MmYxYzQiXX0
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы, от 1 до 100; без параметра — 20
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Id заявки в капитаны
      schema:
        type: string
        format: uuid
      example: 0193a1c9-7f80-7d91-8a1b-2c3d4e5f6a78
    UserId:
      name: userId
      in: path
      required: true
      description: Id учётки игрока — из findPlayerByEmail
      schema:
        type: string
        format: uuid
      example: 0193a1c1-5d2e-7a10-8b3c-4f5e6a7b8c90
    ResetId:
      name: resetId
      in: path
      required: true
      description: Id назначенного сброса 2FA — mfa_reset.id из findPlayerByEmail
      schema:
        type: string
        format: uuid
      example: 0193a1ca-8091-7ea1-9b2c-3d4e5f6a7b89
    AccessReason:
      name: X-WF-Access-Reason
      in: header
      required: true
      description: 'Причина чтения персональных данных игрока — пишется в журнал. Значение — percent-encoding UTF-8 по RFC 3986 (encodeURIComponent: значение заголовка в Fetch — байтовая строка, кириллица без кодирования не уходит из браузера); после декодирования — 3–200 символов (иначе 422 validation.failed по полю header.X-WF-Access-Reason), битая кодировка — 400. Заголовок, а не query: URL и журналы прокси не должны нести свободный текст сотрудника (CWE-598)'
      schema:
        type: string
        maxLength: 2400
        pattern: ^[A-Za-z0-9%._~!*()'-]+$
      example: '%D0%BE%D0%B1%D1%80%D0%B0%D1%89%D0%B5%D0%BD%D0%B8%D0%B5%204812'
    LookupEmail:
      name: X-WF-Lookup-Email
      in: header
      required: true
      description: 'Почта игрока для точного поиска. Значение — percent-encoding UTF-8 по RFC 3986 (encodeURIComponent: «@» — %40, кириллический домен тоже кодируется); после декодирования — не длиннее 254 байт (иначе 422 validation.failed по полю header.X-WF-Lookup-Email), битая кодировка — 400. Почта, не прошедшая нормализацию (NFKC, нижний регистр, dot-atom, IDN по белому списку, без невидимых символов — те же правила, что у почты сотрудников), — тоже 422 validation.failed по полю header.X-WF-Lookup-Email, а не 404: такой почты не может быть ни у одного игрока. Заголовок, а не query: персональные данные не попадают в URL и журналы прокси (CWE-598)'
      schema:
        type: string
        maxLength: 3048
        pattern: ^[A-Za-z0-9%._~!*()'-]+$
      example: ivan.petrov%40mail.example
  headers:
    SetSessionCookie:
      description: 'Новый токен сессии: прежний больше не действует. Имя — __Host-wf_admin_session, cookie сессионная (без Max-Age и Expires) — сроки держит сервер'
      required: true
      schema:
        type: string
      example: __Host-wf_admin_session=k3Jd9Qx2Lm7Vb4Np8Rt1Zw6Yc0Hs5Ae; Path=/; HttpOnly; Secure; SameSite=Strict
    ClearSessionCookie:
      description: Стирание cookie сессии — браузер удаляет её сразу (Max-Age=0)
      required: true
      schema:
        type: string
      example: __Host-wf_admin_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict
    CacheNoStore:
      description: Ответ с секретом — не кэшируется нигде, в том числе браузером
      required: true
      schema:
        type: string
      example: no-store
    CachePrivate:
      description: Ответ зависит от сотрудника и его прав — общим кэшам и браузеру его не хранить
      required: true
      schema:
        type: string
      example: private, no-store
    Vary:
      description: Всегда Accept-Language — ответ зависит от языка
      required: true
      schema:
        type: string
      example: Accept-Language
    ContentLanguage:
      description: Язык названий в ответе (ru или en). Заголовка нет — поддерживаемый язык не выбран, названия на языке страны каждой записи
      required: false
      schema:
        type: string
      example: ru
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      headers:
        Retry-After:
          description: Через сколько секунд повторить — только у 429 ratelimit.exceeded и 429 identity.resend_too_soon (повтор отправки кода раньше паузы)
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Ошибка по RFC 9457. Решение принимается по code, тексты — для разработчика
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          description: Тип проблемы по RFC 9457; сейчас всегда about:blank — смысл несёт code
          example: about:blank
        title:
          type: string
          description: Техническая сводка — текст HTTP-статуса; пользователю не показывать
          example: Bad Request
        status:
          type: integer
          description: HTTP-статус ответа, продублированный в теле
          example: 400
        code:
          type: string
          description: Стабильный машинный код ошибки; клиенты переводят текст по нему
          example: validation.failed
        detail:
          type: string
          description: Уточнение для разработчика; приходит не всегда, пользователю не показывать
          example: Тело запроса не разбирается как JSON
        request_id:
          type: string
          description: Id запроса — по нему запрос находится в логах сервера
          example: wf-api-7d9f/Yx3kQp1bZt-000042
        errors:
          type: array
          description: Ошибки по полям — только у validation.failed
          items:
            type: object
            required:
              - field
              - code
            additionalProperties: false
            properties:
              field:
                type: string
                description: body.<путь через точку>, query.<имя>, path.<имя> или header.<имя>
                example: body.name
              code:
                type: string
                description: 'Нарушенное правило схемы: required, minLength, maximum, enum, format…'
                example: minLength
        attempts_left:
          type: integer
          minimum: 0
          description: Сколько попыток осталось до блокировки — только у ошибок неверного кода или пароля, после которых число попыток ограничено; 0 — попыток больше нет, доступ закрыт на время
          example: 3
        reasons:
          type: array
          description: 'Причины отказа машинными значениями — только у двух кодов. У identity.captain_ineligible — невыполненные условия заявки в капитаны (значения схемы CaptainIneligibility; ограничение captain — причина restricted). У identity.password_weak — ровно одно значение: too_short (короче 10 символов), common (из списка распространённых паролей) или too_long (длиннее потолка). Список открытый: незнакомое значение показывайте общим текстом кода'
          items:
            type: string
            description: Машинное значение причины
            example: too_short
          example:
            - too_short
        methods:
          type: array
          description: 'Только у identity.mfa_required — вторые факторы аккаунта, которые принимает эта операция (значения схемы MfaMethod): totp, recovery_code, passkey. У confirmPasswordReset — только totp и recovery_code: ключ доступа при сбросе пароля не принимается. Клиент показывает выбор из этих способов и повторяет запрос со вторым фактором'
          items:
            type: string
            description: Способ второго фактора (MfaMethod)
            example: totp
          example:
            - totp
            - recovery_code
        available_at:
          type: string
          format: date-time
          description: Когда действие станет доступно (UTC) — только у identity.nickname_change_too_soon (смена ника раньше 30 дней) и identity.application_cooldown (повторная заявка в капитаны раньше 7 дней после отказа)
          example: '2026-12-13T09:30:00Z'
        blocked_until:
          type: string
          format: date-time
          description: До какого момента (UTC) заблокирован аккаунт — только у identity.account_blocked. Поля нет у этого кода — блокировка бессрочная (null не приходит)
          example: '2026-11-20T00:00:00Z'
        job_id:
          type: integer
          format: int64
          description: Только у geo.import_in_progress админки — id задачи импорта страны, которая уже стоит в очереди или выполняется; её можно отменить cancelGeoImportJob
          example: 1842
        challenge:
          type: object
          description: 'Задача антибота — только у humancheck.required. Формат протокола ALTCHA, поля в camelCase, как их ждёт виджет ALTCHA: найдите число от 0 до maxNumber, при котором SHA-256(salt + число) в hex равен challenge, и повторите запрос с решением в заголовке X-WF-Humancheck (base64 от JSON с полями algorithm, challenge, number, salt, signature)'
          required:
            - algorithm
            - challenge
            - maxNumber
            - salt
            - signature
          additionalProperties: false
          properties:
            algorithm:
              type: string
              description: Хеш-функция задачи; сейчас всегда SHA-256
              example: SHA-256
            challenge:
              type: string
              description: SHA-256 от salt и искомого числа, hex
              example: 4d5b2c0e7f9a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8c
            maxNumber:
              type: integer
              format: int64
              description: Верхняя граница перебора
              example: 100000
            salt:
              type: string
              description: Соль с параметрами срока задачи (expires, Unix-время) и ключа подписи (kid)
              example: b1946ac92492d2347c62?expires=1790000000&kid=Hx3k9QpLm2s&
            signature:
              type: string
              description: HMAC-SHA-256 задачи на ключе сервера, hex
              example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    StaffRole:
      type: string
      description: Роль сотрудника — одна на человека. owner — владелец, admin — админ, moderator — модератор своих городов, support — поддержка. Список открытый — незнакомое значение клиент обязан пережить
      enum:
        - owner
        - admin
        - moderator
        - support
      x-extensible-enum: true
    StaffStatus:
      type: string
      description: Состояние учётки. invited — приглашение выслано, вход ещё не настроен (и после сброса доступа); active — работает; disabled — выключена (роль снята), войти нельзя
      enum:
        - invited
        - active
        - disabled
      x-extensible-enum: true
    StaffStage:
      type: string
      description: Стадия сессии. mfa_pending — пароль принят, ждём второй фактор (5 минут); setup — первый вход по приглашению, доступна только настройка 2FA; active — сессия работает
      enum:
        - mfa_pending
        - setup
        - active
      x-extensible-enum: true
    StaffLocale:
      type: string
      description: Язык админки и писем сотруднику
      enum:
        - ru
        - en
      x-extensible-enum: true
    PermissionGrant:
      type: string
      description: 'Доступ сотрудника к праву. allow — можно сразу; scoped — только в своих городах (модератор); dual — только вдвоём: действие создаёт запрос на подтверждение'
      enum:
        - allow
        - scoped
        - dual
      x-extensible-enum: true
    RoleGrant:
      type: string
      description: 'Значение клетки матрицы ролей: allow — можно сразу; scoped — только в своих городах; dual — вдвоём, через подтверждение; deny — нельзя'
      enum:
        - allow
        - scoped
        - dual
        - deny
      x-extensible-enum: true
    StaffActionReason:
      type: string
      description: 'Причина выключения или сброса доступа — из списка: left_team — ушёл из команды, security — безопасность (утечка, потерянное устройство), role_change — смена обязанностей, other — другое (поясните в комментарии)'
      enum:
        - left_team
        - security
        - role_change
        - other
      x-extensible-enum: true
    StaffLoginRequest:
      type: object
      description: Вход сотрудника — первый шаг, почта и пароль
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: Рабочая почта сотрудника; регистр и пробелы по краям не важны, домен на кириллице принимается
          example: olga.v@wf.example
        password:
          type: string
          description: Пароль сотрудника как введён, без обрезки пробелов
          example: Жёлтая карточка на 90-й
    StaffFactorRequest:
      type: object
      description: 'Второй фактор — ровно одно из полей: код из приложения-аутентификатора или резервный код. Резервный код сгорает при использовании'
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Код из приложения-аутентификатора — 6 цифр; пробелы между цифрами допустимы (вставка из буфера)
          example: '492817'
        recovery_code:
          type: string
          minLength: 1
          maxLength: 64
          description: Резервный код вида xxxxx-xxxxx; регистр, дефис и пробелы не важны
          example: k7m2q-x9p4t
    StaffCodeRequest:
      type: object
      description: Код из приложения-аутентификатора (резервные коды здесь не принимаются)
      required:
        - code
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: 6 цифр из приложения-аутентификатора; пробелы между цифрами допустимы
          example: '492817'
    StaffAcceptInviteRequest:
      type: object
      description: Принятие приглашения — почта из письма, код из письма, новый пароль и необязательный locale — язык админки и писем, на котором показан экран принятия (клиент админки шлёт его всегда); нет поля — язык учётки не меняется
      required:
        - email
        - code
        - password
      example:
        email: olga.v@wf.example
        code: k7m2p-x4q6d
        password: Жёлтая карточка на 90-й
        locale: en
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: Почта, на которую пришло приглашение; регистр и пробелы по краям не важны
          example: olga.v@wf.example
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Код из письма-приглашения: 10 символов base32 (буквы a–z и цифры 2–7) в виде xxxxx-xxxxx. Регистр, дефис, пробелы и перевод строки при вставке не важны — сервер нормализует ввод'
          example: k7m2p-x4q6d
        password:
          type: string
          description: 'Новый пароль: не короче 10 символов, не длиннее 128, не из списка распространённых. Нарушение — 400 validation.failed по полю body.password с кодом too_short, too_long или common'
          example: Жёлтая карточка на 90-й
        locale:
          $ref: '#/components/schemas/StaffLocale'
    StaffEmailRequest:
      type: object
      description: Почта сотрудника — для повторной отправки кода приглашения
      required:
        - email
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: Почта из приглашения; регистр и пробелы по краям не важны
          example: olga.v@wf.example
    StaffStageResult:
      type: object
      description: Стадия новой сессии — что показать дальше (второй фактор или настройку 2FA)
      required:
        - stage
      properties:
        stage:
          $ref: '#/components/schemas/StaffStage'
    StaffMe:
      type: object
      description: 'Кто вошёл: учётка, роль, города, права и стадия сессии — по нему админка строит меню и кнопки. В стадии mfa_pending приходят только stage, session, reauth_required и пустые city_ids и permissions (поля учётки отсутствуют); в стадии setup — учётка без прав'
      required:
        - stage
        - reauth_required
        - city_ids
        - permissions
        - session
      properties:
        id:
          type: string
          format: uuid
          description: Id учётки сотрудника; нет в стадии mfa_pending
          example: 0192f1c4-7a3e-7b21-9c5d-3e8f1a2b4c6d
        email:
          type: string
          description: Рабочая почта в каноническом виде (домен — в ASCII-форме xn--…); нет в стадии mfa_pending
          example: olga.v@wf.example
        display_name:
          type: string
          description: Отображаемое имя — его видят журнал и другие сотрудники; нет в стадии mfa_pending
          example: Ольга В.
        locale:
          $ref: '#/components/schemas/StaffLocale'
        role:
          $ref: '#/components/schemas/StaffRole'
        city_ids:
          type: array
          description: Города модератора; у остальных ролей и в стадии mfa_pending — пустой список
          items:
            type: string
            format: uuid
          example:
            - 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
        stage:
          $ref: '#/components/schemas/StaffStage'
        reauth_required:
          type: boolean
          description: 'Сессия ждёт второй фактор (бездействие или смена сети): до staffUnlock остальные операции отвечают 401 auth.reauth_required'
          example: false
        permissions:
          type: object
          description: Права сотрудника — ключ права и доступ; права без доступа не перечисляются. Пусто в стадиях mfa_pending и setup
          additionalProperties:
            $ref: '#/components/schemas/PermissionGrant'
          example:
            staff.roles.read: allow
            staff.accounts.read: allow
            staff.roles.grant: dual
            audit.log.read: allow
            geo.cities.read: allow
        session:
          type: object
          nullable: true
          description: Текущая сессия; null — сессия не определена
          allOf:
            - $ref: '#/components/schemas/StaffMeSession'
    StaffMeSession:
      type: object
      description: Текущая сессия — её id (отметка «это устройство» в «Моём доступе») и абсолютный срок
      required:
        - id
        - expires_at
      properties:
        id:
          type: string
          format: uuid
          description: Id текущей сессии
          example: 0192f1d0-1b2c-7d3e-8f4a-5b6c7d8e9f01
        expires_at:
          type: string
          format: date-time
          description: Когда сессия закончится в любом случае (8 часов от входа; у mfa_pending — 5 минут)
          example: '2026-10-13T17:00:00Z'
    StaffLocaleUpdate:
      type: object
      description: Новый язык админки и писем
      required:
        - locale
      additionalProperties: false
      properties:
        locale:
          $ref: '#/components/schemas/StaffLocale'
    StaffMfaStatus:
      type: object
      description: Состояние второго фактора — для «Моего доступа»
      required:
        - confirmed_at
        - recovery_codes_left
      properties:
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: Когда настроено приложение-аутентификатор; null — ещё не настроено
          example: '2026-10-01T09:12:00Z'
        recovery_codes_left:
          type: integer
          minimum: 0
          maximum: 10
          description: Сколько резервных кодов из 10 ещё не использовано
          example: 8
    StaffMfaSecret:
      type: object
      description: Новый секрет приложения-аутентификатора. Показывается один раз; повторный вызов до подтверждения выпускает новый секрет, старый перестаёт действовать
      required:
        - secret
        - otpauth_uri
      properties:
        secret:
          type: string
          description: Секрет base32 (RFC 4648, без =) — для ручного ввода в приложение
          example: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        otpauth_uri:
          type: string
          description: Ссылка otpauth://totp/… для QR-кода; QR рисует сама страница, ссылку никуда не отправлять
          example: otpauth://totp/WF%20admin:olga.v%40wf.example?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=WF%20admin
    StaffRecoveryCodes:
      type: object
      description: Резервные коды — показываются один раз, сервер хранит только их отпечатки. Каждый код работает вместо кода из приложения один раз
      required:
        - recovery_codes
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          description: 10 кодов вида xxxxx-xxxxx
          items:
            type: string
          example:
            - k7m2q-x9p4t
            - a3b5c-d7e2f
            - m4n6p-q2r8s
            - t5v7w-x3y9z
            - b2c4d-f6g8h
            - j3k5m-n7p2q
            - r4s6t-v8w3x
            - y5z7a-b2c9d
            - e3f5g-h7j4k
            - p6q8r-s2t5v
    StaffPasswordChange:
      type: object
      description: 'Смена своего пароля: текущий пароль, второй фактор (ровно одно из code и recovery_code) и новый пароль. Остальные свои сессии гасятся'
      required:
        - current_password
        - new_password
      additionalProperties: false
      properties:
        current_password:
          type: string
          description: Текущий пароль как введён
          example: Жёлтая карточка на 90-й
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: 6 цифр из приложения-аутентификатора; не вместе с recovery_code
          example: '492817'
        recovery_code:
          type: string
          minLength: 1
          maxLength: 64
          description: Резервный код вида xxxxx-xxxxx вместо кода из приложения; сгорает
          example: k7m2q-x9p4t
        new_password:
          type: string
          description: 'Новый пароль: не короче 10 символов, не длиннее 128, не из списка распространённых. Нарушение — 400 validation.failed по полю body.new_password с кодом too_short, too_long или common'
          example: Свисток на 46-й минуте
    StaffSession:
      type: object
      description: Сессия сотрудника — устройство, сеть и время работы
      required:
        - id
        - stage
        - current
        - created_at
        - last_seen_at
        - expires_at
        - ip
        - user_agent
      properties:
        id:
          type: string
          format: uuid
          description: Id сессии — для завершения
          example: 0192f1d0-1b2c-7d3e-8f4a-5b6c7d8e9f01
        stage:
          $ref: '#/components/schemas/StaffStage'
        current:
          type: boolean
          description: Это сессия, с которой сделан запрос («это устройство»)
          example: true
        created_at:
          type: string
          format: date-time
          description: Когда сессия создана (вход)
          example: '2026-10-13T09:00:00Z'
        last_seen_at:
          type: string
          format: date-time
          description: Последняя активность — с точностью до минуты, фоновые опросы её не двигают
          example: '2026-10-13T10:41:00Z'
        expires_at:
          type: string
          format: date-time
          description: Когда сессия закончится в любом случае
          example: '2026-10-13T17:00:00Z'
        ip:
          type: string
          description: Сеть, из которой вошли, — подсеть /24 (IPv4) или /48 (IPv6); полный адрес не показывается
          example: 203.0.113.0/24
        user_agent:
          type: string
          nullable: true
          description: Строка User-Agent браузера — устройство и браузер разбирает админка; null — браузер её не прислал
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36
    StaffSessionList:
      type: object
      description: Живые сессии сотрудника, новые сверху
      required:
        - items
      properties:
        items:
          type: array
          description: Сессии; текущая отмечена current
          items:
            $ref: '#/components/schemas/StaffSession'
    StaffRevoked:
      type: object
      description: Сколько сессий завершено
      required:
        - revoked
      properties:
        revoked:
          type: integer
          minimum: 0
          description: Число завершённых сессий; 0 — других сессий не было
          example: 2
    StaffInviteRequest:
      type: object
      description: 'Приглашение нового сотрудника — почта, имя, роль, города (у модератора) и необязательный locale — язык учётки и писем новичка (ru или en), выбранный приглашающим; нет поля — язык приглашающего (StaffMe.locale инициатора в момент создания запроса). Язык запоминается в запросе на подтверждение: смена языка приглашающего до подтверждения его не меняет. Почта выключенной учётки — её язык перезаписывается выбранным'
      required:
        - email
        - display_name
        - role
      example:
        email: ivan.p@wf.example
        display_name: Иван П.
        role: moderator
        city_ids:
          - 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
        locale: en
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: Рабочая почта — на неё уйдёт код приглашения. Почта выключенной учётки возвращает ту же учётку через сброс доступа. Регистр и крайние пробелы не важны; не адрес (локальная часть не ASCII dot-atom, домен с невидимыми символами) — 400 validation.failed по body.email, код format; короче 3 или длиннее 320 символов — код minLength или maxLength
          example: ivan.p@wf.example
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          description: Отображаемое имя — его видят журнал, письма и другие сотрудники. Крайние пробелы обрезаются; управляющие, форматирующие и bidi-символы, разделители строк и невидимые символы (U+200B и подобные), имя без видимых символов — 400 validation.failed по body.display_name, код format. Только внутри эмодзи допустимы соединитель U+200D (между двумя эмодзи) и селекторы U+FE0E, U+FE0F (сразу после эмодзи или цифры кейкапа)
          example: Иван П.
        role:
          $ref: '#/components/schemas/StaffRole'
        city_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Города модератора — у moderator хотя бы один (иначе 400 validation.failed по body.city_ids, код min_items), у остальных ролей — пусто или нет поля (иначе код max_items); больше 100 — код maxItems
          items:
            type: string
            format: uuid
          example:
            - 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
        locale:
          $ref: '#/components/schemas/StaffLocale'
    StaffRoleUpdate:
      type: object
      description: Новая роль и города сотрудника целиком (не разница)
      required:
        - role
        - city_ids
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/StaffRole'
        city_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Города модератора целиком — у moderator хотя бы один (иначе 400 validation.failed по body.city_ids, код min_items), у остальных ролей — пустой список (иначе код max_items); больше 100 — код maxItems
          items:
            type: string
            format: uuid
          example:
            - 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
            - 7a1d5e9c-2b4f-4c8a-b3e6-1f0d9c8b7a65
    StaffConfirmedAction:
      type: object
      description: Разрушающее действие над сотрудником — причина из списка, комментарий и почта цели, введённая руками
      required:
        - reason
        - confirm
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/StaffActionReason'
        comment:
          type: string
          maxLength: 500
          description: Пояснение к причине — попадает в журнал действий
          example: Перешёл в другой проект
        confirm:
          type: string
          minLength: 1
          maxLength: 320
          description: Почта сотрудника-цели, введённая руками; регистр и пробелы по краям не важны. Не совпала — 400 validation.failed по body.confirm с кодом mismatch
          example: ivan.p@wf.example
    StaffInviteState:
      type: object
      description: Живое приглашение учётки — пока сотрудник не настроил вход
      required:
        - purpose
        - expires_at
        - expired
      properties:
        purpose:
          type: string
          description: invite — первое приглашение; access_reset — после сброса доступа
          enum:
            - invite
            - access_reset
          x-extensible-enum: true
        expires_at:
          type: string
          format: date-time
          description: Срок кода приглашения (24 часа от выпуска)
          example: '2026-10-14T09:00:00Z'
        expired:
          type: boolean
          description: Срок истёк — нужна повторная отправка
          example: false
    StaffAccount:
      type: object
      description: Учётка сотрудника — строка списка «Роли и доступ» и карточка
      required:
        - id
        - email
        - display_name
        - locale
        - status
        - role
        - city_ids
        - created_at
        - last_login_at
        - locked_until
        - version
        - invite
      properties:
        id:
          type: string
          format: uuid
          description: Id учётки
          example: 0192f1c4-7a3e-7b21-9c5d-3e8f1a2b4c6d
        email:
          type: string
          description: Рабочая почта в каноническом виде (домен — в ASCII-форме xn--…)
          example: ivan.p@wf.example
        display_name:
          type: string
          description: Отображаемое имя
          example: Иван П.
        locale:
          $ref: '#/components/schemas/StaffLocale'
        status:
          $ref: '#/components/schemas/StaffStatus'
        role:
          $ref: '#/components/schemas/StaffRole'
        city_ids:
          type: array
          description: Города модератора; у остальных ролей — пустой список
          items:
            type: string
            format: uuid
          example:
            - 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
        created_at:
          type: string
          format: date-time
          description: Когда учётка создана
          example: '2026-10-01T09:00:00Z'
        last_login_at:
          type: string
          format: date-time
          nullable: true
          description: Последний вход; null — ещё не входил
          example: '2026-10-13T09:00:00Z'
        locked_until:
          type: string
          format: date-time
          nullable: true
          description: До какого времени вход закрыт после пяти неверных кодов подряд; null — не закрыт
          example: null
        version:
          type: integer
          format: int64
          description: Версия учётки — растёт при каждом изменении, в том числе роли и городов
          example: 4
        invite:
          type: object
          nullable: true
          description: Живое приглашение («приглашение не принято / просрочено»); null — приглашения нет
          allOf:
            - $ref: '#/components/schemas/StaffInviteState'
        player_link:
          $ref: '#/components/schemas/StaffPlayerLink'
    StaffAccountPage:
      type: object
      description: Страница списка сотрудников
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          description: Сотрудники страницы
          items:
            $ref: '#/components/schemas/StaffAccount'
        next_cursor:
          type: string
          nullable: true
          description: Курсор следующей страницы; null — страниц больше нет
          example: eyJ2IjoxLCJrIjpbIjIwMjYtMTAtMDFUMTc6MDA6MDBaIiwiMDE5MmYxYzQiXX0
    RoleGrants:
      type: object
      description: Доступ к праву у каждой роли — строка матрицы
      required:
        - owner
        - admin
        - moderator
        - support
      properties:
        owner:
          $ref: '#/components/schemas/RoleGrant'
        admin:
          $ref: '#/components/schemas/RoleGrant'
        moderator:
          $ref: '#/components/schemas/RoleGrant'
        support:
          $ref: '#/components/schemas/RoleGrant'
    RolePermission:
      type: object
      description: Право матрицы — ключ, признак изменения и доступ ролей. Подпись права — в локалях админки (permissions.<ключ>)
      required:
        - key
        - mutating
        - grants
      properties:
        key:
          type: string
          description: Ключ права <модуль>.<ресурс>.<действие>
          example: staff.roles.grant
        mutating:
          type: boolean
          description: Право меняет данные (иначе — только чтение)
          example: true
        grants:
          $ref: '#/components/schemas/RoleGrants'
    StaffPlayerLinkPut:
      type: object
      description: Связь сотрудника с его учёткой игрока
      required:
        - user_id
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
          description: Id учётки игрока — из findPlayerByEmail
          example: 0193a1c1-5d2e-7a10-8b3c-4f5e6a7b8c90
    StaffPlayerLink:
      type: object
      description: Связь «сотрудник → учётка игрока» (запрет действий над собой). В карточке сотрудника (StaffAccount.player_link) — только для владельца (право staff.player_links.manage); у остальных поля нет. У владельца поля нет — связи нет. До этапа 9 спеки identity сервер поле не отдаёт никому
      required:
        - user_id
        - nickname
        - linked_at
        - linked_by_label
      properties:
        user_id:
          type: string
          format: uuid
          description: Id учётки игрока
          example: 0193a1c1-5d2e-7a10-8b3c-4f5e6a7b8c90
        nickname:
          type: string
          description: Ник игрока
          example: kosta_10
        linked_at:
          type: string
          format: date-time
          description: Когда связь установлена
          example: '2026-11-14T10:00:00Z'
        linked_by_label:
          type: string
          description: Кто связал — имя владельца
          example: Ольга В.
    StaffRoles:
      type: object
      description: Роли и матрица прав — экран «Роли и доступ»; черновые права будущих модулей не входят
      required:
        - roles
        - permissions
      properties:
        roles:
          type: array
          description: Роли по старшинству
          items:
            $ref: '#/components/schemas/StaffRole'
        permissions:
          type: array
          description: Права в порядке каталога
          items:
            $ref: '#/components/schemas/RolePermission'
    CityStatus:
      type: string
      description: Статус города. waitlist — игр пока нет; pilot — первые команды и модератор; live — город работает. Список открытый — незнакомое значение клиент обязан пережить
      enum:
        - waitlist
        - pilot
        - live
      x-extensible-enum: true
    GeoCity:
      type: object
      description: Город платформы в списке админки — выбор и подпись городов модератора, список «Города и запуск». Города выключенных стран тоже в списке (country_enabled = false)
      required:
        - id
        - slug
        - name
        - status
        - country_code
        - region_name
        - region_id
        - country_enabled
        - geoname_id
        - population
        - districts_count
      properties:
        id:
          type: string
          format: uuid
          description: Id города
          example: 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          description: Текущий адрес города в вебе
          example: stavropol
        name:
          type: string
          description: Название на языке ответа; перевода нет — каноническое, на языке страны
          example: Ставрополь
        status:
          $ref: '#/components/schemas/CityStatus'
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          description: Код страны ISO 3166-1 alpha-2
          example: RU
        region_name:
          type: string
          nullable: true
          description: Регион на языке ответа — различает одноимённые города; null — регион не задан
          example: Ставропольский край
        region_id:
          type: string
          format: uuid
          nullable: true
          description: Id региона города; null — регион не задан
          example: b7e4d2c9-1a3f-4e8b-9c6d-5f0a2e7b1c38
        country_enabled:
          type: boolean
          description: Страна города включена; false — город скрыт из публичного API вместе со страной
          example: true
        geoname_id:
          type: integer
          format: int64
          nullable: true
          description: Место GeoNames, к которому привязан город; null — не привязан (город заведён до импорта и сверка его не нашла — привязать вручную из отчёта импорта)
          example: 487846
        population:
          type: integer
          format: int64
          minimum: 0
          description: Население — из GeoNames на момент активации; импорт его у заведённого города не меняет
          example: 450680
        districts_count:
          type: integer
          minimum: 0
          description: Число районов города без архивных
          example: 4
    GeoCityPage:
      type: object
      description: Страница городов
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          description: Города страницы
          items:
            $ref: '#/components/schemas/GeoCity'
        next_cursor:
          type: string
          nullable: true
          description: Курсор следующей страницы; null — страниц больше нет
          example: eyJ2IjoyLCJmIjoiTHUtZXVQODNGd3ciLCJrIjpbIjEiLCI0MzM5MzEiXX0
    GeoNames:
      type: object
      description: 'Названия по языкам: ключ — язык ISO 639-1 из поддерживаемых (ru, en), значение — название на нём, 1–100 символов. Строка языка страны — каноническое название записи. В запросе незнакомый язык — 400 validation.failed по body.names.<язык> с правилом enum'
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 100
      example:
        ru: Ставрополь
        en: Stavropol
    GeoNamesPatch:
      type: object
      description: 'Правка названий по языкам: ключ — язык (ru, en), значение — новое название (1–100 символов, пробелы по краям обрезаются) или null — удалить перевод. Языки, которых нет в объекте, не меняются. Незнакомый язык — 400 validation.failed по body.names.<язык> с правилом enum; удалить название на языке страны нельзя — то же поле с правилом required'
      minProperties: 1
      additionalProperties:
        type: string
        nullable: true
        minLength: 1
        maxLength: 100
      example:
        en: Stavropol
        ru: Ставрополь
    GeoPoint:
      type: object
      description: Точка на карте, WGS 84, градусы
      required:
        - lat
        - lon
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Широта, от -90 (юг) до 90 (север)
          example: 45.04484
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Долгота, от -180 (запад) до 180 (восток)
          example: 41.9691
    GeoCountryRef:
      type: object
      description: Страна записи — код и название на языке ответа
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
          description: Код страны ISO 3166-1 alpha-2
          example: RU
        name:
          type: string
          description: Название страны на языке ответа; перевода нет — на языке страны
          example: Россия
    GeoCityCountry:
      type: object
      description: Страна города в карточке — код, название на языке ответа и включена ли страна
      required:
        - code
        - name
        - is_enabled
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
          description: Код страны ISO 3166-1 alpha-2
          example: RU
        name:
          type: string
          description: Название страны на языке ответа; перевода нет — на языке страны
          example: Россия
        is_enabled:
          type: boolean
          description: Страна включена. Города выключенной страны админка видит и правит, публичный API и приложения — нет
          example: true
    GeoRegionRef:
      type: object
      description: Регион (субъект, область) — id и название на языке ответа
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Id региона
          example: b7e4d2c9-1a3f-4e8b-9c6d-5f0a2e7b1c38
        name:
          type: string
          description: Название региона на языке ответа; перевода нет — на языке страны
          example: Ставропольский край
    GeoSlugHistoryEntry:
      type: object
      description: Прежний адрес города — продолжает находить город в вебе
      required:
        - slug
        - replaced_at
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          description: Прежний адрес
          example: stavropol-city
        replaced_at:
          type: string
          format: date-time
          description: Когда адрес заменён новым
          example: '2026-10-20T08:30:00Z'
    GeoCityDetails:
      type: object
      description: 'Карточка города в админке: названия по всем языкам, история адресов, привязка к GeoNames, страна, регион и версия'
      required:
        - id
        - slug
        - slug_history
        - name
        - names
        - canonical_locale
        - status
        - geoname_id
        - population
        - timezone
        - location
        - country
        - region
        - districts_count
        - version
      properties:
        id:
          type: string
          format: uuid
          description: Id города
          example: 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          description: Текущий адрес города в вебе
          example: stavropol
        slug_history:
          type: array
          description: Прежние адреса, новые сверху; пусто — адрес не менялся
          items:
            $ref: '#/components/schemas/GeoSlugHistoryEntry'
        name:
          type: string
          description: Название на языке ответа; перевода нет — каноническое, на языке страны
          example: Ставрополь
        names:
          $ref: '#/components/schemas/GeoNames'
        canonical_locale:
          type: string
          pattern: ^[a-z]{2}$
          description: Язык страны — название на нём каноническое, удалить его нельзя
          example: ru
        status:
          $ref: '#/components/schemas/CityStatus'
        geoname_id:
          type: integer
          format: int64
          nullable: true
          description: Место GeoNames города; null — не привязан (linkGeoCity)
          example: 487846
        population:
          type: integer
          format: int64
          minimum: 0
          description: Население — из GeoNames на момент активации
          example: 450680
        timezone:
          type: string
          description: Таймзона IANA — местное время матчей города считается по ней
          example: Europe/Moscow
        location:
          $ref: '#/components/schemas/GeoPoint'
        country:
          $ref: '#/components/schemas/GeoCityCountry'
        region:
          type: object
          nullable: true
          description: Регион города; null — регион не задан
          allOf:
            - $ref: '#/components/schemas/GeoRegionRef'
        districts_count:
          type: integer
          minimum: 0
          description: Число районов без архивных
          example: 4
        version:
          type: integer
          format: int64
          minimum: 1
          description: Версия города — растёт на каждое изменение (справочно; правки не сверяют её)
          example: 3
    GeoCityActivateRequest:
      type: object
      description: Активация города из места GeoNames. Страна и регион по умолчанию — места; country_code переопределяет страну (тогда регион — только region_id или без региона)
      required:
        - geoname_id
      additionalProperties: false
      properties:
        geoname_id:
          type: integer
          format: int64
          minimum: 1
          description: Место GeoNames — из поиска listGeoPlaces
          example: 526815
        status:
          $ref: '#/components/schemas/CityStatus'
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          description: Страна города вместо страны места (включённая); без поля — страна места
          example: RU
        region_id:
          type: string
          format: uuid
          description: Регион города — из listGeoRegions той же страны; без поля — регион места (заводится по GeoNames, если его ещё нет), при переопределённой стране — без региона
          example: b7e4d2c9-1a3f-4e8b-9c6d-5f0a2e7b1c38
    GeoCityPatch:
      type: object
      description: Правка города — только присланные поля. status и slug требуют geo.cities.manage, names — geo.cities.rename; поле без права — 403 auth.forbidden на весь запрос, ничего не записано
      minProperties: 1
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/CityStatus'
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: 'Новый адрес в вебе: латиница в нижнем регистре, цифры, дефис только между частями, до 100 символов. Прежний уходит в историю и продолжает находить город'
          example: stavropol
        names:
          $ref: '#/components/schemas/GeoNamesPatch'
    GeoCityLinkRequest:
      type: object
      description: Ручная привязка города к месту GeoNames — кандидат из отчёта импорта
      required:
        - geoname_id
      additionalProperties: false
      properties:
        geoname_id:
          type: integer
          format: int64
          minimum: 1
          description: Место GeoNames — один из кандидатов отчёта сверки (ambiguous, conflict)
          example: 487846
    GeoPlace:
      type: object
      description: Место справочника GeoNames (CC BY 4.0) — кандидат в города платформы
      required:
        - geoname_id
        - name
        - ascii_name
        - feature_code
        - population
        - timezone
        - region_name
        - country
        - city_id
      properties:
        geoname_id:
          type: integer
          format: int64
          description: Id места в GeoNames
          example: 526815
        name:
          type: string
          description: Название места на языке ответа; перевода нет — на языке страны
          example: Михайловск
        ascii_name:
          type: string
          description: Название латиницей из GeoNames — из него строится адрес города
          example: Mikhaylovsk
        feature_code:
          type: string
          description: 'Код вида места GeoNames: PPL — населённый пункт, PPLA — центр региона, PPLC — столица…'
          example: PPL
        population:
          type: integer
          format: int64
          minimum: 0
          description: Население по GeoNames
          example: 56000
        timezone:
          type: string
          description: Таймзона IANA места
          example: Asia/Yekaterinburg
        region_name:
          type: string
          nullable: true
          description: Регион места на языке ответа; null — регион неизвестен
          example: Свердловская область
        country:
          $ref: '#/components/schemas/GeoCountryRef'
        city_id:
          type: string
          format: uuid
          nullable: true
          description: Город платформы на этом месте; null — город ещё не заведён (можно активировать). У заведённого города страна места — страна города
          example: null
    GeoPlacePage:
      type: object
      description: Страница мест GeoNames
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          description: Места страницы — по населению, крупные сверху
          items:
            $ref: '#/components/schemas/GeoPlace'
        next_cursor:
          type: string
          nullable: true
          description: Курсор следующей страницы; null — страниц больше нет
          example: eyJ2IjoyLCJmIjoicDNHeVZtSHNhR2MiLCJrIjpbIjU2MDAwIiwiNTI2ODE1Il19
    GeoDistrict:
      type: object
      description: Район города
      required:
        - id
        - name
        - archived_at
        - version
      properties:
        id:
          type: string
          format: uuid
          description: Id района
          example: c1d9e3a7-5b2f-4a8c-8e6d-0f4b7a2c9e15
        name:
          type: string
          description: Название района
          example: Промышленный
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: Когда район отправлен в архив; null — район действующий. Архивный скрыт из приложений, ссылки полей и матчей на него остаются, его имя свободно для нового района
          example: null
        version:
          type: integer
          format: int64
          minimum: 1
          description: Версия района — растёт на каждое изменение (справочно)
          example: 1
    GeoDistrictList:
      type: object
      description: Районы города — действующие по имени, затем архивные; без пагинации (районов единицы)
      required:
        - items
      properties:
        items:
          type: array
          description: Районы
          items:
            $ref: '#/components/schemas/GeoDistrict'
    GeoDistrictCreate:
      type: object
      description: Новый район города
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Название района, 1–100 символов (пробелы по краям обрезаются); занято действующим районом города (без учёта регистра, ё/е, диакритики и латинских двойников кириллицы) — 409 geo.district_name_taken
          example: Промышленный
    GeoDistrictPatch:
      type: object
      description: Правка района — только присланные поля
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Новое название района, 1–100 символов
          example: Юго-Западный
        archived:
          type: boolean
          description: true — в архив (район скрыт из приложений), false — вернуть из архива (имя должно быть свободно среди действующих)
          example: true
    GeoCountry:
      type: object
      description: 'Страна с правилами: валюта, язык, телефонный код, первый день недели, возрастные пороги. Значения вносит человек, сверяя с законом страны; из GeoNames они не берутся'
      required:
        - code
        - name
        - names
        - currency
        - default_locale
        - phone_prefix
        - week_starts_on
        - min_signup_age
        - age_of_majority
        - is_enabled
        - open_cities
        - version
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
          description: Код страны ISO 3166-1 alpha-2
          example: RU
        name:
          type: string
          description: Название страны на языке ответа; перевода нет — на языке страны
          example: Россия
        names:
          $ref: '#/components/schemas/GeoNames'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Валюта страны ISO 4217 — суммы городов страны в ней, в минорных единицах
          example: RUB
        default_locale:
          type: string
          pattern: ^[a-z]{2}$
          description: Язык страны ISO 639-1 — на нём канонические названия; задаётся только при создании
          example: ru
        phone_prefix:
          type: string
          pattern: ^\+[1-9][0-9]{0,3}$
          description: Телефонный код страны
          example: '+7'
        week_starts_on:
          type: integer
          minimum: 1
          maximum: 7
          description: Первый день недели — 1 понедельник … 7 воскресенье (ISO 8601)
          example: 1
        min_signup_age:
          type: integer
          minimum: 1
          maximum: 120
          description: Минимальный возраст регистрации, полных лет
          example: 14
        age_of_majority:
          type: integer
          minimum: 1
          maximum: 120
          description: Возраст совершеннолетия, полных лет — с него капитанство и покупки; не меньше min_signup_age
          example: 18
        is_enabled:
          type: boolean
          description: Страна включена — её города видны в приложениях
          example: true
        open_cities:
          type: integer
          minimum: 0
          description: 'Справочно: число городов страны в статусах pilot и live — экрану для предупреждения при выключении страны (на правило «вдвоём» не влияет)'
          example: 2
        version:
          type: integer
          format: int64
          minimum: 1
          description: Версия страны — растёт на каждое изменение; подтверждение правил сверяет её
          example: 4
    GeoCountryList:
      type: object
      description: Все страны справочника — включённые и выключенные, по коду
      required:
        - items
      properties:
        items:
          type: array
          description: Страны
          items:
            $ref: '#/components/schemas/GeoCountry'
    GeoCountryCreate:
      type: object
      description: Новая страна — тело запроса на подтверждение (страна появится после подтверждения вторым сотрудником). Все правила обязательны; название на языке страны (default_locale) обязательно
      required:
        - code
        - currency
        - default_locale
        - phone_prefix
        - week_starts_on
        - min_signup_age
        - age_of_majority
        - names
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
          description: Код действующей страны ISO 3166-1 alpha-2; уже есть в справочнике — 409 geo.country_exists
          example: KZ
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Действующая валюта ISO 4217 (исторические коды вроде RUR не принимаются)
          example: KZT
        default_locale:
          type: string
          pattern: ^[a-z]{2}$
          description: Язык страны из поддерживаемых (ru, en); потом не меняется
          example: ru
        phone_prefix:
          type: string
          pattern: ^\+[1-9][0-9]{0,3}$
          description: Телефонный код страны — «+» и 1–4 цифры
          example: '+7'
        week_starts_on:
          type: integer
          minimum: 1
          maximum: 7
          description: Первый день недели — 1 понедельник … 7 воскресенье
          example: 1
        min_signup_age:
          type: integer
          minimum: 1
          maximum: 120
          description: Минимальный возраст регистрации, полных лет
          example: 14
        age_of_majority:
          type: integer
          minimum: 1
          maximum: 120
          description: Возраст совершеннолетия, не меньше min_signup_age (иначе 400 по body.age_of_majority)
          example: 18
        names:
          $ref: '#/components/schemas/GeoNames'
        is_enabled:
          type: boolean
          default: false
          description: Включить страну сразу при создании; без поля — выключена
          example: false
    GeoCountryPatch:
      type: object
      description: 'Правка страны — только присланные поля; code и default_locale не меняются (лишнее поле — 400). Смена currency, min_signup_age, age_of_majority и выключение (is_enabled: false у включённой) — всегда через подтверждение вторым сотрудником (202); включение и прочие поля — сразу'
      minProperties: 1
      additionalProperties: false
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Действующая валюта ISO 4217 — вдвоём
          example: RUB
        phone_prefix:
          type: string
          pattern: ^\+[1-9][0-9]{0,3}$
          description: Телефонный код — сразу
          example: '+7'
        week_starts_on:
          type: integer
          minimum: 1
          maximum: 7
          description: Первый день недели — сразу
          example: 1
        min_signup_age:
          type: integer
          minimum: 1
          maximum: 120
          description: Минимальный возраст регистрации — вдвоём
          example: 14
        age_of_majority:
          type: integer
          minimum: 1
          maximum: 120
          description: Возраст совершеннолетия — вдвоём
          example: 18
        is_enabled:
          type: boolean
          description: true — включить сразу; false — выключить (вдвоём)
          example: false
        names:
          $ref: '#/components/schemas/GeoNamesPatch'
    GeoRegion:
      type: object
