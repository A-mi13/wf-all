              $ref: '#/components/schemas/StaffCodeRequest'
      responses:
        '200':
          description: Новые резервные коды
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffRecoveryCodes'
        default:
