        можно — тогда следующий запрос ответит 401. Ответ 204.

        Коды ошибок: 404 `staff.session_not_found` — сессии нет, она уже завершена или чужая.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      responses:
        '204':
          description: Сессия завершена
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/invites:
    post:
      operationId: createStaffInvite
      tags:
        - staff
      x-permission: handler
      x-permission-any:
        - staff.roles.grant
        - staff.roles.grant_elevated
      x-error-codes:
        - staff.email_taken
        - staff.city_not_found
      summary: Пригласить сотрудника
      description: |
        «Роли и доступ»: приглашение нового сотрудника. Право зависит от роли: владельца и админа
        приглашает только владелец (`staff.roles.grant_elevated`), модератора и поддержку — владелец
        или админ (`staff.roles.grant`). Приглашение всегда подтверждает второй сотрудник: ответ
        202 с запросом на подтверждение. После подтверждения создаётся учётка в статусе `invited` и
        уходит письмо с кодом; почта выключенной учётки возвращает ту же учётку через сброс доступа.

        Язык: необязательное поле `locale` (`ru` или `en`) — язык учётки и писем новичка, его выбирает
        приглашающий; нет поля — язык приглашающего (`StaffMe.locale`) на момент создания запроса. Язык
        хранится в запросе на подтверждение: смена языка приглашающего до подтверждения на новичка не влияет.
        Почта выключенной учётки — язык учётки перезаписывается выбранным (в журнале `staff.invited` —
        было/стало). Письмо приглашения и все повторные отправки идут на языке учётки, ссылка в письме —
        `ADMIN_ORIGIN/accept?lang=<язык>` (почты в адресе нет): страница принятия открывается на нём. При
        принятии язык экрана принятия (`locale` из `acceptStaffInvite`) перезаписывает язык учётки.

        Коды ошибок (форма тела проверяется по схеме до остальных правил):
        - 400 `validation.failed` по полю `body.locale` с кодом `enum` — незнакомый язык (в том числе
          пустая строка, другой регистр, `en-US`, `null`), как у `updateStaffMeLocale`.
        - 403 `auth.forbidden` — нет права выдать эту роль.
        - 409 `staff.email_taken` — почта уже у действующей учётки.
        - 422 `staff.city_not_found` — города из `city_ids` нет.
        - 400 `validation.failed` по `body.city_ids` с кодом `min_items` — модератор без городов.
        - 400 `validation.failed` по `body.city_ids`: `max_items` — города у роли не `moderator`
          (города бывают только у модератора); `maxItems` — больше 100 городов.
        - 400 `validation.failed` по `body.email`: `minLength` — короче 3 символов, `maxLength` — длиннее
          320 символов (до проверки формата).
        - 400 `validation.failed` по `body.email` с кодом `format` — не адрес почты по правилам админки:
          ровно одна `@`, локальная часть — ASCII dot-atom (RFC 5322) не длиннее 64 байт, домен — в том
          числе IDN (хранится в форме A-label `xn--…`) без невидимых и запрещённых IDNA символов, весь
          адрес — не длиннее 254 байт. Регистр и крайние пробелы не важны.
        - 400 `validation.failed` по `body.display_name`: `minLength` — имя пустое после обрезки крайних
          пробелов; `maxLength` — длиннее 80 символов; `format` — в имени управляющие символы (перевод
          строки, табуляция), форматирующие и bidi (U+202A–U+202E, U+2066–U+2069, U+200E/U+200F),
          разделители строк или невидимые символы (U+200B и подобные): они подменяют или прячут текст в
          письмах, подписях подтверждений и журнале. Только внутри эмодзи допустимы соединитель
          U+200D (между двумя эмодзи) и селекторы U+FE0E, U+FE0F (сразу после эмодзи или цифры
          кейкапа); имя без единого видимого символа — тоже `format`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Почта, имя, роль, города и язык нового сотрудника
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInviteRequest'
      responses:
        '202':
          description: Создан запрос на подтверждение приглашения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/accounts:
    get:
      operationId: listStaffAccounts
      tags:
        - staff
      x-permission: staff.accounts.read
      x-error-codes: []
      summary: Список сотрудников
      description: |
        «Роли и доступ»: сотрудники с ролью, городами, статусом, последним входом и состоянием
        приглашения («не принято / просрочено»). Порядок — новые сверху. Фильтры складываются:
        `status`, `role`, `q` — начало имени или почты без учёта регистра.
      parameters:
        - name: status
          in: query
          required: false
          description: Только учётки в этом состоянии; без параметра — все
          schema:
            $ref: '#/components/schemas/StaffStatus'
          example: active
        - name: role
          in: query
          required: false
          description: Только сотрудники с этой ролью; без параметра — все роли
          schema:
            $ref: '#/components/schemas/StaffRole'
          example: moderator
        - name: q
          in: query
          required: false
          description: Начало имени или почты, без учёта регистра
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: ива
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница сотрудников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/accounts/{staffId}:
    get:
      operationId: getStaffAccount
      tags:
        - staff
      x-permission: staff.accounts.read
      x-error-codes:
        - staff.not_found
      summary: Карточка сотрудника
      description: |
        «Роли и доступ»: учётка сотрудника — роль, города, статус, приглашение, блокировка входа.

        Коды ошибок: 404 `staff.not_found` — учётки нет.
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: Учётка сотрудника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/accounts/{staffId}/role:
    put:
      operationId: changeStaffRole
      tags:
        - staff
      x-permission: handler
      x-permission-any:
        - staff.roles.grant
        - staff.roles.grant_elevated
        - staff.roles.revoke
      x-error-codes:
        - staff.not_found
        - staff.self_action
        - staff.city_not_found
        - staff.last_owner
      summary: Сменить роль и города сотрудника
      description: |
        «Роли и доступ»: новая роль и города целиком. Право — по изменению:
        - старая или новая роль `owner` или `admin` — `staff.roles.grant_elevated`, вдвоём;
        - роль меняется или добавлен хотя бы один город — `staff.roles.grant`, вдвоём;
        - только снятие городов (остаётся хотя бы один) — `staff.roles.revoke`, сразу.

        Сразу — 200 с обновлённой учёткой; вдвоём — 202 с запросом на подтверждение. Смена роли
        гасит ожидающие запросы сотрудника на подтверждение.

        Коды ошибок:
        - 403 `auth.forbidden` — нет права на такое изменение.
        - 404 `staff.not_found` — учётки нет; 409 `staff.self_action` — свою роль менять нельзя.
        - 422 `staff.city_not_found` — города из `city_ids` нет; 400 `validation.failed` по
          `body.city_ids` с кодом `min_items` — модератор без городов, `max_items` — города у роли не
          `moderator` (города бывают только у модератора), `maxItems` — больше 100 городов.
        - 409 `staff.last_owner` — понижение последнего активного владельца.
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Новая роль и города
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRoleUpdate'
      responses:
        '200':
          description: Роль изменена сразу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
        '202':
          description: Создан запрос на подтверждение смены роли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/accounts/{staffId}/disable:
    post:
      operationId: disableStaffAccount
      tags:
        - staff
      x-permission: handler
      x-permission-any:
        - staff.roles.revoke
        - staff.roles.revoke_admin
        - staff.roles.revoke_owner
      x-error-codes:
        - staff.not_found
        - staff.self_action
        - staff.wrong_stage
        - staff.last_owner
      summary: Выключить учётку (снять роль)
      description: |
        «Роли и доступ»: снимает роль — учётка выключается, все её сессии и ожидающие запросы на
        подтверждение гасятся, история и журнал сохраняются. Право — по роли цели: модератор и
        поддержка — `staff.roles.revoke`, админ — `staff.roles.revoke_admin` (сразу; остальным
        владельцам уходит письмо), владелец — `staff.roles.revoke_owner` (вдвоём). Сразу — 200 с
        учёткой; вдвоём — 202 с запросом на подтверждение. В `confirm` — почта цели, введённая
        руками.

        Коды ошибок:
        - 403 `auth.forbidden` — нет права снять эту роль.
        - 404 `staff.not_found` — учётки нет; 409 `staff.self_action` — себя выключить нельзя;
          409 `staff.wrong_stage` — учётка уже выключена.
        - 409 `staff.last_owner` — последнего активного владельца выключить нельзя.
        - 400 `validation.failed` по `body.confirm` с кодом `mismatch` — почта не совпала.
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Причина, комментарий и почта цели
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffConfirmedAction'
      responses:
        '200':
          description: Учётка выключена сразу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
        '202':
          description: Создан запрос на подтверждение выключения владельца
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/accounts/{staffId}/access-reset:
    post:
      operationId: resetStaffAccess
      tags:
        - staff
      x-permission: handler
      x-permission-any:
        - staff.access.reset
        - staff.access.reset_elevated
      x-error-codes:
        - staff.not_found
        - staff.self_action
        - staff.last_owner
      summary: Сбросить доступ сотрудника
      description: |
        «Роли и доступ»: когда сотрудник потерял пароль или телефон. Всегда вдвоём — ответ 202 с
        запросом на подтверждение. После подтверждения пароль, второй фактор, резервные коды и
        сессии гасятся, учётка возвращается в `invited`, сотруднику уходит новое приглашение.
        Самостоятельного «забыл пароль» у сотрудников нет. Право — по роли цели: модератор и
        поддержка — `staff.access.reset`, владелец и админ — `staff.access.reset_elevated`. В
        `confirm` — почта цели, введённая руками.

        Коды ошибок:
        - 403 `auth.forbidden` — нет права сбросить доступ этой роли.
        - 404 `staff.not_found` — учётки нет; 409 `staff.self_action` — свой доступ — через «Мой
          доступ».
        - 409 `staff.last_owner` — сброс доступа единственному активному владельцу.
        - 400 `validation.failed` по `body.confirm` с кодом `mismatch` — почта не совпала.
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Причина, комментарий и почта цели
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffConfirmedAction'
      responses:
        '202':
          description: Создан запрос на подтверждение сброса доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/accounts/{staffId}/invite/resend:
    post:
      operationId: resendStaffInvite
      tags:
        - staff
      x-permission: staff.invites.resend
      x-error-codes:
        - staff.not_found
        - staff.self_action
        - staff.wrong_stage
      summary: Отправить приглашение повторно
      description: |
        «Роли и доступ»: новый код приглашения сотруднику, который ещё не настроил вход; прежний код
        больше не действует, срок 24 часа начинается заново. Ответ 204.

        Коды ошибок:
        - 404 `staff.not_found` — учётки нет; 409 `staff.self_action` — себе нельзя.
        - 409 `staff.wrong_stage` — учётка не в статусе `invited` (вход уже настроен или выключена).
        - 429 `ratelimit.exceeded` — с выпуска текущего приглашения (админом или оператором) не прошло
          60 секунд; повторные отправки самим сотрудником паузу не двигают (повторите через
          `Retry-After` секунд).
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      responses:
        '204':
          description: Новый код отправлен
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/accounts/{staffId}/sessions:
