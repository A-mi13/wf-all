        `feature.disabled`.
      responses:
        '200':
          description: Флаги функций
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagList'
        default:
          $ref: '#/components/responses/Problem'
  /v1/flags/{key}:
    patch:
      operationId: updateFeatureFlag
      tags:
        - platform
      x-permission: platform.flags.manage
      x-error-codes:
        - platform.flag_not_found
        - platform.flag_stale
        - platform.flag_city_not_found
        - platform.flag_global_only
        - platform.flag_requires
      summary: Переключить флаг
      description: |
        Включает или выключает флаг везде (`enabled_globally`) и задаёт города, где он включён
        (`enabled_city_ids` — список целиком, повторы схлопываются; без поля — города не меняются).
        `version` — версия флага, которую видел экран: правка проходит, только если флаг с тех пор не
        меняли (две вкладки не затирают друг друга). Ничего не изменилось — 200 без записи в журнал,
        версия не растёт; иначе версия растёт, в той же транзакции — запись журнала
        `platform.flag_changed` и событие.

        Коды ошибок:
        - 404 `platform.flag_not_found` — флага с таким ключом нет.
        - 409 `platform.flag_stale` — флаг изменили после того, как экран его прочитал (`version` не
          совпала): перечитайте флаг и повторите.
        - 422 `platform.flag_city_not_found` — в `enabled_city_ids` есть несуществующий город (город
          выключенной страны допустим).
        - 422 `platform.flag_global_only` — у флага не бывает списка городов (только «везде»: например,
          способы входа `auth_*` — до входа город неизвестен), а `enabled_city_ids` непустой.
        - 409 `platform.flag_requires` — флаг зависит от другого: включить `auth_google` нельзя при
          выключенном `auth_apple`, выключить `auth_apple` — при включённом `auth_google`; зависимость —
          в `detail`.
        - 400 `validation.failed` — ключ в пути не по шаблону (`path.key`), больше 1000 городов.
      parameters:
        - $ref: '#/components/parameters/FlagKey'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Версия флага и новые значения
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagPatch'
      responses:
        '200':
          description: Флаг после правки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        default:
          $ref: '#/components/responses/Problem'
  /v1/identity/captain-applications:
    get:
      operationId: listCaptainApplications
