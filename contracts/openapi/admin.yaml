      summary: Снять связь сотрудника с учёткой игрока
      description: |
        Карточка сотрудника, только владелец: снимает связь «сотрудник → учётка игрока». Сразу: запись
        в журнал, сотруднику уходит письмо. Связи не было — тоже 204, без записи и письма.

        Коды ошибок: 404 `staff.not_found` — сотрудника нет.
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      responses:
        '204':
