# API админки (admin-api). Потребитель — только apps/admin, теги не ставятся.
# Схема Problem продублирована в admin.yaml намеренно (контракты версионируются
# независимо); тест в contracts/ падает, если копии разошлись.
openapi: 3.0.3
info:
  title: WF admin API
  version: 0.1.0
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Проверка живости сервиса
      responses:
        "200":
          description: Сервис жив
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Стабильный машинный код ошибки; клиенты переводят текст по нему
        detail:
          type: string
        request_id:
          type: string
