      summary: Районы города
      description: |
        Районы города, включая архивные: сначала действующие по названию, затем архивные. Без
        пагинации — районов единицы. Модератор — только своего города (чужой — 403 `auth.forbidden`).

        Коды ошибок: 404 `geo.city_not_found` — города нет.
      parameters:
        - $ref: '#/components/parameters/CityId'
      responses:
        '200':
          description: Районы города
