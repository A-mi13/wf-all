openapi: 3.0.3
info:
  title: WF admin API
  version: 0.1.0
security:
  - session: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags:
        - platform
      security: []
      x-error-codes: []
      summary: Проверка живости сервиса
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: wf_admin_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ одного действия пользователя; повтор с тем же ключом не исполняется дважды
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Стабильный машинный код ошибки; клиенты переводят текст по нему
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: array
          description: Ошибки по полям — только у validation.failed
          items:
            type: object
            required:
              - field
              - code
            additionalProperties: false
            properties:
              field:
                type: string
                description: body.<путь через точку>, query.<имя>, path.<имя> или header.<имя>
              code:
                type: string
                description: 'Нарушенное правило схемы: required, minLength, maximum, enum, format…'
    Health:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
x-error-codes-common:
  - internal
  - request.invalid
  - request.too_large
  - validation.failed
  - http.not_found
  - http.method_not_allowed
x-anonymous-mutations: []
