      required:
        - items
      properties:
        items:
          type: array
          description: Регионы
          items:
            $ref: '#/components/schemas/GeoRegion'
    GeoImportStatus:
      type: string
      description: Состояние импорта. running — идёт; succeeded — завершён, данные записаны; failed — упал, данные не изменились (причина — error)
      enum:
        - running
        - succeeded
        - failed
      x-extensible-enum: true
    GeoImport:
      type: object
      description: Строка журнала импорта GeoNames по стране
