openapi: 3.0.3
info:
  title: WF admin API
  version: 0.2.0
  description: |
    API админки (admin-api); потребитель — только apps/admin, с того же origin, что и сам API.

    **Вход и сессия.** Сотрудник входит почтой и паролем (`staffLogin`), затем вторым фактором —
    кодом из приложения-аутентификатора или резервным кодом (`staffVerifyMfa`). Сессия — cookie
    `__Host-wf_admin_session` (`HttpOnly; Secure; SameSite=Strict; Path=/`, без `Domain` и срока):
    её ставят и меняют ответы с заголовком `Set-Cookie`, браузер шлёт её сам. Сроки — на сервере:
    8 часов от входа; бездействие дольше 20 минут или смена сети — 401 `auth.reauth_required`
    (сессия жива, нужен второй фактор — `staffUnlock`). Стадии сессии: `mfa_pending` (пароль
    принят, ждём второй фактор, 5 минут), `setup` (первый вход по приглашению — только настройка
    2FA), `active`. Клиент узнаёт стадию, роль и права из `GET /v1/staff/me`.

    **Права.** У каждой операции — расширение `x-permission`: ключ права из матрицы ролей
    (`GET /v1/staff/roles`) или служебное значение — `anonymous` (без сессии), `session` (сессия в
    любой стадии), `self` (активная сессия, только своё), `handler` (право зависит от тела или
    цели запроса; возможные права — в `x-permission-any`). Нет права — 403 `auth.forbidden`.
    Действие с правом «вдвоём» не исполняется сразу, а создаёт запрос на подтверждение: ответ
    `202` с `approval`, второй сотрудник решает его в «Подтверждениях» (`/v1/approvals`).

    Общие правила для всех операций:

    - **Ошибки** — `application/problem+json` (RFC 9457, схема `Problem`). Клиент решает
      по полю `code` и переводит текст по нему; `title` и `detail` — для разработчика, не
      для показа. Коды, общие для всех операций: `internal`, `request.invalid`,
      `request.too_large`, `validation.failed` (со списком полей в `errors`),
      `http.not_found`, `http.method_not_allowed`. Свои коды операции — в её описании.
      Механизмы платформы: `auth.unauthenticated` (401 — нет действующего входа, войдите
      заново), `ratelimit.exceeded` (429 — повторите через `Retry-After` секунд),
      `humancheck.required` (403 — решите задачу из поля `challenge` и повторите запрос с
      решением в заголовке `X-WF-Humancheck`), `idempotency.key_reused` (422 — ключ уже
      использован с другим запросом), `idempotency.in_progress` (409 — запрос с этим ключом ещё
      выполняется), `idempotency.replay_unavailable` (409 — действие выполнено, перечитайте
      состояние), `feature.disabled` (403 — функция выключена флагом).
      Конвейер админки: `auth.forbidden` (403 — нет права на операцию или город вне ваших),
      `auth.csrf_failed` (403 — запрос не со страницы админки: нет `Origin` админки или заголовка
      `X-WF-Admin`), `auth.ip_not_allowed` (403 — вход в админку с этого адреса закрыт),
      `auth.reauth_required` (401 — подтвердите вход вторым фактором, `staffUnlock`),
      `auth.setup_required` (403 — сначала завершите настройку 2FA). Общий с публичным API код
      `http.not_implemented` (501 — операция описана в контракте, но сервер её ещё не исполняет:
      этапы выкатываются по очереди; это не ошибка клиента).
    - **X-WF-Admin: 1** — обязательный заголовок каждого изменяющего запроса (POST, PUT, PATCH,
      DELETE) вместе с `Origin` админки — защита от подделки запроса с чужого сайта.
    - **X-WF-Background: 1** — необязательный заголовок фоновых запросов клиента (опрос счётчика
      подтверждений, статуса импорта): такой запрос не продлевает сессию — не обновляет время
      последней активности, — поэтому открытая, но брошенная вкладка через 20 минут всё равно
      получит 401 `auth.reauth_required`. Действия пользователя этот заголовок не ставят.
    - **Idempotency-Key** — обязательный заголовок изменяющих операций, кроме анонимных (вход,
      принятие приглашения, повторная отправка кода): новый ключ (UUID) на каждое действие
      пользователя, тот же ключ при повторе после обрыва сети — действие не выполнится дважды:
      повтор отдаёт сохранённый ответ с заголовком `Idempotency-Replayed: true`. Ответы с
      секретами (`x-idempotency: no-store`) не сохраняются: их повтор — 409
      `idempotency.replay_unavailable`.
    - **Время** — ISO 8601 в UTC (`2026-10-01T17:00:00Z`); местное время матча считается по
      таймзоне города или поля.
    - **Деньги** — целое число в минорных единицах (копейки) плюс код валюты ISO 4217.
    - **Списки** — страницы по курсору: `next_cursor` ответа передайте в `cursor` следующего
      запроса, `null` — страниц больше нет; курсор непрозрачный, испорченный — 400
      `validation.failed` по полю `query.cursor`.
    - **Тело запроса** — не больше 1 МиБ.
    - Поле `request_id` в ошибке — назовите его, сообщая о проблеме: по нему находится запрос в логах.
security:
  - session: []
tags:
  - name: staff
    description: Сотрудники админки — вход, второй фактор, сессии, «Мой доступ», приглашения, роли и доступ других сотрудников
  - name: geo
    description: Справочник geo в админке — города (активация из GeoNames, правка, привязка), районы, страны и их правила, регионы, импорт GeoNames; выбор городов модератора
  - name: identity
    description: Игроки в админке — заявки в капитаны, поиск игрока по почте для поддержки, сброс 2FA игрока через поддержку, статистика способов входа для экрана флагов
  - name: platform
    description: Механизмы платформы админки — журнал действий, подтверждения вдвоём, версии нативного приложения и флаги функций
paths:
  /v1/staff/auth/login:
    post:
      operationId: staffLogin
      tags:
        - staff
      security: []
      x-permission: anonymous
      x-rate-limit: staff_auth
      x-error-codes:
        - staff.invalid_credentials
      summary: Вход — почта и пароль
      description: |
        Первый шаг входа в админку. Без сессии. Успех — новая сессия в стадии `mfa_pending` на
        5 минут (cookie в `Set-Cookie`) и ответ `{stage: "mfa_pending"}`: дальше — второй фактор
        (`staffVerifyMfa`). Прежняя сессия из cookie, если была, гасится.

        Коды ошибок:
        - 400 `staff.invalid_credentials` — один ответ на всё: почты нет, пароль неверный, учётка не
          активна, без настроенного второго фактора или вход закрыт после неверных кодов. Время
          ответа одинаковое — по нему нельзя узнать, есть ли такая почта.
        - 429 `ratelimit.exceeded` — слишком много попыток с этого адреса или для этой почты
          (повторите через `Retry-After` секунд). Неверный пароль никого не блокирует.
      parameters:
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Почта и пароль сотрудника
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '200':
          description: Пароль принят — нужен второй фактор
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffStageResult'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/auth/mfa:
    post:
      operationId: staffVerifyMfa
      tags:
        - staff
      x-permission: session
      x-rate-limit: staff_auth
      x-error-codes:
        - staff.mfa_invalid
        - staff.wrong_stage
      summary: Вход — второй фактор
      description: |
        Второй шаг входа: код из приложения-аутентификатора или резервный код (ровно одно поле).
        Только для сессии в стадии `mfa_pending`. Успех — **новый токен** в стадии `active`
        (`Set-Cookie`, прежний токен больше не действует), ответ 204; резервный код сгорает.

        Коды ошибок:
        - 400 `staff.mfa_invalid` — код не подошёл; в `attempts_left` — сколько попыток осталось.
          Пятая неудача подряд закрывает вход на час и завершает все сессии сотрудника
          (`attempts_left: 0`).
        - 409 `staff.wrong_stage` — сессия не в стадии `mfa_pending`.
        - 401 `auth.unauthenticated` — сессии нет или 5 минут на второй фактор истекли: войдите
          заново.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Код из приложения или резервный код
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffFactorRequest'
      responses:
        '204':
          description: Вход выполнен — сессия активна
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/auth/unlock:
    post:
      operationId: staffUnlock
      tags:
        - staff
      x-permission: session
      x-rate-limit: staff_auth
      x-error-codes:
        - staff.mfa_invalid
        - staff.wrong_stage
      summary: Разблокировка сессии вторым фактором
      description: |
        Подтверждение входа после 401 `auth.reauth_required` (бездействие дольше 20 минут или смена
        сети): код из приложения или резервный код. Успех — **новый токен** (`Set-Cookie`), сессия
        принимает текущую сеть, ответ 204; исходный запрос можно повторить. Резервный код сгорает.

        Коды ошибок:
        - 400 `staff.mfa_invalid` — код не подошёл, в `attempts_left` — остаток попыток; пятая
          неудача подряд закрывает вход на час и завершает все сессии сотрудника.
        - 409 `staff.wrong_stage` — сессия не ждёт разблокировки.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Код из приложения или резервный код
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffFactorRequest'
      responses:
        '204':
          description: Сессия разблокирована
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/auth/logout:
    post:
      operationId: staffLogout
      tags:
        - staff
      x-permission: session
      x-rate-limit: staff_auth
      x-error-codes: []
      summary: Выход
      description: |
        Завершает текущую сессию в любой стадии и стирает cookie (`Set-Cookie` с `Max-Age=0`).
        Ответ 204.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      responses:
        '204':
          description: Сессия завершена, cookie стёрта
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/auth/invite/accept:
    post:
      operationId: staffAcceptInvite
      tags:
        - staff
      security: []
      x-permission: anonymous
      x-rate-limit: staff_auth
      x-error-codes:
        - staff.invite_invalid
      summary: Принятие приглашения — первый вход
      description: |
        Первый вход по письму-приглашению (и после сброса доступа): почта, код из письма и новый
        пароль. Без сессии. Успех — пароль сохранён, создаётся сессия в стадии `setup`
        (`Set-Cookie`, прежняя сессия из cookie гасится), ответ `{stage: "setup"}`: дальше —
        настройка 2FA (`staffMfaSetup`). Приглашение остаётся живым до завершения настройки —
        потерянную сессию настройки можно возобновить повторным принятием тем же или новым кодом.

        Язык: необязательное поле `locale` — язык, на котором показан экран принятия (выбор на устройстве
        или язык браузера); клиент админки шлёт его всегда — что сотрудник видит, то и сохраняется. Сохраняется в учётку
        (`StaffMe.locale`, язык админки и писем) в той же транзакции, что пароль, и только при успехе: при
        любой ошибке язык учётки не меняется. Нет поля — язык учётки прежний. Повторное принятие
        (возобновление настройки) перезаписывает язык. Смена языка видна в записи журнала
        `staff.invite_accepted` (было/стало).

        Коды ошибок (форма тела проверяется по схеме до остальных правил, поэтому незнакомый `locale`
        отсекается раньше правил пароля):
        - 400 `validation.failed` по полю `body.locale` с кодом `enum` — незнакомый язык (в том числе
          пустая строка, другой регистр, `en-US`, `null`), как у `updateStaffMeLocale`; проверяется до
          правил пароля и кода приглашения, попытка не пишется.
        - 400 `validation.failed` по полю `body.password` с кодом `too_short`, `too_long` или
          `common` — пароль не подходит (проверяется до кода приглашения).
        - 400 `staff.invite_invalid` — один ответ на всё: код неверный, почта не та, срок истёк или
          приглашения нет. Неверный код ничего не стирает и попыток не тратит: код длинный
          (`xxxxx-xxxxx`, 50 бит), перебор упирается в лимит адреса. Любая неудача (в том числе
          несуществующая почта) пишется в журнал действий одинаково — без автора, почта в записи
          маскирована; не больше 20 записей в час на почту, сверх — без записи, ответ тот же.
        - 429 `ratelimit.exceeded` — слишком много попыток с этого адреса.
      parameters:
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Почта, код из письма, новый пароль и необязательный язык с экрана приглашения
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAcceptInviteRequest'
      responses:
        '200':
          description: Приглашение принято — нужна настройка 2FA
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffStageResult'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/auth/invite/resend:
    post:
      operationId: staffResendInviteSelf
      tags:
        - staff
      security: []
      x-permission: anonymous
      x-rate-limit: staff_auth
      x-error-codes: []
      summary: Прислать код приглашения ещё раз
      description: |
        Сотрудник просит прислать код приглашения ещё раз. Без сессии, ответ всегда 202 — по нему
        нельзя узнать, есть ли такая почта. Письмо приходит с ТЕМ ЖЕ кодом: новый код не выпускается,
        код из прежних писем остаётся годным (чужое нажатие лишь присылает приглашённому копию его
        кода). Письмо уходит, только если приглашение живо, с прошлой отправки прошло 60 секунд и
        отправок за жизнь приглашения (сутки) меньше пяти; срок приглашения (24 часа) не продлевается.
        Новый код выпускает только админ (`resendStaffInvite`) или оператор сервера. Клиент показывает
        отсчёт 60 секунд до следующей попытки.

        Коды ошибок: 429 `ratelimit.exceeded` — слишком много запросов с этого адреса.
      parameters:
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Почта из приглашения
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffEmailRequest'
      responses:
        '202':
          description: Запрос принят; письмо уходит, если код можно выслать
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/me:
    get:
      operationId: getStaffMe
      tags:
        - staff
      x-permission: session
      x-error-codes: []
      summary: Кто вошёл
      description: |
        Учётка, роль, города, права и стадия текущей сессии — первый запрос админки при загрузке и
        проверка связи. Работает в любой стадии сессии и под `reauth_required` (поле
        `reauth_required: true`). Меню и кнопки строятся по `permissions`: раздела без права в меню
        нет.

        В стадии `mfa_pending` — только `stage`, `session`, `reauth_required` и пустые `city_ids` и
        `permissions`; в стадии `setup` — учётка без прав. Нет сессии — 401 `auth.unauthenticated`
        (экран входа).
      responses:
        '200':
          description: Текущий сотрудник и сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/me/locale:
    patch:
      operationId: updateStaffMeLocale
      tags:
        - staff
      x-permission: self
      x-error-codes: []
      summary: Сменить язык админки
      description: |
        Сохраняет язык админки и писем сотруднику — переключатель языка в меню профиля. Ответ 204;
        новый язык приходит в `GET /v1/staff/me`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Новый язык
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLocaleUpdate'
      responses:
        '204':
          description: Язык сохранён
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/me/mfa:
    get:
      operationId: getStaffMfa
      tags:
        - staff
      x-permission: self
      x-error-codes: []
      summary: Состояние второго фактора
      description: |
        «Мой доступ»: когда настроено приложение-аутентификатор и сколько резервных кодов осталось.
        Секрет и сами коды не возвращаются никогда.
      responses:
        '200':
          description: Состояние второго фактора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMfaStatus'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/me/mfa/setup:
    post:
      operationId: staffMfaSetup
      tags:
        - staff
      x-permission: session
      x-idempotency: no-store
      x-error-codes:
        - staff.wrong_stage
      summary: Настройка 2FA — новый секрет
      description: |
        Первый шаг настройки второго фактора — только в стадии `setup` (после принятия
        приглашения). Возвращает секрет и ссылку для QR; повторный вызов до подтверждения выпускает
        новый секрет. Ответ не сохраняется для повтора по `Idempotency-Key` (повтор —
        409 `idempotency.replay_unavailable`, вызовите заново с новым ключом) и не кэшируется.

        Коды ошибок: 409 `staff.wrong_stage` — сессия не в стадии `setup` (2FA уже настроена).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      responses:
        '200':
          description: Секрет приложения-аутентификатора
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMfaSecret'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/me/mfa/confirm:
    post:
      operationId: staffMfaConfirm
      tags:
        - staff
      x-permission: session
      x-idempotency: no-store
      x-error-codes:
        - staff.mfa_invalid
        - staff.wrong_stage
      summary: Настройка 2FA — подтверждение кодом
      description: |
        Второй шаг настройки: код из приложения сверяется с выданным секретом. Успех — 10 резервных
        кодов, показываются один раз. Только в стадии `setup`. Ответ не сохраняется для повтора по
        `Idempotency-Key` (повтор — 409 `idempotency.replay_unavailable`) и не кэшируется. Дальше —
        `staffRecoveryAck`.

        Коды ошибок:
        - 400 `staff.mfa_invalid` — код не подошёл (проверьте время на телефоне).
        - 409 `staff.wrong_stage` — сессия не в стадии `setup` или секрет ещё не выпущен.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminHeader'
      requestBody:
        description: Код из приложения-аутентификатора
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCodeRequest'
      responses:
        '200':
          description: Резервные коды
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffRecoveryCodes'
        default:
          $ref: '#/components/responses/Problem'
  /v1/staff/me/mfa/recovery-codes:
