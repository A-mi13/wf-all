# Схемы модуля geo (спека geo §4.1). Каждая регистрируется в ../root.yaml components.schemas;
# ссылки между схемами — через реестр root.yaml.
CityStatus:
  type: string
  description: >-
    Статус города. waitlist — игр пока нет, приложение показывает «станьте капитаном» (экран
    «Пустой город»); pilot — первые команды и модератор; live — город работает. Список открытый —
    незнакомое значение клиент обязан пережить
  enum: [waitlist, pilot, live]
  x-extensible-enum: true
GeoPoint:
  type: object
  description: Точка на карте, WGS 84, градусы
  required: [lat, lon]
  properties:
    lat:
      type: number
      format: double
      minimum: -90
      maximum: 90
      description: Широта, от -90 (юг) до 90 (север)
      example: 45.03442
    lon:
      type: number
      format: double
      minimum: -180
      maximum: 180
      description: Долгота, от -180 (запад) до 180 (восток)
      example: 41.9642
CountryRef:
  type: object
  description: Страна записи — код и название на языке ответа
  required: [code, name]
  properties:
    code:
      type: string
      pattern: '^[A-Z]{2}$'
      description: Код страны ISO 3166-1 alpha-2
      example: RU
    name:
      type: string
      description: Название страны на языке ответа; перевода нет — на языке страны
      example: Россия
RegionRef:
  type: object
  description: Регион (субъект, область) — id и название на языке ответа
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
      description: Id региона
      example: b7e4d2c9-1a3f-4e8b-9c6d-5f0a2e7b1c38
    name:
      type: string
      description: Название региона на языке ответа; перевода нет — на языке страны
      example: Ставропольский край
City:
  type: object
  description: Город платформы — пункт списка выбора города и основа карточки города
  required: [id, slug, name, status, timezone, location, region, country]
  properties:
    id:
      type: string
      format: uuid
      description: Id города — его сохраняет профиль игрока и передают другие операции
      example: 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
    slug:
      type: string
      pattern: '^[a-z0-9-]+$'
      description: Текущий адрес города в вебе; может смениться — прошлый адрес продолжает находить город
      example: stavropol
    name:
      type: string
      description: Название города на языке ответа; перевода нет — каноническое, на языке страны
      example: Ставрополь
    status:
      $ref: '../root.yaml#/components/schemas/CityStatus'
    timezone:
      type: string
      description: Таймзона IANA — местное время матчей города считается по ней
      example: Europe/Moscow
    location:
      $ref: '../root.yaml#/components/schemas/GeoPoint'
    region:
      type: object
      nullable: true
      description: Регион города; null — регион не задан
      allOf:
        - $ref: '../root.yaml#/components/schemas/RegionRef'
    country:
      $ref: '../root.yaml#/components/schemas/CountryRef'
District:
  type: object
  description: Район города — фильтр полей и матчей
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
      description: Id района
      example: c1d9e3a7-5b2f-4a8c-8e6d-0f4b7a2c9e15
    name:
      type: string
      description: Название района
      example: Промышленный
CityDetails:
  type: object
  description: >-
    Город с правилами страны и районами — экран города и настройки регистрации (возрастные
    пороги, валюта, телефонный код)
  allOf:
    - $ref: '../root.yaml#/components/schemas/City'
    - type: object
      required:
        - currency
        - default_locale
        - phone_prefix
        - week_starts_on
        - min_signup_age
        - age_of_majority
        - districts
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Валюта страны ISO 4217 — суммы города (аренда поля) в ней, в минорных единицах
          example: RUB
        default_locale:
          type: string
          pattern: '^[a-z]{2}$'
          description: Язык страны ISO 639-1 — на нём канонические названия
          example: ru
        phone_prefix:
          type: string
          pattern: '^\+\d{1,4}$'
          description: Телефонный код страны — подставляется в поле телефона
          example: '+7'
        week_starts_on:
          type: integer
          minimum: 1
          maximum: 7
          description: Первый день недели в календаре — 1 понедельник … 7 воскресенье (ISO 8601)
          example: 1
        min_signup_age:
          type: integer
          minimum: 0
          description: Минимальный возраст регистрации в стране, полных лет
          example: 14
        age_of_majority:
          type: integer
          minimum: 0
          description: Возраст совершеннолетия, полных лет — с него капитанство и покупки
          example: 18
        districts:
          type: array
          description: Районы города без архивных; пусто — районов нет
          items:
            $ref: '../root.yaml#/components/schemas/District'
CityPage:
  type: object
  description: Страница списка городов
  required: [items, next_cursor]
  properties:
    items:
      type: array
      description: Города страницы в порядке списка
      items:
        $ref: '../root.yaml#/components/schemas/City'
    next_cursor:
      type: string
      nullable: true
      description: Курсор следующей страницы — передайте его в cursor; null — страниц больше нет
      example: eyJ2IjoyLCJzIjoiOWMxZTRmMGEiLCJrIjpbMiw0MzM5MzEsIjNmMmM4ZTFhLTliNGQtNGM3ZS1hNmYxLTJkOGI1ZTBjOWE0NyJdfQ
GeoPlace:
  type: object
  description: Населённый пункт справочника GeoNames (CC BY 4.0), в котором находится точка запроса
  required: [geoname_id, name, region_name, country, distance_m, city]
  properties:
    geoname_id:
      type: integer
      format: int64
      description: Id места в GeoNames
      example: 487846
    name:
      type: string
      description: Название места на языке ответа; перевода нет — на языке страны
      example: Ставрополь
    region_name:
      type: string
      nullable: true
      description: Регион места на языке ответа; null — регион неизвестен
      example: Ставропольский край
    country:
      $ref: '../root.yaml#/components/schemas/CountryRef'
    distance_m:
      type: number
      format: double
      minimum: 0
      description: Расстояние от точки запроса до центра места, метры
      example: 1840.5
    city:
      type: object
      nullable: true
      description: >-
        Город платформы на этом месте (заведён и виден); null — города здесь пока нет, приложение
        предлагает стать капитаном. Если город есть, страна места — страна города
      allOf:
        - $ref: '../root.yaml#/components/schemas/City'
OpenCity:
  type: object
  description: Ближайший работающий город (pilot или live) и расстояние до него
  required: [city, distance_m]
  properties:
    city:
      $ref: '../root.yaml#/components/schemas/City'
    distance_m:
      type: number
      format: double
      minimum: 0
      description: Расстояние от точки запроса до центра города, метры
      example: 1840.5
NearestCity:
  type: object
  description: Автоопределение города по точке — ближайший работающий город и место точки
  required: [nearest_open, here]
  properties:
    nearest_open:
      type: object
      nullable: true
      description: >-
        Ближайший видимый город со статусом pilot или live, без ограничения расстояния; null —
        таких городов нет
      allOf:
        - $ref: '../root.yaml#/components/schemas/OpenCity'
    here:
      type: object
      nullable: true
      description: >-
        Населённый пункт, в котором точка (радиус пункта растёт с населением, от 2 до 30 км; из
        накрывающих — ближайший); null — точка вне населённых пунктов или в стране, где платформа
        не работает
      allOf:
        - $ref: '../root.yaml#/components/schemas/GeoPlace'
