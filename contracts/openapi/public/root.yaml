components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен (JWT) из входа в приложение; в Swagger — кнопка Authorize
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ одного действия пользователя; повтор с тем же ключом не исполняется дважды
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: 7f3c9a52-2d4e-4b8a-9c11-5e0d6f8b2a47
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >-
        Языки пользователя по RFC 9110 с q-весами; ответ — на первом поддерживаемом (ru, en; регион
        отбрасывается). Без заголовка, без поддерживаемого языка или с неразборчивым значением —
        названия на языке страны каждой записи. Приложение шлёт язык интерфейса устройства
      schema:
        type: string
      example: 'ru-RU,ru;q=0.9,en;q=0.8'
    CodeId:
      name: codeId
      in: path
      required: true
      description: Id кода из письма — code_id ответа CodeSent
      schema:
        type: string
        format: uuid
      example: 0193a1c3-1f2e-7d31-a4b5-6c7d8e9f0a12
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Id своей сессии из listMySessions
      schema:
        type: string
        format: uuid
      example: 0193a1c2-7b3e-7c21-9d5e-3e8f1a2b4c70
    IdentityId:
      name: identityId
      in: path
      required: true
      description: Id привязки Apple или Google из listMyAuthMethods
      schema:
        type: string
        format: uuid
      example: 0193a1c7-5d6e-7b71-a8f9-0a1b2c3d4e56
    PasskeyId:
      name: passkeyId
      in: path
      required: true
      description: Id ключа доступа из listMyAuthMethods
      schema:
        type: string
        format: uuid
      example: 0193a1c8-6e7f-7c81-b90a-1b2c3d4e5f67
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Id своей заявки в капитаны из listMyCaptainApplications или getMyCaptaincy
      schema:
        type: string
        format: uuid
      example: 0193a1c9-7f80-7d91-8a1b-2c3d4e5f6a78
    Cursor:
      name: cursor
      in: query
      required: false
      description: Курсор следующей страницы — next_cursor из предыдущего ответа; без него — первая страница
      schema:
        type: string
        maxLength: 1024
      example: eyJ2IjoxLCJrIjpbIjIwMjYtMTEtMTNUMDk6MDA6MDBaIl19
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы, от 1 до 100; без параметра — 20
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  headers:
    CacheNoStore:
      description: Ответ с токенами или секретом — не кэшируется нигде, в том числе браузером
      required: true
      schema:
        type: string
      example: no-store
    CachePrivate:
      description: Ответ зависит от игрока — общим кэшам и браузеру его не хранить
      required: true
      schema:
        type: string
      example: 'private, no-store'
    Vary:
      description: Всегда Accept-Language — ответ зависит от языка, кэши хранят языки раздельно
      required: true
      schema:
        type: string
      example: Accept-Language
    ContentLanguage:
      description: >-
        Язык названий в ответе (ru или en). Заголовка нет — поддерживаемый язык не выбран, названия
        на языке страны каждой записи
      required: false
      schema:
        type: string
      example: ru
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      headers:
        Retry-After:
          description: >-
            Через сколько секунд повторить — только у 429 ratelimit.exceeded и 429
            identity.resend_too_soon (повтор отправки кода раньше паузы)
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Ошибка по RFC 9457. Решение принимается по code, тексты — для разработчика
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: Тип проблемы по RFC 9457; сейчас всегда about:blank — смысл несёт code
          example: about:blank
        title:
          type: string
          description: Техническая сводка — текст HTTP-статуса; пользователю не показывать
          example: Bad Request
        status:
          type: integer
          description: HTTP-статус ответа, продублированный в теле
          example: 400
        code:
          type: string
          description: Стабильный машинный код ошибки; клиенты переводят текст по нему
          example: validation.failed
        detail:
          type: string
          description: Уточнение для разработчика; приходит не всегда, пользователю не показывать
          example: Тело запроса не разбирается как JSON
        request_id:
          type: string
          description: Id запроса — по нему запрос находится в логах сервера
          example: wf-api-7d9f/Yx3kQp1bZt-000042
        errors:
          type: array
          description: Ошибки по полям — только у validation.failed
          items:
            type: object
            required: [field, code]
            additionalProperties: false
            properties:
              field:
                type: string
                description: 'body.<путь через точку>, query.<имя>, path.<имя> или header.<имя>'
                example: body.name
              code:
                type: string
                description: 'Нарушенное правило схемы: required, minLength, maximum, enum, format…'
                example: minLength
        attempts_left:
          type: integer
          minimum: 0
          description: >-
            Сколько попыток осталось до блокировки — только у ошибок неверного кода или пароля, после
            которых число попыток ограничено; 0 — попыток больше нет, доступ закрыт на время
          example: 3
        reasons:
          type: array
          description: >-
            Причины отказа машинными значениями — только у двух кодов. У identity.captain_ineligible —
            невыполненные условия заявки в капитаны (значения схемы CaptainIneligibility; ограничение
            captain — причина restricted). У identity.password_weak — ровно одно значение: too_short
            (короче 10 символов), common (из списка распространённых паролей) или too_long (длиннее
            потолка). Список открытый: незнакомое значение показывайте общим текстом кода
          items:
            type: string
            description: Машинное значение причины
            example: too_short
          example: [too_short]
        methods:
          type: array
          description: >-
            Только у identity.mfa_required — вторые факторы аккаунта, которые принимает эта операция
            (значения схемы MfaMethod): totp, recovery_code, passkey. У confirmPasswordReset — только
            totp и recovery_code: ключ доступа при сбросе пароля не принимается. Клиент показывает
            выбор из этих способов и повторяет запрос со вторым фактором
          items:
            type: string
            description: Способ второго фактора (MfaMethod)
            example: totp
          example: [totp, recovery_code]
        available_at:
          type: string
          format: date-time
          description: >-
            Когда действие станет доступно (UTC) — только у identity.nickname_change_too_soon (смена
            ника раньше 30 дней) и identity.application_cooldown (повторная заявка в капитаны раньше
            7 дней после отказа)
          example: '2026-12-13T09:30:00Z'
        blocked_until:
          type: string
          format: date-time
          description: >-
            До какого момента (UTC) заблокирован аккаунт — только у identity.account_blocked. Поля нет
            у этого кода — блокировка бессрочная (null не приходит)
          example: '2026-11-20T00:00:00Z'
        job_id:
          type: integer
          format: int64
          description: >-
            Только у geo.import_in_progress админки — id задачи импорта страны, которая уже стоит в
            очереди или выполняется; её можно отменить cancelGeoImportJob
          example: 1842
        challenge:
          type: object
          description: >-
            Задача антибота — только у humancheck.required. Формат протокола ALTCHA, поля в
            camelCase, как их ждёт виджет ALTCHA: найдите число от 0 до maxNumber, при котором
            SHA-256(salt + число) в hex равен challenge, и повторите запрос с решением в заголовке
            X-WF-Humancheck (base64 от JSON с полями algorithm, challenge, number, salt, signature)
          required: [algorithm, challenge, maxNumber, salt, signature]
          additionalProperties: false
          properties:
            algorithm:
              type: string
              description: Хеш-функция задачи; сейчас всегда SHA-256
              example: SHA-256
            challenge:
              type: string
              description: SHA-256 от salt и искомого числа, hex
              example: 4d5b2c0e7f9a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8c
            maxNumber:
              type: integer
              format: int64
              description: Верхняя граница перебора
              example: 100000
            salt:
              type: string
              description: Соль с параметрами срока задачи (expires, Unix-время) и ключа подписи (kid)
              example: 'b1946ac92492d2347c62?expires=1790000000&kid=Hx3k9QpLm2s&'
            signature:
              type: string
              description: HMAC-SHA-256 задачи на ключе сервера, hex
              example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
