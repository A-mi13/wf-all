# Публичный API приложений и веба — исходник контракта (спека бэкенда §8.1).
# Бандл ../public.yaml собирает `pnpm --filter @wf/contracts bundle` (redocly); он коммитится
# и руками не правится. Операции модуля — <модуль>/paths.yaml, тег = имя модуля-реализатора;
# схемы — <модуль>/schemas.yaml, каждая регистрируется ниже в components.schemas.
# Схема Problem продублирована в admin/root.yaml намеренно (контракты версионируются
# независимо); тест бандлов в contracts/ падает после сборки, если копии разошлись.
# Версии — теги contracts-vX.Y.Z.
openapi: 3.0.3
info:
  title: WF public API
  version: 0.1.0
  description: |
    Публичный API приложений (iOS, Android) и веба. Операции с замком требуют заголовок
    `Authorization: Bearer <access-токен>`; операции без замка — анонимные: заголовок
    `Authorization` на них не читается, поэтому истёкший токен в нём не даёт 401 на обновлении
    токена, входе и кодах. На операции с замком (в том числе с необязательным входом) недействительный
    токен — 401 `auth.unauthenticated` сразу.

    Общие правила для всех операций:

    - **Ошибки** — `application/problem+json` (RFC 9457, схема `Problem`). Клиент решает
      по полю `code` и переводит текст по нему; `title` и `detail` — для разработчика, не
      для показа. Коды, общие для всех операций: `internal`, `request.invalid`,
      `request.too_large`, `validation.failed` (со списком полей в `errors`),
      `http.not_found`, `http.method_not_allowed`. Свои коды операции — в её описании.
      Механизмы платформы: `auth.unauthenticated` (401 — нет действующего входа, обновите токен
      или войдите заново), `ratelimit.exceeded` (429 — повторите через `Retry-After` секунд),
      `humancheck.required` (403 — решите задачу из поля `challenge` и повторите запрос с
      решением в заголовке `X-WF-Humancheck`), `idempotency.key_reused` (422 — ключ уже
      использован с другим запросом), `idempotency.in_progress` (409 — запрос с этим ключом ещё
      выполняется), `idempotency.replay_unavailable` (409 — действие выполнено, перечитайте
      состояние), `feature.disabled` (403 — функция выключена в вашем городе),
      `http.not_implemented` (501 — операция описана в контракте, но сервер её ещё не исполняет:
      этапы выкатываются по очереди; это не ошибка клиента).
    - **Idempotency-Key** — обязательный заголовок мутирующих операций: новый ключ (UUID) на
      каждое действие пользователя, тот же ключ при повторе после обрыва сети — действие не
      выполнится дважды: повтор отдаёт сохранённый ответ с заголовком `Idempotency-Replayed: true`.
    - **Время** — ISO 8601 в UTC (`2026-10-01T17:00:00Z`); местное время матча считается по
      таймзоне города или поля.
    - **Деньги** — целое число в минорных единицах (копейки) плюс код валюты ISO 4217.
    - **Язык** — операции справочников (тег `geo`) читают `Accept-Language` (RFC 9110, q-веса;
      несколько строк заголовка равны одной со списком через запятую): берётся первый
      поддерживаемый язык (`ru`, `en`; регион отбрасывается — `en-US` → `en`), названия — на нём,
      в ответе `Content-Language: <язык>`; нет перевода — каноническое название на языке страны.
      Поддерживаемого языка нет, заголовка нет или он не разбирается — названия на языке страны
      каждой записи, `Content-Language` не ставится. Такие ответы всегда с `Vary: Accept-Language`.
    - **Кэш** — значение `Cache-Control` каждой операции описано в её ответе 200.
    - **Тело запроса** — не больше 1 МиБ.
    - Поле `request_id` в ошибке — назовите его, сообщая о проблеме: по нему находится запрос в логах.
    - `identity.restricted` (403) — возможность закрыта санкцией модерации (например, создание
      матча или комментарии); его отдают операции разных модулей. Срок — в `restrictions` из
      `getMe`.

    **Вход и токены.** Вход (`login`, `completeMfa`, регистрация `confirmSignup`, отмена удаления
    `cancelDeletion`, сброс пароля `confirmPasswordReset`) отвечает `AuthResult`; при
    `status: authenticated` в нём пара токенов `TokenPair`:

    - **access** — JWT на 10 минут, заголовок `Authorization: Bearer <access>` у операций с замком;
    - **refresh** — непрозрачная строка: мобильный клиент хранит её в Keychain (iOS) или Keystore
      (Android) и никуда, кроме `refreshSession`, не передаёт. Каждый `refreshSession` выдаёт новую
      пару, прежний refresh больше не действует; срок бездействия — 90 дней на телефоне, 30 в вебе;
    - на `401 auth.unauthenticated` — один `refreshSession` и повтор запроса; `401
      identity.refresh_invalid` — войти заново. Обновление — последовательно, не параллельно, на одно
      устройство;
    - **веб** ходит через свой сервер (BFF): токены лежат в зашифрованной cookie, браузер их не видит;
    - **`device`** — мобильный клиент обязан передать объект `device` (`DeviceInfo`) в теле
      регистрации, входа, второго фактора, сброса пароля и отмены удаления; без него — `422
      identity.device_required`. Веб (BFF) поле не передаёт — устройство веба сервер узнаёт сам;
    - ответы с токенами — `Cache-Control: no-store`; выход — `logout`, сессии — `listMySessions`.
tags:
  - name: identity
    description: >-
      Игрок и его вход — регистрация и вход по почте, коды из письма, токены и сессии, аккаунт,
      двухфакторная аутентификация, ключи доступа, вход через Apple и Google, согласие с документами,
      удаление аккаунта, заявка в капитаны
  - name: geo
    description: >-
      Справочник городов и автоопределение города по геопозиции — выбор города, экран города,
      «пустой город»
  - name: platform
    description: Служебные операции платформы — минимальная версия приложения и подобное, не продуктовые сценарии
# Аутентификация по умолчанию; анонимная операция объявляет `security: []`.
security:
  - bearer: []
# Коды ошибок платформы — их может вернуть любая операция; у операций — свои x-error-codes.
x-error-codes-common:
  - internal
  - request.invalid
  - request.too_large
  - validation.failed
  - http.not_found
  - http.method_not_allowed
  - auth.unauthenticated
  - ratelimit.exceeded
  - humancheck.required
  - idempotency.key_reused
  - idempotency.in_progress
  - idempotency.replay_unavailable
  - feature.disabled
  - http.not_implemented
# Анонимные мутирующие операции (регистрация, вход, коды) — закрытый список operationId;
# каждая — с обоснованием в description операции. Остальные мутирующие требуют Idempotency-Key.
x-anonymous-mutations:
  - startSignup
  - confirmSignup
  - resendAuthCode
  - login
  - completeMfa
  - startPasswordReset
  - confirmPasswordReset
  - refreshSession
  - cancelDeletion
  - createDeviceChallenge
  - startMfaPasskey
  - createSocialNonce
  - socialLogin
  - completeSocialSignup
  - startPasskeyLogin
  - passkeyLogin
