# Операции платформы, не модуля: их реализует internal/httpapi/public.Server напрямую.
health:
  get:
    operationId: getHealth
    tags: [platform]
    security: []
    x-error-codes: []
    summary: Проверка живости сервиса
    description: |
      Отвечает 200, пока процесс жив и принимает запросы; база данных не проверяется.
      Без аутентификации. Используется хостингом для health check; клиентам — чтобы
      разбудить dev-стенд после простоя (первый запрос может идти до минуты).
    responses:
      '200':
        description: Сервис жив
        content:
          application/json:
            schema:
              $ref: '../root.yaml#/components/schemas/Health'
      default:
        $ref: '../root.yaml#/components/responses/Problem'
