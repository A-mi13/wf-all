      properties:
        available:
          type: boolean
          description: Ник можно взять
          example: false
        reason:
          type: string
          nullable: true
          description: 'Почему нельзя (значения NicknameUnavailableReason: invalid, taken, reserved) или null, если ник доступен'
          allOf:
            - $ref: '#/components/schemas/NicknameUnavailableReason'
    LegalDocumentKind:
