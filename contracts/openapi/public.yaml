              schema:
                $ref: '#/components/schemas/LinkedIdentity'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/identities/{identityId}:
    delete:
      operationId: unlinkIdentity
      tags:
        - identity
      x-rate-limit: account_secure
      x-error-codes:
        - identity.reauth_required
        - identity.identity_not_found
        - identity.last_method
      summary: Отвязать Apple или Google
      description: |
        Отвязка провайдера: вход Apple отзывается у Apple, владельцу уходит письмо.
        Работает при любых флагах (уменьшает поверхность входа). Нужен свежий вход (≤ 10 минут),
        иначе `403 identity.reauth_required`; получить — `reauthenticate`.

        - `identity.identity_not_found` (404) — привязки нет или она чужая;
        - `identity.last_method` (409) — это последний способ входа: сначала задайте пароль или
          добавьте ключ доступа.
      parameters:
        - $ref: '#/components/parameters/IdentityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Привязка удалена
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/mfa:
    get:
      operationId: getMyMfa
      tags:
        - identity
      x-error-codes: []
      summary: Состояние 2FA
