        Включена ли 2FA, когда подтверждена, сколько резервных кодов осталось и назначен ли сброс 2FA
        через поддержку (`reset_scheduled_at`): тогда покажите предупреждение «через N дней 2FA будет
        сброшена по запросу в поддержку» и кнопку «Отменить» (`cancelMyMfaReset`).
      responses:
        '200':
          description: Состояние 2FA
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/mfa/totp/setup:
    post:
      operationId: setupTotp
      tags:
        - identity
      x-rate-limit: account_secure
      x-idempotency: no-store
      x-error-codes:
        - identity.reauth_required
        - identity.mfa_already_enabled
      summary: Начать включение 2FA
      description: |
        Новый секрет TOTP и `otpauth_uri` для QR-кода приложения-аутентификатора; 2FA включает
        `confirmTotp`. Повторный вызов до подтверждения выпускает новый секрет (прежний больше не
        подойдёт). Нужен свежий вход (≤ 10 минут), иначе `403 identity.reauth_required`; получить —
        `reauthenticate`.

        Ответ с секретом не сохраняется ни в кэшах, ни в ключах идемпотентности: повтор с тем же
        `Idempotency-Key` — `409 idempotency.replay_unavailable`, секрет второй раз не отдаётся;
        вызовите заново с новым ключом.

        - `identity.mfa_already_enabled` (409) — 2FA уже включена.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Секрет TOTP
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      tags:
        - identity
      x-rate-limit: account_secure
      x-idempotency: no-store
      x-error-codes:
        - identity.mfa_setup_missing
        - identity.mfa_invalid
      summary: Подтвердить включение 2FA
      description: |
        Код из приложения-аутентификатора включает 2FA сразу и выдаёт 10 резервных кодов —
        покажите их до закрытия экрана: второй раз они не выдаются (новые — `regenerateRecoveryCodes`).
        Владельцу уходит письмо; другие сессии не отзываются.

        Ответ с кодами не сохраняется ни в кэшах, ни в ключах идемпотентности: повтор с тем же
        `Idempotency-Key` — `409 idempotency.replay_unavailable`, коды второй раз не отдаются; 2FA уже
        включена — выпустите новые коды `regenerateRecoveryCodes`.

        - `identity.mfa_setup_missing` (409) — нет начатого включения: сначала `setupTotp`;
        - `identity.mfa_invalid` (400) — неверный код: проверьте время на устройстве и повторите.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Код из приложения-аутентификатора
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        '200':
          description: 2FA включена, резервные коды
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/mfa/totp:
    delete:
      operationId: disableTotp
      tags:
        - identity
      x-rate-limit: account_secure
      x-error-codes:
        - identity.reauth_required
        - identity.mfa_not_enabled
      summary: Выключить 2FA
      description: |
        Удаляет секрет TOTP и резервные коды; владельцу уходит письмо. Нужен свежий вход (≤ 10 минут),
        подтверждённый вторым фактором (TOTP, резервный код или ключ доступа — пароль не годится),
        иначе `403 identity.reauth_required`; получить — `reauthenticate`.

        - `identity.mfa_not_enabled` (409) — 2FA и так выключена.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 2FA выключена
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - identity
      x-rate-limit: account_secure
      x-idempotency: no-store
      x-error-codes:
        - identity.reauth_required
        - identity.mfa_not_enabled
      summary: Новые резервные коды
      description: |
        Выпускает 10 новых резервных кодов, прежние больше не действуют. Покажите их до закрытия
        экрана. Нужен свежий вход (≤ 10 минут), иначе `403 identity.reauth_required`; получить —
        `reauthenticate`.

        Ответ с кодами не сохраняется ни в кэшах, ни в ключах идемпотентности: повтор с тем же
        `Idempotency-Key` — `409 idempotency.replay_unavailable`, коды второй раз не отдаются;
        вызовите заново с новым ключом.

        - `identity.mfa_not_enabled` (409) — 2FA выключена.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Новые резервные коды
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/passkeys/registration-options:
    post:
      operationId: startPasskeyRegistration
      tags:
        - identity
      x-rate-limit: account_secure
      x-error-codes:
        - identity.reauth_required
        - identity.passkey_limit
      summary: Задача WebAuthn для нового ключа
      description: |
        Добавление ключа доступа: задача WebAuthn (`PublicKeyCredentialCreationOptionsJSON`;
        `excludeCredentials` — уже имеющиеся ключи, `user.id` — случайный идентификатор, не id
        аккаунта). `options` передайте платформенному API как есть, ответ — в `registerPasskey` вместе
        с `challenge_id`. Задача одноразовая, живёт 5 минут. Запрос без тела. Нужен свежий вход (≤ 10
        минут), иначе `403 identity.reauth_required`; получить — `reauthenticate`.

        За основным флагом `auth_passkeys`: выключен — `403 feature.disabled` (новые ключи не
        добавляются; вход имеющимися — по `auth_passkeys_login`).

        - `identity.passkey_limit` (409) — у аккаунта уже 10 ключей: удалите ненужный.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Задача WebAuthn
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/passkeys:
    post:
      operationId: registerPasskey
      tags:
        - identity
      x-rate-limit: account_secure
      x-error-codes:
        - identity.passkey_invalid
        - identity.passkey_exists
      summary: Добавить ключ доступа
      description: |
        Ответ платформенного API на задачу `startPasskeyRegistration` и необязательное имя ключа —
        `201 Passkey`; владельцу уходит письмо. Свежий вход проверила задача.

        За основным флагом `auth_passkeys`: выключен — `403 feature.disabled`.

        - `identity.passkey_invalid` (400) — ответ ключа не прошёл проверку или задача истекла: начните
          заново;
        - `identity.passkey_exists` (409) — этот ключ уже зарегистрирован.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Ответ ключа и имя
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterRequest'
      responses:
        '201':
          description: Ключ добавлен
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/passkeys/{passkeyId}:
    patch:
      operationId: renamePasskey
      tags:
        - identity
      x-error-codes:
        - identity.passkey_not_found
      summary: Переименовать ключ доступа
      description: |
        Новое имя ключа для списка «Способы входа». Ответ — ключ с новым именем.

        - `identity.passkey_not_found` (404) — ключа нет или он чужой.
      parameters:
        - $ref: '#/components/parameters/PasskeyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Новое имя
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRenameRequest'
      responses:
        '200':
          description: Ключ переименован
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePasskey
      tags:
        - identity
      x-rate-limit: account_secure
      x-error-codes:
        - identity.reauth_required
        - identity.passkey_not_found
        - identity.last_method
      summary: Удалить ключ доступа
      description: |
        Удаляет ключ доступа; владельцу уходит письмо. Работает при любых флагах (уменьшает
        поверхность входа). Нужен свежий вход (≤ 10 минут), иначе `403 identity.reauth_required`;
        получить — `reauthenticate`.

        - `identity.passkey_not_found` (404) — ключа нет или он чужой;
        - `identity.last_method` (409) — это последний способ входа: сначала задайте пароль или
          привяжите Apple / Google.
      parameters:
        - $ref: '#/components/parameters/PasskeyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Ключ удалён
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/mfa-reset:
    delete:
      operationId: cancelMyMfaReset
      tags:
        - identity
      x-rate-limit: account_secure
      x-error-codes:
        - identity.mfa_reset_not_found
      summary: Отменить сброс 2FA через поддержку
      description: |
        Игрок отменяет назначенный по запросу в поддержку сброс 2FA (`MfaStatus.reset_scheduled_at`,
        `AuthResult.mfa.reset_at`): «это не я». Ответ `204`, владельцу уходит письмо. Вход со вторым
        фактором отменяет сброс сам: если сессия вошла с TOTP, резервным кодом или ключом, сброс уже
        отменён — ответ тоже `204`.

        - `identity.mfa_reset_not_found` (404) — назначенного сброса нет (выполнен или не
          назначался) и эта сессия его не отменяла.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Сброс отменён
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/captaincy:
    get:
      operationId: getMyCaptaincy
      tags:
        - identity
      x-error-codes: []
      summary: Моё капитанство
      description: |
        Экран «Стать капитаном»: допуски капитана по городам (`permits`, испытательный срок —
        `probationary`), можно ли подать заявку в текущем городе игрока (`eligibility`: причины отказа
        в `reasons`, `available_at` — когда закончится пауза после отказа) и открытая заявка, если она
        есть. Кнопку «Подать заявку» показывайте при `eligibility.eligible: true`, иначе — причины.
      responses:
        '200':
          description: Капитанство игрока
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Captaincy'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/captain-applications:
    get:
      operationId: listMyCaptainApplications
      tags:
        - identity
      x-error-codes: []
      summary: Мои заявки в капитаны
      description: |
        История своих заявок, новые сверху: статус, решение, код причины отказа и комментарий
        модератора. Страницы по курсору (`next_cursor` → `cursor`, `null` — страниц больше нет);
        испорченный курсор — `400 validation.failed` по полю `query.cursor`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница заявок
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptainApplicationPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/captain-applications:
    post:
      operationId: submitCaptainApplication
      tags:
        - identity
      x-error-codes:
        - identity.captain_ineligible
        - identity.application_exists
        - identity.application_cooldown
      summary: Подать заявку в капитаны
      description: |
        Заявка в капитаны; город — текущий город игрока (в теле не передаётся). Дальше её
        рассматривает модератор города, решение приходит письмом и видно в
        `listMyCaptainApplications`. Все поля формы необязательны; телефон — только контакт для
        модератора, он не подтверждается и модератор видит его как неподтверждённый.

        Условия: подтверждённая почта, возраст не ниже порога страны города, заполненный профиль, нет
        ограничения `captain`, не капитан другой команды в этом городе, нет допуска в этом городе.
        Пока модули профиля игрока и команд не запущены, проверить условия нельзя — отказ с причиной
        `checks_unavailable` (заявку подать нельзя, это не обход правила).

        - `identity.captain_ineligible` (409) — условия не выполнены, причины в `reasons` (значения
          `CaptainIneligibility`: `too_young`, `restricted`, `profile_incomplete`,
          `captain_elsewhere_in_city`, `already_permitted`, `checks_unavailable`);
        - `identity.application_exists` (409) — открытая заявка в этом городе уже есть;
        - `identity.application_cooldown` (409) — после отказа прошло меньше 7 дней; `available_at` —
          с какого момента можно подать снова.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Форма заявки
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptainApplicationSubmitRequest'
      responses:
        '201':
          description: Заявка подана
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptainApplication'
        '409':
          description: 'Заявку подать нельзя. Разбирайте по `code`: с этим статусом приходят и общие коды платформы (`idempotency.in_progress`, `idempotency.replay_unavailable` и др. — info.description), не только коды операции'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                captain_ineligible:
                  summary: Профиль не заполнен
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: identity.captain_ineligible
                    reasons:
                      - profile_incomplete
                application_cooldown:
                  summary: Отказ был меньше 7 дней назад
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: identity.application_cooldown
                    available_at: '2026-11-20T09:00:00Z'
        default:
          $ref: '#/components/responses/Problem'
  /v1/captain-applications/{applicationId}/withdraw:
    post:
      operationId: withdrawCaptainApplication
      tags:
        - identity
      x-error-codes:
        - identity.application_not_found
        - identity.application_closed
      summary: Отозвать заявку в капитаны
      description: |
        Отзыв своей заявки, пока она ждёт решения; паузы перед новой заявкой отзыв не ставит. Ответ —
        заявка со статусом `withdrawn`.

        - `identity.application_not_found` (404) — заявки нет или она чужая;
        - `identity.application_closed` (409) — заявка уже решена или отозвана.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Заявка отозвана
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptainApplication'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен (JWT) из входа в приложение; в Swagger — кнопка Authorize
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ одного действия пользователя; повтор с тем же ключом не исполняется дважды
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: 7f3c9a52-2d4e-4b8a-9c11-5e0d6f8b2a47
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Языки пользователя по RFC 9110 с q-весами; ответ — на первом поддерживаемом (ru, en; регион отбрасывается). Без заголовка, без поддерживаемого языка или с неразборчивым значением — названия на языке страны каждой записи. Приложение шлёт язык интерфейса устройства
      schema:
        type: string
      example: ru-RU,ru;q=0.9,en;q=0.8
    CodeId:
      name: codeId
      in: path
      required: true
      description: Id кода из письма — code_id ответа CodeSent
      schema:
        type: string
        format: uuid
      example: 0193a1c3-1f2e-7d31-a4b5-6c7d8e9f0a12
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Id своей сессии из listMySessions
      schema:
        type: string
        format: uuid
      example: 0193a1c2-7b3e-7c21-9d5e-3e8f1a2b4c70
    IdentityId:
      name: identityId
      in: path
      required: true
      description: Id привязки Apple или Google из listMyAuthMethods
      schema:
        type: string
        format: uuid
      example: 0193a1c7-5d6e-7b71-a8f9-0a1b2c3d4e56
    PasskeyId:
      name: passkeyId
      in: path
      required: true
      description: Id ключа доступа из listMyAuthMethods
      schema:
        type: string
        format: uuid
      example: 0193a1c8-6e7f-7c81-b90a-1b2c3d4e5f67
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Id своей заявки в капитаны из listMyCaptainApplications или getMyCaptaincy
      schema:
        type: string
        format: uuid
      example: 0193a1c9-7f80-7d91-8a1b-2c3d4e5f6a78
    Cursor:
      name: cursor
      in: query
      required: false
      description: Курсор следующей страницы — next_cursor из предыдущего ответа; без него — первая страница
      schema:
        type: string
        maxLength: 1024
      example: eyJ2IjoxLCJrIjpbIjIwMjYtMTEtMTNUMDk6MDA6MDBaIl19
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы, от 1 до 100; без параметра — 20
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  headers:
    CacheNoStore:
      description: Ответ с токенами или секретом — не кэшируется нигде, в том числе браузером
      required: true
      schema:
        type: string
      example: no-store
    CachePrivate:
      description: Ответ зависит от игрока — общим кэшам и браузеру его не хранить
      required: true
      schema:
        type: string
      example: private, no-store
    Vary:
      description: Всегда Accept-Language — ответ зависит от языка, кэши хранят языки раздельно
      required: true
      schema:
        type: string
      example: Accept-Language
    ContentLanguage:
      description: Язык названий в ответе (ru или en). Заголовка нет — поддерживаемый язык не выбран, названия на языке страны каждой записи
      required: false
      schema:
        type: string
      example: ru
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      headers:
        Retry-After:
          description: Через сколько секунд повторить — только у 429 ratelimit.exceeded и 429 identity.resend_too_soon (повтор отправки кода раньше паузы)
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Ошибка по RFC 9457. Решение принимается по code, тексты — для разработчика
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          description: Тип проблемы по RFC 9457; сейчас всегда about:blank — смысл несёт code
          example: about:blank
        title:
          type: string
          description: Техническая сводка — текст HTTP-статуса; пользователю не показывать
          example: Bad Request
        status:
          type: integer
          description: HTTP-статус ответа, продублированный в теле
          example: 400
        code:
          type: string
          description: Стабильный машинный код ошибки; клиенты переводят текст по нему
          example: validation.failed
        detail:
          type: string
          description: Уточнение для разработчика; приходит не всегда, пользователю не показывать
          example: Тело запроса не разбирается как JSON
        request_id:
          type: string
          description: Id запроса — по нему запрос находится в логах сервера
          example: wf-api-7d9f/Yx3kQp1bZt-000042
        errors:
          type: array
          description: Ошибки по полям — только у validation.failed
          items:
            type: object
            required:
              - field
              - code
            additionalProperties: false
            properties:
              field:
                type: string
                description: body.<путь через точку>, query.<имя>, path.<имя> или header.<имя>
                example: body.name
              code:
                type: string
                description: 'Нарушенное правило схемы: required, minLength, maximum, enum, format…'
                example: minLength
        attempts_left:
          type: integer
          minimum: 0
          description: Сколько попыток осталось до блокировки — только у ошибок неверного кода или пароля, после которых число попыток ограничено; 0 — попыток больше нет, доступ закрыт на время
          example: 3
        reasons:
          type: array
          description: 'Причины отказа машинными значениями — только у двух кодов. У identity.captain_ineligible — невыполненные условия заявки в капитаны (значения схемы CaptainIneligibility; ограничение captain — причина restricted). У identity.password_weak — ровно одно значение: too_short (короче 10 символов), common (из списка распространённых паролей) или too_long (длиннее потолка). Список открытый: незнакомое значение показывайте общим текстом кода'
          items:
            type: string
            description: Машинное значение причины
            example: too_short
          example:
            - too_short
        methods:
          type: array
          description: 'Только у identity.mfa_required — вторые факторы аккаунта, которые принимает эта операция (значения схемы MfaMethod): totp, recovery_code, passkey. У confirmPasswordReset — только totp и recovery_code: ключ доступа при сбросе пароля не принимается. Клиент показывает выбор из этих способов и повторяет запрос со вторым фактором'
          items:
            type: string
            description: Способ второго фактора (MfaMethod)
            example: totp
          example:
            - totp
            - recovery_code
        available_at:
          type: string
          format: date-time
          description: Когда действие станет доступно (UTC) — только у identity.nickname_change_too_soon (смена ника раньше 30 дней) и identity.application_cooldown (повторная заявка в капитаны раньше 7 дней после отказа)
          example: '2026-12-13T09:30:00Z'
        blocked_until:
          type: string
          format: date-time
          description: До какого момента (UTC) заблокирован аккаунт — только у identity.account_blocked. Поля нет у этого кода — блокировка бессрочная (null не приходит)
          example: '2026-11-20T00:00:00Z'
        job_id:
          type: integer
          format: int64
          description: Только у geo.import_in_progress админки — id задачи импорта страны, которая уже стоит в очереди или выполняется; её можно отменить cancelGeoImportJob
          example: 1842
        challenge:
          type: object
          description: 'Задача антибота — только у humancheck.required. Формат протокола ALTCHA, поля в camelCase, как их ждёт виджет ALTCHA: найдите число от 0 до maxNumber, при котором SHA-256(salt + число) в hex равен challenge, и повторите запрос с решением в заголовке X-WF-Humancheck (base64 от JSON с полями algorithm, challenge, number, salt, signature)'
          required:
            - algorithm
            - challenge
            - maxNumber
            - salt
            - signature
          additionalProperties: false
          properties:
            algorithm:
              type: string
              description: Хеш-функция задачи; сейчас всегда SHA-256
              example: SHA-256
            challenge:
              type: string
              description: SHA-256 от salt и искомого числа, hex
              example: 4d5b2c0e7f9a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8c
            maxNumber:
              type: integer
              format: int64
              description: Верхняя граница перебора
              example: 100000
            salt:
              type: string
              description: Соль с параметрами срока задачи (expires, Unix-время) и ключа подписи (kid)
              example: b1946ac92492d2347c62?expires=1790000000&kid=Hx3k9QpLm2s&
            signature:
              type: string
              description: HMAC-SHA-256 задачи на ключе сервера, hex
              example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    CityStatus:
      type: string
      description: Статус города. waitlist — игр пока нет, приложение показывает «станьте капитаном» (экран «Пустой город»); pilot — первые команды и модератор; live — город работает. Список открытый — незнакомое значение клиент обязан пережить
      enum:
        - waitlist
        - pilot
        - live
      x-extensible-enum: true
    GeoPoint:
      type: object
      description: Точка на карте, WGS 84, градусы
      required:
        - lat
        - lon
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Широта, от -90 (юг) до 90 (север)
          example: 45.03442
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Долгота, от -180 (запад) до 180 (восток)
          example: 41.9642
    CountryRef:
      type: object
      description: Страна записи — код и название на языке ответа
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
          description: Код страны ISO 3166-1 alpha-2
          example: RU
        name:
          type: string
          description: Название страны на языке ответа; перевода нет — на языке страны
          example: Россия
    RegionRef:
      type: object
      description: Регион (субъект, область) — id и название на языке ответа
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Id региона
          example: b7e4d2c9-1a3f-4e8b-9c6d-5f0a2e7b1c38
        name:
          type: string
          description: Название региона на языке ответа; перевода нет — на языке страны
          example: Ставропольский край
    City:
      type: object
      description: Город платформы — пункт списка выбора города и основа карточки города
      required:
        - id
        - slug
        - name
        - status
        - timezone
        - location
        - region
        - country
      properties:
        id:
          type: string
          format: uuid
          description: Id города — его сохраняет профиль игрока и передают другие операции
          example: 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          description: Текущий адрес города в вебе; может смениться — прошлый адрес продолжает находить город
          example: stavropol
        name:
          type: string
          description: Название города на языке ответа; перевода нет — каноническое, на языке страны
          example: Ставрополь
        status:
          $ref: '#/components/schemas/CityStatus'
        timezone:
          type: string
          description: Таймзона IANA — местное время матчей города считается по ней
          example: Europe/Moscow
        location:
          $ref: '#/components/schemas/GeoPoint'
        region:
          type: object
          nullable: true
          description: Регион города; null — регион не задан
          allOf:
            - $ref: '#/components/schemas/RegionRef'
        country:
          $ref: '#/components/schemas/CountryRef'
    District:
      type: object
      description: Район города — фильтр полей и матчей
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Id района
          example: c1d9e3a7-5b2f-4a8c-8e6d-0f4b7a2c9e15
        name:
          type: string
          description: Название района
          example: Промышленный
    CityDetails:
      type: object
      description: Город с правилами страны и районами — экран города и настройки регистрации (возрастные пороги, валюта, телефонный код)
      allOf:
        - $ref: '#/components/schemas/City'
        - type: object
          required:
            - currency
            - default_locale
            - phone_prefix
            - week_starts_on
            - min_signup_age
            - age_of_majority
            - districts
          properties:
            currency:
              type: string
              pattern: ^[A-Z]{3}$
              description: Валюта страны ISO 4217 — суммы города (аренда поля) в ней, в минорных единицах
              example: RUB
            default_locale:
              type: string
              pattern: ^[a-z]{2}$
              description: Язык страны ISO 639-1 — на нём канонические названия
              example: ru
            phone_prefix:
              type: string
              pattern: ^\+\d{1,4}$
              description: Телефонный код страны — подставляется в поле телефона
              example: '+7'
            week_starts_on:
              type: integer
              minimum: 1
              maximum: 7
              description: Первый день недели в календаре — 1 понедельник … 7 воскресенье (ISO 8601)
              example: 1
            min_signup_age:
              type: integer
              minimum: 0
              description: Минимальный возраст регистрации в стране, полных лет
              example: 14
            age_of_majority:
              type: integer
              minimum: 0
              description: Возраст совершеннолетия, полных лет — с него капитанство и покупки
              example: 18
            districts:
              type: array
              description: Районы города без архивных; пусто — районов нет
              items:
                $ref: '#/components/schemas/District'
    CityPage:
      type: object
      description: Страница списка городов
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          description: Города страницы в порядке списка
          items:
            $ref: '#/components/schemas/City'
        next_cursor:
          type: string
          nullable: true
          description: Курсор следующей страницы — передайте его в cursor; null — страниц больше нет
          example: eyJ2IjoyLCJmIjoiTHUtZXVQODNGd3ciLCJrIjpbIjEiLCI0MzM5MzEiLCIzZjJjOGUxYS05YjRkLTRjN2UtYTZmMS0yZDhiNWUwYzlhNDciXX0
    GeoPlace:
      type: object
      description: Населённый пункт справочника GeoNames (CC BY 4.0), в котором находится точка запроса
      required:
        - geoname_id
        - name
        - region_name
        - country
        - distance_m
        - city
      properties:
        geoname_id:
          type: integer
          format: int64
          description: Id места в GeoNames
          example: 487846
        name:
          type: string
          description: Название места на языке ответа; перевода нет — на языке страны
          example: Ставрополь
        region_name:
          type: string
          nullable: true
          description: Регион места на языке ответа; null — регион неизвестен
          example: Ставропольский край
        country:
          $ref: '#/components/schemas/CountryRef'
        distance_m:
          type: number
          format: double
          minimum: 0
          description: Расстояние от точки запроса до центра места, метры
          example: 1840.5
        city:
          type: object
          nullable: true
          description: Город платформы на этом месте (заведён и виден); null — города здесь пока нет, приложение предлагает стать капитаном. Если город есть, страна места — страна города
          allOf:
            - $ref: '#/components/schemas/City'
    OpenCity:
      type: object
      description: Ближайший работающий город (pilot или live) и расстояние до него
      required:
        - city
        - distance_m
      properties:
        city:
          $ref: '#/components/schemas/City'
        distance_m:
          type: number
          format: double
          minimum: 0
          description: Расстояние от точки запроса до центра города, метры
          example: 1840.5
    NearestCity:
      type: object
      description: Автоопределение города по точке — ближайший работающий город и место точки
      required:
        - nearest_open
        - here
      properties:
        nearest_open:
          type: object
          nullable: true
          description: Ближайший видимый город со статусом pilot или live, без ограничения расстояния; null — таких городов нет
          allOf:
            - $ref: '#/components/schemas/OpenCity'
        here:
          type: object
          nullable: true
          description: Населённый пункт, в котором точка (радиус пункта растёт с населением, от 2 до 30 км; из накрывающих — ближайший); null — точка вне населённых пунктов или в стране, где платформа не работает
          allOf:
            - $ref: '#/components/schemas/GeoPlace'
    AppPlatform:
      type: string
      description: Платформа мобильного приложения
      enum:
        - ios
        - android
      x-extensible-enum: true
    AppMinVersion:
      type: object
      description: Версии приложения для платформы. Все три поля null — версии ещё не заведены, приложение работает без проверки
      required:
        - platform
        - min_version
        - recommended_version
        - store_url
      properties:
        platform:
          $ref: '#/components/schemas/AppPlatform'
        min_version:
          type: string
          nullable: true
          pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
          description: Минимальная версия MAJOR.MINOR.PATCH — ниже неё приложение требует обновиться
          example: 1.4.0
        recommended_version:
          type: string
          nullable: true
          pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
          description: Рекомендуемая версия — ниже неё приложение предлагает обновиться; не ниже min_version
          example: 1.6.2
        store_url:
          type: string
          format: uri
          nullable: true
          description: Страница приложения в магазине платформы (App Store, Google Play), только https
          example: https://apps.apple.com/app/id6740000000
    AuthStatus:
      type: string
      description: 'Исход входа: authenticated — сессия выдана (tokens, user); mfa_required — нужен второй фактор (mfa); signup_required — учётка провайдера новая, нужна дорегистрация (social_signup); deletion_pending — аккаунт ждёт удаления, сессии нет, можно отменить удаление (deletion)'
      enum:
        - authenticated
        - mfa_required
        - signup_required
        - deletion_pending
      x-extensible-enum: true
    AuthResult:
      type: object
      description: |
        Результат входа или регистрации. Клиент ветвится по `status`, поле ветки приходит только в ней:

        - `authenticated` — `tokens` и `user`. Мобильный клиент кладёт `tokens.refresh_token` в
          Keychain / Keystore; веб-BFF — в зашифрованную cookie. `user.documents_acceptance_required` —
          показать экран «примите новую версию документов» → `acceptDocuments`;
        - `mfa_required` — `mfa`: экран второго фактора → `completeMfa` с `mfa.mfa_token`
          (ключом доступа — сначала `startMfaPasskey`); `mfa.reset_at` — назначен сброс 2FA через
          поддержку, предупредить игрока;
        - `signup_required` — `social_signup`: экран дорегистрации (город, дата рождения, ник,
          документы) → `completeSocialSignup` с `social_signup.signup_token`;
        - `deletion_pending` — `deletion`: экран «Аккаунт будет удалён `purge_at`. Отменить удаление?»
          → `cancelDeletion` с `deletion.restore_token`. Сессия не выдана.

        Незнакомый `status` (enum открытый) — показать общий текст ошибки и предложить обновить приложение.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/AuthStatus'
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          $ref: '#/components/schemas/AuthUser'
        mfa:
          $ref: '#/components/schemas/MfaChallenge'
        social_signup:
          $ref: '#/components/schemas/SocialSignupPending'
        deletion:
          $ref: '#/components/schemas/DeletionPending'
    TokenPair:
      type: object
      description: 'Токены сессии. access — короткий (10 минут), идёт в заголовке Authorization: Bearer; refresh — непрозрачный, меняется на каждом refreshSession (прежний после этого не действует)'
      required:
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_idle_expires_at
        - session_id
      properties:
        access_token:
          type: string
          description: Access-токен (JWT EdDSA) — заголовок «Authorization — Bearer» у операций с замком
          example: eyJhbGciOiJFZERTQSIsImtpZCI6Ikh4M2s5UXBMIn0.eyJzdWIiOiIwMTkzMmYxYy03YTNlIn0.c2lnbmF0dXJl
        access_expires_at:
          type: string
          format: date-time
          description: Когда access-токен истечёт (UTC); после — 401 auth.unauthenticated, обновите токен
          example: '2026-11-13T17:10:00Z'
        refresh_token:
          type: string
          description: Refresh-токен (256 бит, base64url) — только для refreshSession; хранить в Keychain / Keystore, никуда больше не передавать
          example: Yx3kQp1bZt7Lm2Vb4Np8Rt1Zw6Yc0Hs5Ae9Df3Gh7Jk
        refresh_idle_expires_at:
          type: string
          format: date-time
          description: До какого момента refresh действует без использования (UTC); каждое обновление продлевает срок. Телефон — 90 дней, веб — 30 дней
          example: '2027-02-11T17:00:00Z'
        session_id:
          type: string
          format: uuid
          description: Id сессии — совпадает с id в listMySessions (отметка «это устройство»)
          example: 0193a1c2-7b3e-7c21-9d5e-3e8f1a2b4c70
    AuthUser:
      type: object
      description: Игрок, на которого выдана сессия
      required:
        - id
        - nickname
        - new_user
        - documents_acceptance_required
      properties:
        id:
          type: string
          format: uuid
          description: Id игрока
          example: 0193a1c1-5d2e-7a10-8b3c-4f5e6a7b8c90
        nickname:
          type: string
          description: Ник игрока
          example: kosta_10
        new_user:
          type: boolean
          description: Аккаунт создан этим вызовом (регистрация) — клиент ведёт на шаг «Кто ты на поле»
          example: false
        documents_acceptance_required:
          type: boolean
          description: Вышла новая версия правил сервиса или политики конфиденциальности, а игрок её ещё не принял — показать экран согласия и вызвать acceptDocuments
          example: false
    MfaMethod:
      type: string
      description: 'Второй фактор: totp — код из приложения-аутентификатора; recovery_code — резервный код; passkey — ключ доступа (WebAuthn)'
      enum:
        - totp
        - recovery_code
        - passkey
      x-extensible-enum: true
    MfaChallenge:
      type: object
      description: 'Нужен второй фактор: mfa_token одноразовый, живёт 5 минут и выдерживает 5 неверных вводов — затем вход начинается заново'
      required:
        - mfa_token
        - expires_at
        - methods
        - reset_at
      properties:
        mfa_token:
          type: string
          description: Токен шага второго фактора (256 бит, base64url) — передайте в completeMfa
          example: Qm9vdHN0cmFwLW1mYS10b2tlbi0yNTYtYml0cy1iYXNlNjR1
        expires_at:
          type: string
          format: date-time
          description: Когда mfa_token истечёт (UTC); после — 410 identity.mfa_expired
          example: '2026-11-13T17:05:00Z'
        methods:
          type: array
          minItems: 1
          description: Вторые факторы аккаунта, которые принимает этот шаг; passkey — только если у аккаунта есть ключ доступа и вход ключами включён
          items:
            $ref: '#/components/schemas/MfaMethod'
          example:
            - totp
            - recovery_code
        reset_at:
          type: string
          format: date-time
          nullable: true
          description: Назначенный через поддержку сброс 2FA (UTC) или null. Вход со вторым фактором отменяет сброс — предупредите игрока «через N дней 2FA будет сброшена»
          example: null
    SocialSignupPending:
      type: object
      description: Учётка Apple или Google ещё не привязана ни к одному аккаунту — нужна дорегистрация completeSocialSignup
      required:
        - signup_token
        - expires_at
        - email
        - email_is_private_relay
      properties:
        signup_token:
          type: string
          description: Токен дорегистрации (256 бит, base64url), одноразовый
          example: U2lnbnVwLXRva2VuLTI1Ni1iaXRzLWJhc2U2NHVybC14eXo
        expires_at:
          type: string
          format: date-time
          description: Когда signup_token истечёт (UTC); после — 410 identity.signup_token_invalid
          example: '2026-11-13T17:15:00Z'
        email:
          type: string
          description: Подтверждённая провайдером почта — станет почтой аккаунта
          example: kosta.f@example.com
        email_is_private_relay:
          type: boolean
          description: Почта — скрытый адрес Apple (privaterelay.appleid.com); письма идут через Apple
          example: false
    DeletionPending:
      type: object
      description: 'Аккаунт ждёт удаления: вход подтвердил владельца, но сессия не выдана. Отмена удаления — cancelDeletion с restore_token'
      required:
        - restore_token
        - expires_at
        - purge_at
      properties:
        restore_token:
          type: string
          description: Токен отмены удаления (256 бит, base64url), одноразовый, живёт 10 минут
          example: UmVzdG9yZS10b2tlbi0yNTYtYml0cy1iYXNlNjR1cmwtYWJj
        expires_at:
          type: string
          format: date-time
          description: Когда restore_token истечёт (UTC); после — войдите снова
          example: '2026-11-13T17:10:00Z'
        purge_at:
          type: string
          format: date-time
          description: Когда аккаунт будет удалён без возможности восстановления (UTC)
          example: '2026-12-10T09:00:00Z'
    CodeSent:
      type: object
      description: 'Код отправлен (или нет — ответ одинаков, существование аккаунта не раскрывается): 6 цифр, живёт 15 минут, 5 неверных вводов гасят его'
      required:
        - code_id
        - expires_at
        - resend_available_at
      properties:
        code_id:
          type: string
          format: uuid
          description: Id кода — передайте в подтверждение и в resendAuthCode
          example: 0193a1c3-1f2e-7d31-a4b5-6c7d8e9f0a12
        expires_at:
          type: string
          format: date-time
          description: Когда код истечёт (UTC)
          example: '2026-11-13T17:15:00Z'
        resend_available_at:
          type: string
          format: date-time
          description: С какого момента можно отправить код повторно (UTC) — до него кнопка «Отправить снова» неактивна
          example: '2026-11-13T17:01:00Z'
    DeviceInfo:
      type: object
      description: Устройство мобильного клиента. Вне BFF обязательно на входе и регистрации (иначе 422 identity.device_required); веб (BFF) поле не передаёт — устройство веба BFF ставит сам
      required:
        - platform
        - install_id
        - model
        - os_version
        - app_version
      additionalProperties: false
      properties:
        platform:
          $ref: '#/components/schemas/AppPlatform'
        install_id:
          type: string
          minLength: 16
          maxLength: 128
          description: 'Идентификатор установки: iOS — UUID, сохранённый в Keychain; Android — ANDROID_ID. Сервер хранит только его HMAC'
          example: 6F9619FF-8B86-4D01-B42D-00CF4FC964FF
        model:
          type: string
          minLength: 1
          maxLength: 64
          description: Модель устройства — для экрана «Где вы вошли»
          example: iPhone15,2
        os_version:
          type: string
          minLength: 1
          maxLength: 32
          description: Версия ОС
          example: '18.1'
        app_version:
          type: string
