openapi: 3.0.3
info:
  title: WF public API
  version: 0.1.0
  description: |
    Публичный API приложений (iOS, Android) и веба. Операции с замком требуют заголовок
    `Authorization: Bearer <access-токен>`; операции без замка — анонимные: заголовок
    `Authorization` на них не читается, поэтому истёкший токен в нём не даёт 401 на обновлении
    токена, входе и кодах. На операции с замком (в том числе с необязательным входом) недействительный
    токен — 401 `auth.unauthenticated` сразу.

    Общие правила для всех операций:

    - **Ошибки** — `application/problem+json` (RFC 9457, схема `Problem`). Клиент решает
      по полю `code` и переводит текст по нему; `title` и `detail` — для разработчика, не
      для показа. Коды, общие для всех операций: `internal`, `request.invalid`,
      `request.too_large`, `validation.failed` (со списком полей в `errors`),
      `http.not_found`, `http.method_not_allowed`. Свои коды операции — в её описании.
      Механизмы платформы: `auth.unauthenticated` (401 — нет действующего входа, обновите токен
      или войдите заново), `ratelimit.exceeded` (429 — повторите через `Retry-After` секунд),
      `humancheck.required` (403 — решите задачу из поля `challenge` и повторите запрос с
      решением в заголовке `X-WF-Humancheck`), `idempotency.key_reused` (422 — ключ уже
      использован с другим запросом), `idempotency.in_progress` (409 — запрос с этим ключом ещё
      выполняется), `idempotency.replay_unavailable` (409 — действие выполнено, перечитайте
      состояние), `feature.disabled` (403 — функция выключена в вашем городе).
    - **Idempotency-Key** — обязательный заголовок мутирующих операций: новый ключ (UUID) на
      каждое действие пользователя, тот же ключ при повторе после обрыва сети — действие не
      выполнится дважды: повтор отдаёт сохранённый ответ с заголовком `Idempotency-Replayed: true`.
    - **Время** — ISO 8601 в UTC (`2026-10-01T17:00:00Z`); местное время матча считается по
      таймзоне города или поля.
    - **Деньги** — целое число в минорных единицах (копейки) плюс код валюты ISO 4217.
    - **Язык** — операции справочников (тег `geo`) читают `Accept-Language` (RFC 9110, q-веса;
      несколько строк заголовка равны одной со списком через запятую): берётся первый
      поддерживаемый язык (`ru`, `en`; регион отбрасывается — `en-US` → `en`), названия — на нём,
      в ответе `Content-Language: <язык>`; нет перевода — каноническое название на языке страны.
      Поддерживаемого языка нет, заголовка нет или он не разбирается — названия на языке страны
      каждой записи, `Content-Language` не ставится. Такие ответы всегда с `Vary: Accept-Language`.
    - **Кэш** — значение `Cache-Control` каждой операции описано в её ответе 200.
    - **Тело запроса** — не больше 1 МиБ.
    - Поле `request_id` в ошибке — назовите его, сообщая о проблеме: по нему находится запрос в логах.
security:
  - bearer: []
tags:
  - name: geo
    description: Справочник городов и автоопределение города по геопозиции — выбор города, экран города, «пустой город»
  - name: platform
    description: Служебные операции платформы — минимальная версия приложения и подобное, не продуктовые сценарии
paths:
  /v1/cities:
    get:
      operationId: listCities
      tags:
        - geo
      security: []
      x-error-codes: []
      summary: Список городов
      description: |
        Города платформы всех статусов (`waitlist`, `pilot`, `live`) — экран выбора города и
        подсказка при вводе. Видны только города включённых стран. Без аутентификации.

        Порядок: статус (`live`, затем `pilot`, затем `waitlist`), население по убыванию, id.
        Фильтры складываются: `status` (несколько значений — любой из них), `country`, `q` — начало
        названия на любом поддерживаемом языке (ru, en) без учёта регистра и ё/е.

        Страницы — по курсору: `next_cursor` ответа передайте в `cursor` следующего запроса; `null` —
        страниц больше нет. Курсор непрозрачный, собирать его нельзя; испорченный курсор или курсор
        другого списка — 400 `validation.failed` по полю `query.cursor`. Город, сменивший статус между
        запросами страниц, может встретиться дважды или ни разу — для справочника это допустимо.

        `q`, пустой после нормализации (одни знаки препинания или пробелы), — 400 `validation.failed`
        по полю `query.q` с правилом `minLength`. Незнакомое значение `status` — 400
        `validation.failed`: в ответах enum открытый, а фильтр принимает только известные значения.

        Названия — на языке из `Accept-Language` (см. описание API). Ответ кэшируется до 5 минут.
      parameters:
        - name: status
          in: query
          required: false
          description: Только города с этими статусами; несколько значений — повторите параметр (status=pilot&status=live). Без параметра — все статусы
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CityStatus'
          example:
            - pilot
            - live
        - name: country
          in: query
          required: false
          description: Только города страны с этим кодом ISO 3166-1 alpha-2, заглавными буквами
          schema:
            type: string
            pattern: ^[A-Z]{2}$
          example: RU
        - name: q
          in: query
          required: false
          description: Начало названия города на любом поддерживаемом языке (ru, en), без учёта регистра и ё/е — подсказка при вводе
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: став
        - name: cursor
          in: query
          required: false
          description: Курсор следующей страницы — next_cursor из предыдущего ответа; без него — первая страница
          schema:
            type: string
            maxLength: 1024
          example: eyJ2IjoyLCJzIjoiOWMxZTRmMGEiLCJrIjpbMiw0MzM5MzEsIjNmMmM4ZTFhLTliNGQtNGM3ZS1hNmYxLTJkOGI1ZTBjOWE0NyJdfQ
        - name: limit
          in: query
          required: false
          description: Размер страницы, от 1 до 100; без параметра — 20
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Страница городов
          headers:
            Cache-Control:
              description: Справочник — кэшируется до 5 минут, в том числе общими кэшами
              required: true
              schema:
                type: string
              example: public, max-age=300
            Vary:
              $ref: '#/components/headers/Vary'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/cities/nearest:
    get:
      operationId: findNearestCity
      tags:
        - geo
      security: []
      x-rate-limit: geo_nearest
      x-error-codes: []
      summary: Город по геопозиции
      description: |
        Автоопределение города при первом запуске и по кнопке «Определить»: по точке пользователя
        возвращает ближайший работающий город платформы и населённый пункт, в котором точка
        находится. Без аутентификации.

        - `nearest_open` — ближайший видимый город со статусом `pilot` или `live`, без ограничения
          расстояния; `null` — таких городов нет.
        - `here` — населённый пункт справочника GeoNames, «накрывающий» точку: радиус пункта растёт
          с населением (от 2 до 30 км), из накрывающих — ближайший; `null` — точка вне населённых
          пунктов или в стране, где платформа не работает. `here.city` — город платформы на этом
          месте; `null` — города здесь ещё нет: приложение предлагает стать капитаном.

        Координаты округляйте до 0,01° (около 1 км) — для города достаточно. Сервер координаты не
        сохраняет и в логи не пишет. `lat` вне [-90, 90], `lon` вне [-180, 180], `NaN`, `Infinity`,
        пустое значение — 400 `validation.failed` с полем. Лимит частоты свой, строже общего
        (`ratelimit.exceeded`, 429). Ответ не кэшируется.
      parameters:
        - name: lat
          in: query
          required: true
          description: Широта точки, градусы WGS 84, от -90 до 90; округлите до 0,01°
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 45.04
        - name: lon
          in: query
          required: true
          description: Долгота точки, градусы WGS 84, от -180 до 180; округлите до 0,01°
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 41.97
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Ближайший работающий город и место точки
          headers:
            Cache-Control:
              description: Ответ по координатам пользователя — не кэшируется
              required: true
              schema:
                type: string
              example: private, no-store
            Vary:
              $ref: '#/components/headers/Vary'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearestCity'
        default:
          $ref: '#/components/responses/Problem'
  /v1/cities/by-slug/{slug}:
    get:
      operationId: getCityBySlug
      tags:
        - geo
      security: []
      x-error-codes:
        - geo.city_not_found
      summary: Город по адресу в вебе
      description: |
        Тот же ответ, что у `getCity`, по `slug` из адреса веба. Прошлый `slug` города (после смены
        адреса) тоже находит город; в ответе — всегда текущий `slug`: веб перенаправляет на него.
        Без аутентификации.

        Ошибки: `geo.city_not_found` (404) — города с таким текущим или прошлым `slug` нет либо его
        страна выключена. Названия — на языке из `Accept-Language`. Ответ кэшируется до 5 минут.
      parameters:
        - name: slug
          in: path
          required: true
          description: Адрес города в вебе — текущий или прошлый
          schema:
            type: string
            pattern: ^[a-z0-9-]+$
            maxLength: 100
          example: stavropol
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Город с правилами страны и районами
          headers:
            Cache-Control:
              description: Справочник — кэшируется до 5 минут, в том числе общими кэшами
              required: true
              schema:
                type: string
              example: public, max-age=300
            Vary:
              $ref: '#/components/headers/Vary'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDetails'
        default:
          $ref: '#/components/responses/Problem'
  /v1/cities/{cityId}:
    get:
      operationId: getCity
      tags:
        - geo
      security: []
      x-error-codes:
        - geo.city_not_found
      summary: Город с настройками
      description: |
        Карточка города для экрана города и настроек регистрации: поля `City`, правила страны
        (валюта, язык, телефонный код, первый день недели, возрастные пороги) и районы без архивных.
        Без аутентификации.

        Ошибки: `geo.city_not_found` (404) — города нет или его страна выключена. Названия — на языке
        из `Accept-Language`. Ответ кэшируется до 5 минут.
      parameters:
        - name: cityId
          in: path
          required: true
          description: Id города
          schema:
            type: string
            format: uuid
          example: 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Город с правилами страны и районами
          headers:
            Cache-Control:
              description: Справочник — кэшируется до 5 минут, в том числе общими кэшами
              required: true
              schema:
                type: string
              example: public, max-age=300
            Vary:
              $ref: '#/components/headers/Vary'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDetails'
        default:
          $ref: '#/components/responses/Problem'
  /v1/app/min-version:
    get:
      operationId: getAppMinVersion
      tags:
        - platform
      security: []
      x-error-codes: []
      summary: Минимальная версия приложения
      description: |
        Приложение спрашивает при запуске: ниже `min_version` — экран обязательного обновления со
        ссылкой `store_url`; ниже `recommended_version` — предложение обновиться, которое можно
        закрыть. Версии сравниваются как MAJOR.MINOR.PATCH, сборка отбрасывается (`1.2.3+45` →
        `1.2.3`). Без аутентификации.

        Версии для платформы ещё не заведены — 200 с `null` в `min_version`, `recommended_version`
        и `store_url`: приложение работает без проверки. Версии меняются в админке без выпуска
        сервера; ответ кэшируется до минуты.

        `platform` — только `ios` или `android`: другое значение — 400 `validation.failed` (enum
        помечен `x-extensible-enum` по правилу контракта, но валидатор запросов незнакомое значение
        отвергает).
      parameters:
        - name: platform
          in: query
          required: true
          description: Платформа приложения, которое спрашивает
          schema:
            $ref: '#/components/schemas/AppPlatform'
          example: ios
      responses:
        '200':
          description: Версии приложения для платформы
          headers:
            Cache-Control:
              description: Кэшируется до минуты — смена версий в админке доходит до приложений не позже
              required: true
              schema:
                type: string
              example: public, max-age=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppMinVersion'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен (JWT) из входа в приложение; в Swagger — кнопка Authorize
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ одного действия пользователя; повтор с тем же ключом не исполняется дважды
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: 7f3c9a52-2d4e-4b8a-9c11-5e0d6f8b2a47
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Языки пользователя по RFC 9110 с q-весами; ответ — на первом поддерживаемом (ru, en; регион отбрасывается). Без заголовка, без поддерживаемого языка или с неразборчивым значением — названия на языке страны каждой записи. Приложение шлёт язык интерфейса устройства
      schema:
        type: string
      example: ru-RU,ru;q=0.9,en;q=0.8
  headers:
    Vary:
      description: Всегда Accept-Language — ответ зависит от языка, кэши хранят языки раздельно
      required: true
      schema:
        type: string
      example: Accept-Language
    ContentLanguage:
      description: Язык названий в ответе (ru или en). Заголовка нет — поддерживаемый язык не выбран, названия на языке страны каждой записи
      required: false
      schema:
        type: string
      example: ru
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      headers:
        Retry-After:
          description: Через сколько секунд повторить — только у 429 ratelimit.exceeded
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Ошибка по RFC 9457. Решение принимается по code, тексты — для разработчика
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          description: Тип проблемы по RFC 9457; сейчас всегда about:blank — смысл несёт code
          example: about:blank
        title:
          type: string
          description: Техническая сводка — текст HTTP-статуса; пользователю не показывать
          example: Bad Request
        status:
          type: integer
          description: HTTP-статус ответа, продублированный в теле
          example: 400
        code:
          type: string
          description: Стабильный машинный код ошибки; клиенты переводят текст по нему
          example: validation.failed
        detail:
          type: string
          description: Уточнение для разработчика; приходит не всегда, пользователю не показывать
          example: Тело запроса не разбирается как JSON
        request_id:
          type: string
          description: Id запроса — по нему запрос находится в логах сервера
          example: wf-api-7d9f/Yx3kQp1bZt-000042
        errors:
          type: array
          description: Ошибки по полям — только у validation.failed
          items:
            type: object
            required:
              - field
              - code
            additionalProperties: false
            properties:
              field:
                type: string
                description: body.<путь через точку>, query.<имя>, path.<имя> или header.<имя>
                example: body.name
              code:
                type: string
                description: 'Нарушенное правило схемы: required, minLength, maximum, enum, format…'
                example: minLength
        challenge:
          type: object
          description: 'Задача антибота — только у humancheck.required. Формат протокола ALTCHA, поля в camelCase, как их ждёт виджет ALTCHA: найдите число от 0 до maxNumber, при котором SHA-256(salt + число) в hex равен challenge, и повторите запрос с решением в заголовке X-WF-Humancheck (base64 от JSON с полями algorithm, challenge, number, salt, signature)'
          required:
            - algorithm
            - challenge
            - maxNumber
            - salt
            - signature
          additionalProperties: false
          properties:
            algorithm:
              type: string
              description: Хеш-функция задачи; сейчас всегда SHA-256
              example: SHA-256
            challenge:
              type: string
              description: SHA-256 от salt и искомого числа, hex
              example: 4d5b2c0e7f9a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8c
            maxNumber:
              type: integer
              format: int64
              description: Верхняя граница перебора
              example: 100000
            salt:
              type: string
              description: Соль с параметрами срока задачи (expires, Unix-время) и ключа подписи (kid)
              example: b1946ac92492d2347c62?expires=1790000000&kid=Hx3k9QpLm2s&
            signature:
              type: string
              description: HMAC-SHA-256 задачи на ключе сервера, hex
              example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    CityStatus:
      type: string
      description: Статус города. waitlist — игр пока нет, приложение показывает «станьте капитаном» (экран «Пустой город»); pilot — первые команды и модератор; live — город работает. Список открытый — незнакомое значение клиент обязан пережить
      enum:
        - waitlist
        - pilot
        - live
      x-extensible-enum: true
    GeoPoint:
      type: object
      description: Точка на карте, WGS 84, градусы
      required:
        - lat
        - lon
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Широта, от -90 (юг) до 90 (север)
          example: 45.03442
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Долгота, от -180 (запад) до 180 (восток)
          example: 41.9642
    CountryRef:
      type: object
      description: Страна записи — код и название на языке ответа
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
          description: Код страны ISO 3166-1 alpha-2
          example: RU
        name:
          type: string
          description: Название страны на языке ответа; перевода нет — на языке страны
          example: Россия
    RegionRef:
      type: object
      description: Регион (субъект, область) — id и название на языке ответа
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Id региона
          example: b7e4d2c9-1a3f-4e8b-9c6d-5f0a2e7b1c38
        name:
          type: string
          description: Название региона на языке ответа; перевода нет — на языке страны
          example: Ставропольский край
    City:
      type: object
      description: Город платформы — пункт списка выбора города и основа карточки города
      required:
        - id
        - slug
        - name
        - status
        - timezone
        - location
        - region
        - country
      properties:
        id:
          type: string
          format: uuid
          description: Id города — его сохраняет профиль игрока и передают другие операции
          example: 3f2c8e1a-9b4d-4c7e-a6f1-2d8b5e0c9a47
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          description: Текущий адрес города в вебе; может смениться — прошлый адрес продолжает находить город
          example: stavropol
        name:
          type: string
          description: Название города на языке ответа; перевода нет — каноническое, на языке страны
          example: Ставрополь
        status:
          $ref: '#/components/schemas/CityStatus'
        timezone:
          type: string
          description: Таймзона IANA — местное время матчей города считается по ней
          example: Europe/Moscow
        location:
          $ref: '#/components/schemas/GeoPoint'
        region:
          type: object
          nullable: true
          description: Регион города; null — регион не задан
          allOf:
            - $ref: '#/components/schemas/RegionRef'
        country:
          $ref: '#/components/schemas/CountryRef'
    District:
      type: object
      description: Район города — фильтр полей и матчей
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Id района
          example: c1d9e3a7-5b2f-4a8c-8e6d-0f4b7a2c9e15
        name:
          type: string
          description: Название района
          example: Промышленный
    CityDetails:
      type: object
      description: Город с правилами страны и районами — экран города и настройки регистрации (возрастные пороги, валюта, телефонный код)
      allOf:
        - $ref: '#/components/schemas/City'
        - type: object
          required:
            - currency
            - default_locale
            - phone_prefix
            - week_starts_on
            - min_signup_age
            - age_of_majority
            - districts
          properties:
            currency:
              type: string
              pattern: ^[A-Z]{3}$
              description: Валюта страны ISO 4217 — суммы города (аренда поля) в ней, в минорных единицах
              example: RUB
            default_locale:
              type: string
              pattern: ^[a-z]{2}$
              description: Язык страны ISO 639-1 — на нём канонические названия
              example: ru
            phone_prefix:
              type: string
              pattern: ^\+\d{1,4}$
              description: Телефонный код страны — подставляется в поле телефона
              example: '+7'
            week_starts_on:
              type: integer
              minimum: 1
              maximum: 7
              description: Первый день недели в календаре — 1 понедельник … 7 воскресенье (ISO 8601)
              example: 1
            min_signup_age:
              type: integer
              minimum: 0
              description: Минимальный возраст регистрации в стране, полных лет
              example: 14
            age_of_majority:
              type: integer
              minimum: 0
              description: Возраст совершеннолетия, полных лет — с него капитанство и покупки
              example: 18
            districts:
              type: array
              description: Районы города без архивных; пусто — районов нет
              items:
                $ref: '#/components/schemas/District'
    CityPage:
      type: object
      description: Страница списка городов
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          description: Города страницы в порядке списка
          items:
            $ref: '#/components/schemas/City'
        next_cursor:
          type: string
          nullable: true
          description: Курсор следующей страницы — передайте его в cursor; null — страниц больше нет
          example: eyJ2IjoyLCJzIjoiOWMxZTRmMGEiLCJrIjpbMiw0MzM5MzEsIjNmMmM4ZTFhLTliNGQtNGM3ZS1hNmYxLTJkOGI1ZTBjOWE0NyJdfQ
    GeoPlace:
      type: object
      description: Населённый пункт справочника GeoNames (CC BY 4.0), в котором находится точка запроса
      required:
        - geoname_id
        - name
        - region_name
        - country
        - distance_m
        - city
      properties:
        geoname_id:
          type: integer
          format: int64
          description: Id места в GeoNames
          example: 487846
        name:
          type: string
          description: Название места на языке ответа; перевода нет — на языке страны
          example: Ставрополь
        region_name:
          type: string
          nullable: true
          description: Регион места на языке ответа; null — регион неизвестен
          example: Ставропольский край
        country:
          $ref: '#/components/schemas/CountryRef'
        distance_m:
          type: number
          format: double
          minimum: 0
          description: Расстояние от точки запроса до центра места, метры
          example: 1840.5
        city:
          type: object
          nullable: true
          description: Город платформы на этом месте (заведён и виден); null — города здесь пока нет, приложение предлагает стать капитаном. Если город есть, страна места — страна города
          allOf:
            - $ref: '#/components/schemas/City'
    OpenCity:
      type: object
      description: Ближайший работающий город (pilot или live) и расстояние до него
      required:
        - city
        - distance_m
      properties:
        city:
          $ref: '#/components/schemas/City'
        distance_m:
          type: number
          format: double
          minimum: 0
          description: Расстояние от точки запроса до центра города, метры
          example: 1840.5
    NearestCity:
      type: object
      description: Автоопределение города по точке — ближайший работающий город и место точки
      required:
        - nearest_open
        - here
      properties:
        nearest_open:
          type: object
          nullable: true
          description: Ближайший видимый город со статусом pilot или live, без ограничения расстояния; null — таких городов нет
          allOf:
            - $ref: '#/components/schemas/OpenCity'
        here:
          type: object
          nullable: true
          description: Населённый пункт, в котором точка (радиус пункта растёт с населением, от 2 до 30 км; из накрывающих — ближайший); null — точка вне населённых пунктов или в стране, где платформа не работает
          allOf:
            - $ref: '#/components/schemas/GeoPlace'
    AppPlatform:
      type: string
      description: Платформа мобильного приложения
      enum:
        - ios
        - android
      x-extensible-enum: true
    AppMinVersion:
      type: object
      description: Версии приложения для платформы. Все три поля null — версии ещё не заведены, приложение работает без проверки
      required:
        - platform
        - min_version
        - recommended_version
        - store_url
      properties:
        platform:
          $ref: '#/components/schemas/AppPlatform'
        min_version:
          type: string
          nullable: true
          pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
          description: Минимальная версия MAJOR.MINOR.PATCH — ниже неё приложение требует обновиться
          example: 1.4.0
        recommended_version:
          type: string
          nullable: true
          pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
          description: Рекомендуемая версия — ниже неё приложение предлагает обновиться; не ниже min_version
          example: 1.6.2
        store_url:
          type: string
          format: uri
          nullable: true
          description: Страница приложения в магазине платформы (App Store, Google Play), только https
          example: https://apps.apple.com/app/id6740000000
x-error-codes-common:
  - internal
  - request.invalid
  - request.too_large
  - validation.failed
  - http.not_found
  - http.method_not_allowed
  - auth.unauthenticated
  - ratelimit.exceeded
  - humancheck.required
  - idempotency.key_reused
  - idempotency.in_progress
  - idempotency.replay_unavailable
  - feature.disabled
x-anonymous-mutations: []
