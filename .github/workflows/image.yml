name: image
# Образ бэкенда (backend/Dockerfile) собирается и запускается так же, как на dev-стенде Render: миграции на чистую
# базу, затем API, затем /healthz, /readyz, /docs и smoke публичных ручек (listCities, getAppMinVersion); затем
# admin-api со статикой собранной админки (план C, Task 1). Локально — Docker Desktop (deploy/server/README.md, «Проверка локально»).
# Отдельный workflow, а не job в backend.yml: образ собирает и админку, и правка админки должна запускать проверку
# образа, но не Go-тесты бэкенда (до 30 мин). Пути — buildFilter сервисов render.yaml плюс то, что читает сама
# проверка (initdb, этот файл); TestRenderYAMLBuild (config) сверяет, что все пути buildFilter здесь есть.
on:
  push:
    branches: [main]
    paths: &paths
      - 'backend/**'
      - 'apps/admin/**'
      - 'apps/web/package.json'
      - 'packages/**'
      - 'contracts/package.json'
      - 'contracts/src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - 'scripts/check-admin-dist.mjs'
      - 'render.yaml'
      - 'deploy/dev/initdb/**'
      # свой сервер (job server): compose, Caddy, шаблоны env
      - 'deploy/server/**'
      - '.github/workflows/image.yml'
  pull_request:
    paths: *paths
permissions:
  contents: read
# новый пуш в PR отменяет его устаревший прогон; на main прогоны не отменяются — по ним деплой
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    runs-on: ubuntu-latest
    # 20: к сборке Go добавилась стадия админки (pnpm install + tsc + vite build)
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: psql "postgresql://postgres:postgres@localhost:15432/postgres" -v ON_ERROR_STOP=1 -f deploy/dev/initdb/20_wf.sql
      # контекст — корень, как dockerContext в render.yaml; время сборки и размер образа — в журнал (лимиты Render)
      - name: docker build — контекст корня, как на Render
        run: |
          start=$(date +%s)
          docker build -f backend/Dockerfile -t wf-backend .
          echo "сборка: $(( $(date +%s) - start )) с; образ: $(docker image inspect -f '{{.Size}}' wf-backend) байт"
      - name: migrate-then-api — та же команда, что в render.yaml
        run: |
          docker run -d --name wf-api --network host \
            -e API_HTTP_ADDR=127.0.0.1:18080 \
            -e API_DOCS_ENABLED=true \
            -e API_JWT_SEEDS="$(openssl rand -base64 32)" \
            -e API_HUMANCHECK_KEYS="$(openssl rand -base64 32)" \
            -e API_IDENTITY_SECRET_KEYS="$(openssl rand -base64 32)" \
            -e API_IDENTITY_DEVICE_KEYS="$(openssl rand -base64 32)" \
            -e API_IDENTITY_TOTP_ISSUER='WF smoke' \
            -e API_LEGAL_DOCUMENTS='terms=0.1.0|https://example.com/legal/terms,privacy=0.1.0|https://example.com/legal/privacy' \
            -e API_DATABASE_URL='postgres://api:api@127.0.0.1:15432/wf?sslmode=disable' \
            -e MIGRATOR_DATABASE_URL='postgres://migrator:migrator@127.0.0.1:15432/wf?sslmode=disable' \
            -e API_BLOB_BACKEND=none \
            wf-backend migrate-then-api
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              # готовность: API подключается к базе под своей ролью (пинг; права проверяют тесты grants)
              curl -fsS http://127.0.0.1:18080/readyz || { docker logs wf-api; exit 1; }
              # Swagger dev-стенда: контракт вшит в образ и отдаётся
              curl -fsS -o /dev/null http://127.0.0.1:18080/docs/openapi.json || { docker logs wf-api; exit 1; }
              # публичные ручки на настоящей базе под ролью api: сид городов 0019, права grants.sql,
              # сборка cmd/api (geo.New, appversion.NewReader); Ставрополь — первый по населению
              curl -fsS 'http://127.0.0.1:18080/v1/cities?limit=1' | grep -q '"slug":"stavropol"' || { docker logs wf-api; exit 1; }
              curl -fsS 'http://127.0.0.1:18080/v1/app/min-version?platform=android' | grep -q '"platform":"android"' || { docker logs wf-api; exit 1; }
              exit 0
            fi
            sleep 2
          done
          docker logs wf-api
          exit 1
      # admin-api со статикой из образа — как wf-admin-api стенда (план C, Task 1): схему накатил шаг выше. SMTP — на
      # закрытый порт петли без TLS и без логина (Mailpit-режим, единственный допустимый для none — Task 6): старт
      # соединение не проверяет, писем в проверке нет. Ключ сотрудников — одноразовый, base64url (R2).
      - name: admin-api — статика админки, заголовки, конвейер
        run: |
          # журнал контейнера — при любом ненулевом выходе, в том числе когда bash -e оборвал шаг на curl
          trap 'rc=$?; [ "$rc" -eq 0 ] || docker logs wf-admin-api || true; exit "$rc"' EXIT
          fail() { echo "::error::admin-api: $1"; exit 1; }
          docker run -d --name wf-admin-api --network host \
            -e ADMIN_HTTP_ADDR=127.0.0.1:18081 \
            -e ADMIN_DATABASE_URL='postgres://admin:admin@127.0.0.1:15432/wf?sslmode=disable' \
            -e ADMIN_ORIGIN=http://127.0.0.1:18081 \
            -e ADMIN_COOKIE_SECURE=true \
            -e ADMIN_STAFF_SECRET_KEYS="$(openssl rand -base64 32 | tr '+/' '-_')" \
            -e ADMIN_MAIL_SMTP_ADDR=127.0.0.1:1 \
            -e ADMIN_MAIL_SMTP_TLS=none \
            -e 'ADMIN_MAIL_FROM=WF <noreply@wf.local>' \
            -e ADMIN_STATIC_DIR=/app/admin \
            -e ADMIN_BLOB_BACKEND=none \
            wf-backend admin-api
          up=
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18081/healthz; then up=1; break; fi
            sleep 2
          done
          [ -n "$up" ] || fail "/healthz не ответил за 60 с"
          curl -fsS -o /dev/null http://127.0.0.1:18081/readyz || fail "/readyz"
          # index.html: SPA без кэша, CSP сборки, nosniff
          h=$(curl -fsS -D - -o index.html http://127.0.0.1:18081/) || fail "GET / не 200 — dist не в образе?"
          for want in '^content-type: text/html' '^cache-control: no-store' '^content-security-policy: ' \
            '^x-content-type-options: nosniff'; do
            grep -qi "$want" <<<"$h" || fail "GET /: нет заголовка $want"
          done
          # файл сборки из assets/ — с хэшем в имени, кэш навсегда
          asset=$(grep -o '/assets/[^"]*\.js' index.html | head -n 1)
          [ -n "$asset" ] || fail "в index.html нет /assets/*.js"
          curl -fsS -D - -o /dev/null "http://127.0.0.1:18081$asset" | grep -qi '^cache-control: .*immutable' ||
            fail "$asset без immutable"
          # API за тем же origin: без сессии — 401 Problem, вход без Origin — 403 auth.csrf_failed;
          # обрыв соединения — код 000, а не выход bash -e мимо fail
          code=$(curl -sS -o me.json -w '%{http_code}' http://127.0.0.1:18081/v1/staff/me) || code=000
          if ! { [ "$code" = 401 ] && grep -q '"status":401' me.json; }; then
            fail "GET /v1/staff/me: $code $(cat me.json 2>/dev/null)"
          fi
          code=$(curl -sS -o login.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:18081/v1/staff/auth/login) || code=000
          if ! { [ "$code" = 403 ] && grep -q '"code":"auth.csrf_failed"' login.json; }; then
            fail "POST /v1/staff/auth/login без Origin: $code $(cat login.json 2>/dev/null)"
          fi

  # Свой сервер (deploy/server, спека 2026-11-16-embedded-worker §5, I7): compose из того же образа поднимается и
  # исполняет фон. База — сервис db в compose.ci.yaml (не services: job), Caddy — с local_certs. Два прогона: отдельный
  # сервис worker (как на сервере) и api со встроенным воркером (compose.ci-embed.yaml, как на стенде Render).
  # Сквозную отправку письма не проверяет (SMTP — закрытый порт петли контейнера, TLS none): её проверяет выкатка на
  # стенд. Локально — те же шаги по deploy/server/README.md, «Проверка локально».
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build — образ, который compose берёт как WF_IMAGE
        working-directory: .
        run: docker build -f backend/Dockerfile -t wf-backend .
      # рабочие env из шаблонов: значения CI, секреты — одноразовые; кольцо identity одно у api и worker
      - name: env из шаблонов
        run: |
          set_kv() { sed -i "/^$2=/d" "$1"; printf '%s=%s\n' "$2" "$3" >>"$1"; }
          for s in api admin-api worker migrate storage; do cp "$s.env.example" "$s.env"; done
          for s in api admin-api worker; do cp "$s.blob.env.example" "$s.blob.env"; done
          cp .env.example .env
          ring=$(openssl rand -base64 32)
          set_kv migrate.env MIGRATOR_DATABASE_URL 'postgres://migrator:migrator@db:5432/wf?sslmode=disable'
          set_kv api.env API_DATABASE_URL 'postgres://api:api@db:5432/wf?sslmode=disable'
          set_kv api.env API_JWT_SEEDS "$(openssl rand -base64 32)"
          set_kv api.env API_HUMANCHECK_KEYS "$(openssl rand -base64 32)"
          set_kv api.env API_IDENTITY_SECRET_KEYS "$ring"
          set_kv api.env API_IDENTITY_DEVICE_KEYS "$(openssl rand -base64 32)"
          set_kv api.env API_IDENTITY_TOTP_ISSUER 'WF ci'
          set_kv api.env API_LEGAL_DOCUMENTS \
            '"terms=0.1.0|https://example.com/legal/terms,privacy=0.1.0|https://example.com/legal/privacy"'
          set_kv admin-api.env ADMIN_DATABASE_URL 'postgres://admin:admin@db:5432/wf?sslmode=disable'
          set_kv admin-api.env ADMIN_ORIGIN 'https://admin.wf.test'
          set_kv admin-api.env ADMIN_STAFF_SECRET_KEYS "$(openssl rand -base64 32 | tr '+/' '-_')"
          set_kv worker.env WORKER_DATABASE_URL 'postgres://worker:worker@db:5432/wf?sslmode=disable'
          set_kv worker.env WORKER_IDENTITY_SECRET_KEYS "$ring"
          # SMTP — закрытый порт петли контейнера без TLS и логина: старт соединение не проверяет, писем нет
          for f in admin-api.env:ADMIN worker.env:WORKER; do
            file=${f%%:*} p=${f#*:}
            set_kv "$file" "${p}_MAIL_SMTP_ADDR" '127.0.0.1:1'
            set_kv "$file" "${p}_MAIL_SMTP_TLS" none
            set_kv "$file" "${p}_MAIL_FROM" '"WF <noreply@wf.test>"'
            sed -i "/^${p}_MAIL_SMTP_USERNAME=/d;/^${p}_MAIL_SMTP_PASSWORD=/d" "$file"
          done
          set_kv .env WF_IMAGE wf-backend
          set_kv .env WF_API_DOMAIN api.wf.test
          set_kv .env WF_ADMIN_DOMAIN admin.wf.test
          set_kv .env WF_ACME_EMAIL ci@wf.test
          # хранилище: секреты Garage и ключи процессов — одноразовые в формате Garage (README, «Хранилище файлов»),
          # внешние адреса — домены CI
          set_kv storage.env GARAGE_RPC_SECRET "$(openssl rand -hex 32)"
          set_kv storage.env GARAGE_ADMIN_TOKEN "$(openssl rand -base64 32)"
          for f in api.blob.env:API admin-api.blob.env:ADMIN worker.blob.env:WORKER; do
            file=${f%%:*} p=${f#*:}
            set_kv "$file" "${p}_BLOB_S3_PUBLIC_ENDPOINT" https://storage.wf.test
            set_kv "$file" "${p}_MEDIA_PUBLIC_BASE_URL" https://media.wf.test/
            set_kv "$file" "${p}_BLOB_S3_ACCESS_KEY" "GK$(openssl rand -hex 12)"
            set_kv "$file" "${p}_BLOB_S3_SECRET_KEY" "$(openssl rand -hex 32)"
          done
          set_kv .env WF_MEDIA_DOMAIN media.wf.test
          set_kv .env WF_STORAGE_DOMAIN storage.wf.test
          set_kv .env WF_WEB_ORIGIN https://wf.test
      # прод-файл держит встроенный режим выключенным: config на шаблоне .env.example, с оверлеем CI — тоже
      - name: compose config — API_EMBED_WORKER у api = "false"
        run: |
          for files in '-f compose.yaml' '-f compose.yaml -f compose.ci.yaml'; do
            # shellcheck disable=SC2086
            docker compose --env-file .env.example $files config --format json |
              jq -e '.services.api.environment.API_EMBED_WORKER == "false"' >/dev/null ||
              { echo "::error::$files: у api API_EMBED_WORKER не \"false\""; exit 1; }
          done
      # скрипт — в файле: actionlint 1.7.12 на Windows виснет на run: длиннее ~4 КиБ (шапка ci-check.sh)
      - name: подъём и исполнение фона — отдельный worker, затем встроенный в api
        run: bash ci-check.sh
