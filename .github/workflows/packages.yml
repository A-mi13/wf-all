name: packages
on:
  push:
    branches: [main]
    paths: &paths
      - 'packages/**'
      - 'contracts/**'
      - 'design/tools/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'eslint.config.mjs'
      - 'Taskfile.yml'
      - '.github/workflows/packages.yml'
  pull_request:
    paths: *paths
permissions:
  contents: read
# новый пуш в PR отменяет его устаревший прогон; на main прогоны не отменяются — по ним деплой
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Go-инструменты (task, линтеры, oasdiff…) собираются из исходников ~1.5 минуты — кеш по их
      # пинам; bootstrap.sh сверяет отметку и пересобирает только при расхождении
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/**/go.mod', 'tools/**/go.sum', 'scripts/bootstrap.sh') }}
      - run: bash scripts/bootstrap.sh
      - run: ./task packages:ci design:test
