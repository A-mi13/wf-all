name: backend
on:
  push:
    branches: [main]
    paths: &paths
      - 'backend/**'
      - 'contracts/openapi/**'
      - 'tools/**'
      - 'scripts/**'
      - 'Taskfile.yml'
      - 'package.json'
      - 'deploy/dev/initdb/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths: *paths
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: pnpm/action-setup@v6
      - run: bash scripts/bootstrap.sh
      # сервис postgis/postgis не видит deploy/dev/initdb — накатываем роли и расширения вручную
      - run: psql "postgresql://postgres:postgres@localhost:15432/postgres" -v ON_ERROR_STOP=1 -f deploy/dev/initdb/20_wf.sql
      - run: ./task backend:ci
