name: backend
on:
  push:
    branches: [main]
    paths: &paths
      - 'backend/**'
      - 'contracts/openapi/**'
      - 'contracts/scripts/**'
      - 'contracts/package.json'
      - 'contracts/oasdiff-severity.txt'
      - 'contracts/oasdiff-err-ignore-admin.txt'
      - 'pnpm-lock.yaml'
      - 'tools/**'
      - 'scripts/**'
      - 'Taskfile.yml'
      - 'package.json'
      - 'deploy/dev/initdb/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths: *paths
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: bash scripts/bootstrap.sh
      # сервис postgis/postgis не видит deploy/dev/initdb — накатываем роли и расширения вручную
      - run: psql "postgresql://postgres:postgres@localhost:15432/postgres" -v ON_ERROR_STOP=1 -f deploy/dev/initdb/20_wf.sql
      - run: ./task backend:ci
      # ломающее изменение контракта валит PR; ломать — только в /v2 (спека §8.3)
      - run: ./task contracts:breaking
        env:
          CONTRACTS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
