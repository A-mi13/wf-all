name: backend
on:
  push:
    branches: [main]
    paths: &paths
      - 'backend/**'
      - 'contracts/openapi/**'
      - 'contracts/scripts/**'
      - 'contracts/package.json'
      - 'contracts/oasdiff-severity.txt'
      - 'contracts/oasdiff-err-ignore-admin.txt'
      - 'pnpm-lock.yaml'
      - 'tools/**'
      - 'scripts/**'
      - 'Taskfile.yml'
      - 'package.json'
      - 'deploy/dev/initdb/**'
      - 'render.yaml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths: *paths
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: bash scripts/bootstrap.sh
      # сервис postgis/postgis не видит deploy/dev/initdb — накатываем роли и расширения вручную
      - run: psql "postgresql://postgres:postgres@localhost:15432/postgres" -v ON_ERROR_STOP=1 -f deploy/dev/initdb/20_wf.sql
      - run: ./task backend:ci
      # ломающее изменение контракта валит PR; ломать — только в /v2 (спека §8.3)
      - run: ./task contracts:breaking
        env:
          CONTRACTS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
  # Образ бэкенда (backend/Dockerfile) собирается и запускается так же, как на dev-стенде Render:
  # миграции на чистую базу, затем API, затем /v1/health. Локально Docker не работает — проверка здесь.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: psql "postgresql://postgres:postgres@localhost:15432/postgres" -v ON_ERROR_STOP=1 -f deploy/dev/initdb/20_wf.sql
      - run: docker build -t wf-backend backend
      - name: migrate-then-api — та же команда, что в render.yaml
        run: |
          docker run -d --name wf-api --network host \
            -e API_HTTP_ADDR=127.0.0.1:18080 \
            -e API_DATABASE_URL='postgres://api:api@127.0.0.1:15432/wf?sslmode=disable' \
            -e MIGRATOR_DATABASE_URL='postgres://migrator:migrator@127.0.0.1:15432/wf?sslmode=disable' \
            wf-backend migrate-then-api
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/v1/health; then
              # Swagger dev-стенда: контракт вшит в образ и отдаётся
              curl -fsS -o /dev/null http://127.0.0.1:18080/docs/openapi.json
              exit 0
            fi
            sleep 2
          done
          docker logs wf-api
          exit 1
