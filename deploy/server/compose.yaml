# Свой сервер (спека 2026-11-16-embedded-worker §5): тот же образ, что на dev-стенде Render, — migrate, api, admin-api,
# worker, хранилище файлов storage (Garage) с разовой настройкой storage-init и Caddy (TLS и маршрутизация по доменам,
# включая домен медиа и адрес хранилища). Переход со стенда — правкой конфигурации, без правок кода:
# подготовка, выкатка и порядок перехода — README.md рядом.
#
# Запуск из этого каталога: docker compose up -d (переменные уровня compose — .env, шаблон .env.example;
# переменные бинарников — <сервис>.env и ключи хранилища <сервис>.blob.env, шаблоны — те же имена с .example). База по умолчанию — Neon (строки в *.env);
# вариант «база на сервере» — закомментированный сервис db ниже и раздел README.
# Проверка в CI и локально — поверх этого файла compose.ci.yaml (база в compose, local_certs) и compose.ci-embed.yaml
# (второй прогон: api со встроенным воркером); страж файлов — server_compose_test.go (config).

name: wf

# Общее для бинарников бэкенда: один образ, команда контейнера выбирает процесс (backend/Dockerfile).
x-backend:
  &backend # тег релиза из реестра; сервер — на том же коммите, что стенд (README, «Переход со стенда»)
  image: ${WF_IMAGE:?WF_IMAGE — образ бэкенда с тегом релиза, см. .env.example}
  restart: unless-stopped
  # окно между SIGTERM и SIGKILL — как у Render (config.StopWindow 30 с); бюджет процессов — 25 с (config.StopBudget)
  stop_grace_period: 30s
  networks: [wf]

# Живость — /healthz (процесс жив, базу не трогает), не /readyz: частые пробы не будят Neon free (m6).
# В образе alpine нет curl — busybox wget.
x-health: &health
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  # Миграции и права ролей (grants) — разово перед сервисами; они стартуют только после успешного выхода.
  migrate:
    <<: *backend
    command: ['migrate', 'up']
    env_file: migrate.env
    restart: 'no'

  api:
    <<: *backend
    command: ['api']
    # ключи хранилища — отдельным файлом (его же читает storage-init)
    env_file: [api.env, api.blob.env]
    environment:
      # Встроенный воркер в проде запрещён (README, «Встроенный режим — только стенд»): фон исполняет отдельный
      # сервис worker. Значение здесь перекрывает api.env; страж — TestServerComposeNoEmbeddedWorker и job server
      # в .github/workflows/image.yml.
      API_EMBED_WORKER: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully
      # бакеты, ключи и права хранилища готовы (storage/init.sh); init упал — процессы не стартуют
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *health
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
    # порты наружу не публикуются: снаружи — только Caddy

  admin-api:
    <<: *backend
    command: ['admin-api']
    # ключи хранилища — отдельным файлом (его же читает storage-init)
    env_file: [admin-api.env, admin-api.blob.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      # бакеты, ключи и права хранилища готовы (storage/init.sh); init упал — процессы не стартуют
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *health
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/healthz']

  # Фон: River, relay outbox, периодика. HTTP нет — без healthcheck; журнал старта — «воркер запущен».
  worker:
    <<: *backend
    command: ['worker']
    # ключи хранилища — отдельным файлом (его же читает storage-init)
    env_file: [worker.env, worker.blob.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      # бакеты, ключи и права хранилища готовы (storage/init.sh); init упал — процессы не стартуют
      storage-init:
        condition: service_completed_successfully

  # Хранилище файлов (спека media §6.5, план R1): Garage, один узел, данные и метаданные — том storage_data.
  # AGPLv3, отдельный сервис без изменений (README, «Хранилище файлов»). Порты не публикуются: S3 (3900), сайт
  # публичного бакета (3902) и admin API (3903) — только в сети wf; снаружи — Caddy (Caddyfile).
  storage:
    # тег — docs/versions.md, тот же, что у dev-хранилища scripts/s3.sh (страж TestServerComposeStorageInit)
    image: dxflrs/garage:v2.6.0
    restart: unless-stopped
    stop_grace_period: 30s
    # GARAGE_RPC_SECRET и GARAGE_ADMIN_TOKEN (шаблон storage.env.example)
    env_file: storage.env
    volumes:
      - ./storage/garage.toml:/etc/garage.toml:ro
      - storage_data:/var/lib/garage
    # образ без оболочки и wget — CLI самого Garage: узел отвечает по RPC
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [wf]

  # Разовая настройка хранилища перед процессами (storage/init.sh; повторный запуск безопасен): слой узла, бакеты
  # wf-in, wf-pub, wf-priv, импорт ключей процессов из их env с правами R2, сайт wf-pub, lifecycle и CORS wf-in.
  # Через admin API Garage — ключа с правом owner нет ни у кого.
  storage-init:
    # тег — docs/versions.md; busybox sh + curl. Сторонний образ видит секреты хранилища — закреплён по digest (индекс
    # мультиплатформенного образа): подмена тега в реестре не пройдёт. Обновление — тег и digest вместе
    # (docker buildx imagetools inspect curlimages/curl:<тег>, строка Digest)
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    restart: 'no'
    entrypoint: ['sh', '/init.sh']
    # токен admin API и ключи процессов (*_BLOB_S3_ACCESS_KEY, *_SECRET_KEY, *_BUCKET_*) — из тех же файлов, что у
    # процессов (<сервис>.blob.env): один источник ключей. env процессов целиком (база, кольца, SMTP) init не получает.
    env_file:
      - storage.env
      - api.blob.env
      - admin-api.blob.env
      - worker.blob.env
    environment:
      # CORS загрузки в wf-in (подписанный POST из браузера)
      WF_WEB_ORIGIN: ${WF_WEB_ORIGIN:?WF_WEB_ORIGIN — origin веба для CORS загрузки, см. .env.example}
    volumes:
      - ./storage/init.sh:/init.sh:ro
    depends_on:
      storage:
        condition: service_healthy
    networks: [wf]

  caddy:
    # тег — docs/versions.md
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # на сервере — 80/443; переменные — для локальной проверки, где порты хоста могут быть заняты
      - '${WF_HTTP_PORT:-80}:80'
      - '${WF_HTTPS_PORT:-443}:443'
      - '${WF_HTTPS_PORT:-443}:443/udp'
    environment:
      WF_API_DOMAIN: ${WF_API_DOMAIN:?WF_API_DOMAIN — домен API, см. .env.example}
      WF_ADMIN_DOMAIN: ${WF_ADMIN_DOMAIN:?WF_ADMIN_DOMAIN — домен админки, см. .env.example}
      WF_ACME_EMAIL: ${WF_ACME_EMAIL:?WF_ACME_EMAIL — почта для ACME, см. .env.example}
      WF_MEDIA_DOMAIN: ${WF_MEDIA_DOMAIN:?WF_MEDIA_DOMAIN — домен медиа, см. .env.example}
      WF_STORAGE_DOMAIN: ${WF_STORAGE_DOMAIN:?WF_STORAGE_DOMAIN — адрес хранилища, см. .env.example}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # сертификаты и ключ ACME-учётки: том не удалять (лимиты выдачи Let's Encrypt)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    networks: [wf]

  # Вариант «база на сервере» (не по умолчанию; README, «База на сервере»): раскомментировать, строки *.env — к db:5432,
  # sslmode=disable (трафик внутри сети wf), migrate — depends_on db service_healthy, как в compose.ci.yaml.
  # db:
  #   image: postgis/postgis:18-3.6
  #   restart: unless-stopped
  #   stop_grace_period: 30s
  #   environment:
  #     POSTGRES_PASSWORD: <пароль-суперпользователя>
  #   volumes:
  #     - db_data:/var/lib/postgresql
  #     # роли migrator/api/admin/worker и расширения; пароли ролей в 20_wf.sql — dev, на сервере сменить (README)
  #     - ../dev/initdb:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'wf']
  #     interval: 2s
  #     timeout: 3s
  #     retries: 30
  #   networks: [wf]

# Фиксированная подсеть: её доверяют API_TRUSTED_PROXIES и ADMIN_TRUSTED_PROXIES (*.env.example) — X-Forwarded-For
# принимается только от Caddy. Меняешь подсеть — меняй и их.
networks:
  wf:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  caddy_data:
  caddy_config:
  # файлы и метаданные хранилища: бэкап по расписанию, том не удалять (README, «Хранилище файлов»)
  storage_data:
  # db_data:
