# Правила gitleaks — встроенные; исключение одно: контракт, вшитый oapi-codegen в api.gen.go
# (swaggerSpec — gzip в base64, строки по 80 символов). Случайный кусок base64 похож на ключ
# (generic-api-key), и находка плавает от правки к правке текста контракта. Секрет в контракте
# ловится в его исходниках contracts/openapi/**; в api.gen.go пропускаются только находки в
# строках base64 (находка начинается в такой строке и может захватить следующую), остальной код
# файла проверяется. Разделитель пути — / и \ (Windows). Проверено в режиме git (pre-commit и
# ./task secrets); в режиме dir gitleaks 8.30 не заполняет строку находки — исключение там не действует.
[extend]
useDefault = true

[[allowlists]]
description = "контракт, вшитый в api.gen.go (base64 от gzip)"
condition = "AND"
paths = ['''backend[/\\]internal[/\\]httpapi[/\\][a-z]+[/\\]oapi[/\\]api\.gen\.go$''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9+/=]{80}",''']

[[allowlists]]
description = "тестовый вектор RFC 6238 (TOTP): base32 от ASCII «12345678901234567890» — публичный, не секрет"
regexes = ['''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''']

[[allowlists]]
description = "примеры identity (план I-1): authenticatorData WebAuthn и JWT в контракте (подпись — слово signature), выдуманные токены в nostub_test.go — форматы, не секреты"
regexes = [
  '''SZYN5YgOjGh0NBcPZHZgW4_krrmihjLHmVzzuoMdl2MFAAAAAQ''',
  '''eyJhbGciOiJFZERTQSIsImtpZCI6Ikh4M2s5UXBMIn0.eyJzdWIiOiIwMTkzMmYxYy03YTNlIn0.c2lnbmF0dXJl''',
  '''Yx3kQp1bZt7Lm2Vb4Np8Rt1Zw6Yc0Hs5Ae9Df3Gh7Jk''',
  '''UmVzdG9yZS10b2tlbi0yNTYtYml0cy1iYXNlNjR1cmwtYWJj''',
  '''Qm9vdHN0cmFwLW1mYS10b2tlbi0yNTYtYml0cy1iYXNlNjR1''',
]
